 courtier_guest_management.0500.t:0 "[SCOPE.sC('host').Custom2('RelationToMeShort', SCOPE.sC('guest'))|U] Leaving Your [GetPlayer.Custom('GetCourt')|U]"
 courtier_guest_management.0500.desc:0 "Your [SCOPE.sC('host').Custom2('RelationToMeShort', SCOPE.sC('guest'))], [guest.GetTitledFirstName], has no reason to remain in your [GetPlayer.Custom('GetCourtConcept')] and will soon depart with [guest.GetHerHis] family"
