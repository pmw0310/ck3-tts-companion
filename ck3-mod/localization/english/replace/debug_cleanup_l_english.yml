 courtier_guest_management.desc:0 "Your [SCOPE.sC('liege').Custom2('RelationToMeShort', SCOPE.sC('child'))], [child.GetShortUIName], has no reason to remain in your [GetPlayer.Custom('GetCourtConcept')] and will soon depart"
 tgp_hunt.0005.c:0 "Perhaps [Select_CString( SCOPE.sC('target_character').IsValid, SCOPE.sC('target_character').GetFirstNameNoTooltip, 'the hunter' )] has an idea?"
 tgp_hunt.0007.b.flavor:0 "Does [Select_CString( SCOPE.sC('target_character').IsValid, SCOPE.sC('target_character').GetFirstNameNoTooltip, 'the hunter' )] have honor?"
 tgp_hunt.0008.a:0 "I will try to convince [Select_CString( SCOPE.sC('target_character').IsValid, SCOPE.sC('target_character').GetFirstNameNoTooltip, 'the hunter' )] to reconsider."
  laamp_base_contract_schemes.2004.desc:0 "[employer.GetTitledFirstNamePossessive] representative is swift and to the point: the city of [Select_CString( SCOPE.sTitle('destination_1').IsValid, SCOPE.sTitle('destination_1').GetBaseNameNoTier, 'the destination' )] has, it seems, failed to pay an extra tax imposed by the good [employer.GetTitleAsNameNoTooltip].\n\nThe residents have resisted further demands but not #EMP quite#! marched into open revolt just yet. [employer.GetFirstNameNoTooltip] wants [employer.GetHerHis] due, but is cautious of the potential costs of an outright rebellion.\n\nA neutral third party is a convenient fiction for browbeating the recalcitrant settlement's leader, one [Select_CString( SCOPE.sC('person_a').IsValid, SCOPE.sC('person_a').GetTitledFirstName, 'the settlement leader' )], into submission.\n\nAll that waits is the journey to [Select_CString( SCOPE.sTitle('destination_1').IsValid, SCOPE.sTitle('destination_1').GetBaseNameNoTierNoTooltip, 'the destination' )]."
  laamp_base_contract_schemes.2004.tt.destination_list:0 "You immediately begin traveling to [Select_CString( SCOPE.sTitle('destination_1').IsValid, SCOPE.sTitle('destination_1').GetBaseNameNoTier, 'the destination' )]"
 ep3_emperor_yearly.8000.desc:0 "\n\nRecent conflicts have taken their toll: the recruiters increasingly struggle to meet their quotas, and labor shortages of all stripes arise across the city.\n\nMy [Select_CString( SCOPE.sC('suggestor').IsValid, ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('suggestor')), 'loyal' )] [Select_CString( SCOPE.sC('suggestor').IsValid, suggestor.GetTitledFirstName, 'courtier' )], has compiled a list of prosperous provinces, whose fortune may give succor in the capital's time of need."
 ep3_emperor_yearly.8020.desc:0 "\n\nAfter many heavily pointed hints and suggestions of the benefits of dependable sponsorship, my [Select_CString( SCOPE.sC('suggestor').IsValid, ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('suggestor')), 'loyal' )] [Select_CString( SCOPE.sC('suggestor').IsValid, suggestor.GetTitledFirstName, 'courtier' )], has finally laid [suggestor.GetHerHis] cards on the table.\n\n\"Your Imperial Majesty... The [Glossary( 'porphyra', 'PORPHURA_GLOSS' )] is an imperial prerogative, to be sure, but leasing it out to, ah, #EMP dedicated#! servants is not unheard of.\""
 holy_order.2050.desc:0 "\"Are [target_order.GetName] still suffering... as the hermits in the desert did?\" — so begin all of [Select_CString( SCOPE.sC('clerical_helper').IsValid, clerical_helper.GetNamePossessive, 'their' )] fiery missives.\n\n\"Is [target_lessee.GetTitledFirstName] dressing [target_lessee.GetHerselfHimself] in gold?\" — ask the reformers' sermons in [barony.GetNameNoTier], and they end with: #EMP \"A new way! A new Rule!\"#!\n\nThe monastery is fast becoming a hotbed of pious reform and dissent. Its residents are hardly [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip] any longer, and hardly content with stale talk of [target_order_tenet.GetName( founder.GetRite )]. But their reforming spirit must still be directed to one new principle, and one mind."
 court.6010.c.tt:0 "[preacher.GetHerHis|U] liege, [Select_CString( SCOPE.sC('preacher_liege').IsValid, SCOPE.sC('preacher_liege').GetTitledFirstName, 'their lord' )], will be displeased."
 activity_pulse_action_admired_venue:0 "[Select_CString( SCOPE.sC('first').IsValid, SCOPE.sC('first').GetShortUINameNoTooltip, 'An Attendee' )|U] Stopped to Admire the Venue"
 pick_becomes_monastic_order_leader_tt:0 "[chosen_leader.GetShortUIName] becomes [ruler|E] of [Select_CString( SCOPE.sTitle('monastic_order').IsValid, monastic_order.GetName, 'the monastic order' )]"
 pick_remains_monastic_order_leader_tt:0 "[chosen_leader.GetShortUIName] remains [ruler|E] of [Select_CString( SCOPE.sTitle('monastic_order').IsValid, monastic_order.GetName, 'the monastic order' )]"
 monastic_order_tenet_advocated_tt:0 "[Select_CString( SCOPE.sTitle('monastic_order').IsValid, monastic_order.GetName, 'The monastic order' )] advocates for [tenet_pick.GetName( order_rite )]"
 monastic_tenet_pick_tt:0 "[tenet_pick.GetName( order_rite )] will be the [core_tenet|E] advocated by [Select_CString( SCOPE.sTitle('monastic_order').IsValid, monastic_order.GetName, 'the monastic order' )]"
 monastic_order_entering_interaction_range_tt:0 "@alert_icon! #alert_trial [Select_CString( SCOPE.sTitle('monastic_order').IsValid, monastic_order.GetName, 'The monastic order' )] will enter [holy_order_vicinity|E], enabling [interactions|E]#!"
 i_created_monastic_holy_order_message:0 "With your support, [new_monastic_leader.GetShortUIName] has founded [Select_CString( new_holy_order.GetTitle.IsValid, new_holy_order.GetTitle.GetName, Select_CString( new_holy_order.IsValid, new_holy_order.GetName, 'a monastic order' ) )]!"
 holy_order.2010.desc:0 "Hermits, mystics, and dissatisfied disciples from older orders have gathered in [barony.GetNameNoTier] and labored, for years, to build their new home in the wilderness. A [leader.GetWomanMan] named [leader.Custom('SisterBrother')|U] [leader.GetFirstName] has risen as the natural head of this burgeoning [Select_CString( leader.GetPrimaryTitle.IsValid, leader.GetPrimaryTitle.GetName, 'Order' )]... but #EMP my#! august voice has yet to be heard on this matter. I have yet, also, to propose a holy precept to enshrine as the heart of this Order's way of life.\n\nWhat shall this chorus of pure devotees sing of in [barony.GetNameNoTierNoTooltip]? What shall they labor to live in full, to think and write on? And who shall lead them in this?"
