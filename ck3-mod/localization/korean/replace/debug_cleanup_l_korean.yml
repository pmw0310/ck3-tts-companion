 TTS_ACTIVITY_EVENT_TOOLTIP:0 "TTS 이벤트 다시 듣기 (단축키: F)\n#weak ※ 대형 활동(대관식, 대규모 결혼식, 사냥, 연회, 순례, 토너먼트 등) 이벤트는 자동으로 낭독되며, F 키 또는 스피커 버튼을 눌러 언제든 다시 들을 수 있습니다.#!"
