 i_created_monastic_holy_order_message:0 "당신의 지원 덕분에 [new_monastic_leader.GetShortUIName](이)가 수도회를 창설했습니다!"
 holy_order.2010.desc:0 "옛 수도회의 은수자, 신비주의자, 만족하지 못한 제자들이 [barony.GetNameNoTier]에 모여들어 황야에 새로운 집을 짓고자 수년 동안 노력했다. [leader.GetFirstName] [leader.Custom('SisterBrother')|U]라는 [leader.GetWomanMan]이 자연스럽게 이 신흥 수도회의 우두머리가 되었다... 하지만 이 사안에 대해 아직 #EMP 내#! 위엄 있는 의견을 내지 않았다. 또한 이 수도회에서 생활 방식의 중심으로 소중히 여길 신성한 계율도 아직 제안하지 않은 상황이다.\n\n이 순수한 신자들의 합창이 [barony.GetNameNoTierNoTooltip]에서 무엇을 노래로 불러야 할까? 저들은 무엇을 위해 노력하며 충만한 삶을 살고, 생각하고, 글을 써야 할까? 또한 누가 이들을 이끌어야 할 것인가?"
 hostile_scheme_discovery.1001.desc_other_target:0 "[spymaster.GetCouncilTitle](이)가 무언가를 알아냈다면서 찾아왔다. 그리고는 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))]인 [agent.GetTitledFirstName](이)가 나의 [AddTextIf( SCOPE.sC('targeted_courtier').IsValid, Concatenate( ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier')), '인 ' ) )][Select_CString( SCOPE.sC('targeted_courtier').IsValid, SCOPE.sC('targeted_courtier').GetTitledFirstName, '궁정 신하' )](을)를 겨냥하여 모략을 꾸미는 중이라고 했다!"
 hostile_scheme_discovery.1001.close_relation_other_target:0 "[spymaster.GetCouncilTitle](이)가 심각한 소식이 있다면서 찾아왔다. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))]인 [agent.GetTitledFirstName](이)가 나의 [AddTextIf( SCOPE.sC('targeted_courtier').IsValid, Concatenate( ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier')), '인 ' ) )][Select_CString( SCOPE.sC('targeted_courtier').IsValid, SCOPE.sC('targeted_courtier').GetTitledFirstName, '궁정 신하' )](을)를 겨냥하여 모략을 꾸미고 있다면서 말이다!"
 hostile_scheme_discovery.1001.desc_no_spymaster_other_target:0 "심각한 소식이 전해졌다. 내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))]인 [agent.GetTitledFirstName](이)가 내 [AddTextIf( SCOPE.sC('targeted_courtier').IsValid, Concatenate( ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier')), ' ' ) )][Select_CString( SCOPE.sC('targeted_courtier').IsValid, SCOPE.sC('targeted_courtier').GetTitledFirstName, '궁정 신하' )](을)를 대상으로 모략을 꾸미는 중이라 한다!"
 hostile_scheme_discovery.1001.close_relation_no_spymaster_other_target:0 "심각한 소식을 들었다. 다른 사람도 아니고 나의 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))]인 [agent.GetTitledFirstName](이)가 내 [AddTextIf( SCOPE.sC('targeted_courtier').IsValid, Concatenate( ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier')), ' ' ) )][Select_CString( SCOPE.sC('targeted_courtier').IsValid, SCOPE.sC('targeted_courtier').GetTitledFirstName, '궁정 신하' )](을)를 대상으로 모략을 꾸미고 있다!"
  consecrate_kingdom_additional_duchy_exclave_tt:0 "[additional_duchy.GetName](을)를 [founder.GetShortUINamePossessive] 새로운 [kingdom|E]의 [de_jure|E]에 추가할 수 있음 #EMP #weak (추가하지 않으면 현재 왕국 내의 단절 영지가 됨)#!#!"
