 courtier_guest_management.0500.t:0 "[SCOPE.sC('host').Custom2('RelationToMeShort', SCOPE.sC('guest'))|U](이)가 당신의 [GetPlayer.Custom('GetCourt')|U]에서 떠나다"
 courtier_guest_management.0500.desc:0 "당신의 [SCOPE.sC('host').Custom2('RelationToMeShort', SCOPE.sC('guest'))] [guest.GetTitledFirstName](은)는 당신의 [GetPlayer.Custom('GetCourtConcept')]에 머물 이유가 없으므로 [guest.GetHerHis] 가족과 함께 곧 떠날 것입니다."
 courtier_guest_management.0001.t:0 "[SCOPE.sC('liege').Custom2('RelationToMeShort', SCOPE.sC('child'))|U](이)가 당신의 [GetPlayer.Custom('GetCourt')|U]에서 떠나다"
 courtier_guest_management.desc:0 "당신의 [SCOPE.sC('liege').Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetShortUIName](은)는 당신의 [GetPlayer.Custom('GetCourtConcept')]에 머물 이유가 없으므로 곧 떠날 것입니다."
 tgp_hunt.0005.c:0 "혹시 [Select_CString( SCOPE.sC('target_character').IsValid, SCOPE.sC('target_character').GetFirstNameNoTooltip, '사냥꾼' )]에게 좋은 생각이 있지 않을까?"
 tgp_hunt.0007.b.flavor:0 "[Select_CString( SCOPE.sC('target_character').IsValid, SCOPE.sC('target_character').GetFirstNameNoTooltip, '그 사냥꾼' )](은)는 명예를 아는 사람일까?"
 tgp_hunt.0008.a:0 "[Select_CString( SCOPE.sC('target_character').IsValid, SCOPE.sC('target_character').GetFirstNameNoTooltip, '사냥꾼' )]의 마음을 돌리려 설득해 본다."
  laamp_base_contract_schemes.2004.desc:0 "[employer.GetTitledFirstNamePossessive] 대표자는 빠르게 본론으로 넘어갔다. [Select_CString( SCOPE.sTitle('destination_1').IsValid, SCOPE.sTitle('destination_1').GetBaseNameNoTier, '대상 영지' )]의 도시는 [employer.GetTitleAsNameNoTooltip](이)가 부과한 추가 세금을 내지 못하고 있었다.\n\n주민들은 과한 요구에 저항하고 있으나 #EMP 아직#! 대놓고 봉기를 일으킬 정도는 아니었다. [employer.GetFirstNameNoTooltip](은)는 세금을 원하지만, 전면적인 반란이 터질지도 모르는 가능성을 경계하고 있었다.\n\n중립적인 위치에 있는 제삼자는 반항적인 정착지의 지도자, [Select_CString( SCOPE.sC('person_a').IsValid, SCOPE.sC('person_a').GetTitledFirstName, '정착지 지도자' )](을)를 굴복시키기 위한 편리한 핑계일 뿐이다.\n\n이제 [Select_CString( SCOPE.sTitle('destination_1').IsValid, SCOPE.sTitle('destination_1').GetBaseNameNoTierNoTooltip, '대상 영지' )](을)를 향한 여정만이 남았다."
  laamp_base_contract_schemes.2004.tt.destination_list:0 "바로 [Select_CString( SCOPE.sTitle('destination_1').IsValid, SCOPE.sTitle('destination_1').GetBaseNameNoTier, '대상 영지' )](으)로 이동 시작"
 ep3_emperor_yearly.8000.desc:0 "\n\n최근 벌어진 갈등으로 상당한 피해가 발생했다. 신병 모집관은 할당량을 채우기 힘들어하고, 도시 전역에서 노동력 부족으로 인한 문제가 빈번히 나타난다.\n\n나의 [Select_CString( SCOPE.sC('suggestor').IsValid, ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('suggestor')), '충성스러운' )] [Select_CString( SCOPE.sC('suggestor').IsValid, suggestor.GetTitledFirstName, '궁정 신하' )](은)는 힘든 시기에 수도를 지원할 수 있는 부유한 지방의 목록을 작성했다."
 ep3_emperor_yearly.8020.desc:0 "\n\n믿음직한 후원의 혜택에 대해 수많은 명백한 암시와 필요성을 넌지시 언급한 후, 나의 [Select_CString( SCOPE.sC('suggestor').IsValid, ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('suggestor')), '충성스러운' )] [Select_CString( SCOPE.sC('suggestor').IsValid, suggestor.GetTitledFirstName, '궁정 신하' )](은)는 마침내 솔직히 말했다.\n\n\"폐하... [Glossary( '포르피라', 'PORPHURA_GLOSS' )]는 황실만의 특권이지만, 그것을 #EMP 헌신적인#! 신하들에게... 임대하는 경우는 드물지 않았습니다.\""
 holy_order.2050.desc:0 "\"[target_order.GetName](은)는 사막의 은둔자가 그러했듯... 아직 고통받고 있는가?\" [Select_CString( SCOPE.sC('clerical_helper').IsValid, clerical_helper.GetNamePossessive, '보내온' )] 열렬한 서신은 모두 이런 식으로 시작되었다.\n\n\"[target_lessee.GetTitledFirstName](이)가 몸에 황금을 두르고 있는가?\" [barony.GetNameNoTier]에서 개혁가들의 설교를 들어보면 이런 식으로 끝난다. #EMP \"새로운 길! 새로운 규율!\"#!\n\n수도원은 경건한 개혁과 반대 의견이 공존하는 온상이 되어가고 있다. 거주자들은 더 이상 [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip](이)라 하기도 힘들며, 진부한 [target_order_tenet.GetName( founder.GetRite )] 대화로는 거의 만족하지도 않는다. 그러나 이들의 개혁 정신은 여전히 하나의 새로운 원칙과 하나의 정신으로 향해야만 한다."
