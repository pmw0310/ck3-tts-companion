 TTS_ACTIVITY_EVENT_TOOLTIP:0 "TTS 이벤트 낭독 (단축키: F)\n#weak ※ 대형 활동(대관식, 대규모 결혼식 등) 이벤트는 안정성을 위해 자동 재생이 지원되지 않으며, F 키 또는 스피커 버튼을 눌러 수동으로 낭독합니다.#!"
