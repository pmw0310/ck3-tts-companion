 bookmark_reincarnated_idi_amin_subheading:0 "파주글리와 센나르의 셰이크"
 bookmark_reincarnated_idi_amin_desc:0 "우간다의 종신 대통령이자 스스로에게 '스코틀랜드의 마지막 왕', '대영제국의 정복자' 등 온갖 황당무계한 칭호를 수여했던 검은 거인 이디 아민 다다는, 서기 867년 나일강 상류의 파주글리와 센나르 성채를 틀어쥔 무슬림 씨족 군벌로 눈을 떴습니다.\n\n비록 훈장으로 도배된 원수 제복도, 정복했다고 자랑할 대영제국도 아직 존재하지 않는 천 년 전의 아프리카지만, 헤비급 복싱 챔피언 출신의 압도적인 무력과 적산을 몰수해 측근들에게 나눠 주는 패거리 공포 정치는 중세 전장에서 오히려 물 만난 고기나 다름없습니다! 나일강의 악어들에게 정적을 던져 주며 폭군으로 군림한 그가, 과연 아프리카를 평정하고 바다 건너 진짜 스코틀랜드 왕관까지 손에 넣을 수 있을까요?"
