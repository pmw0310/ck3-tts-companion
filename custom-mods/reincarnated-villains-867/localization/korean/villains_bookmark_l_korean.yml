 bolshevism_ghw_name:0 "적색 혁명전쟁"
 bolshevism_ghw_name_plural:0 "적색 혁명전쟁"
 bookmark_reincarnated_mussolini:0 "두체 베니토 무솔리니"
 bookmark_reincarnated_mussolini_subheading:0 "롬바르디아와 브레시아의 백작"
 bookmark_reincarnated_mussolini_desc:0 "파르티잔의 총탄에 쓰러졌던 베니토 무솔리니는 서기 867년 자신의 정치적 고향 밀라노와 브레시아의 젊은 봉건 백작으로 눈을 떴습니다.\n\n남쪽 로마에는 교황이 버티고 북쪽에는 카롤링거 왕가가 군림하는 난세지만, 고대 로마의 영광을 되찾겠다는 그의 과장된 몸짓과 허세는 이미 하늘을 찌르고 있습니다. 알프스 너머 인스브루크의 히틀러와 다시금 강철의 동맹을 맺은 두체가, 과연 이번에는 민폐가 아닌 진짜 카이사르로 거듭날 수 있을까요?"
 dynn_Mussolini_867:0 "무솔리니"
 dynn_Mussolini_867_motto:0 "믿으라, 복종하라, 싸우라!"
 nick_the_duce:0 "검은 셔츠의 카이사르"
 nick_the_duce_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 검은셔츠단을 앞세워 고대 로마 제국의 부활을 부르짖는 자칭 새로운 카이사르입니다. 과장된 몸짓과 극적인 웅변으로 대중을 최면에 빠뜨리며 영지민들을 끝없는 행군으로 몰아넣습니다."
 fascism:0 "파시즘"
 fascism_adj:0 "파시즘"
 fascism_adherent:0 "파시스트"
 fascism_adherent_plural:0 "파시스트"
 fascism_desc:0 "고대 로마 제국의 영광에 대한 향수와 결속을 상징하는 속간의 교리, 그리고 '국가가 곧 전부'라는 전체주의적 국가 숭배를 결합한 급진적 사상입니다. 개인의 자유와 나약한 평화주의를 배격하며, 오직 '두체'의 절대적 지도 아래 지중해를 다시 '우리의 바다'로 만드는 정복 전쟁만이 국가의 위대함을 증명한다고 설파합니다."
