 pol_pot_arrest_intellectuals_event_preview_tt:0 "특별 심문소 대면 이벤트가 열리며 [arrested_intellectual.GetShortUIName](와)과 [intrigue|E] 함정 심문 대결, [learning|E] 사상 투쟁 논파 대결, 또는 즉시 투옥 중 하나를 선택합니다"
 idi_amin_economic_war_event_preview_tt:0 "경제 전쟁 선포 이벤트가 열리며 [martial|E] 군부 상점가 무력 압류, 고위험 [stewardship|E] 국영 상회 직접 운영, 또는 특별 보호세 징수 중 하나를 선택합니다"
 idi_amin_crocodile_feast_event_preview_tt:0 "나일강 악어 연못 연회 이벤트가 열리며 [crocodile_victim.GetShortUIName](와)과 맨주먹 [prowess|E] 육탄 대결, [intrigue|E] 비밀경찰 공개 수장, 또는 안전한 철창 처형 중 하나를 선택합니다"
 rasputin_miracle_healing_event_preview_tt:0 "심야 침실 기도회 이벤트가 열리며 후원 영주와의 [intrigue|E] 최면 암약 대결, [learning|E] 약초 비방 치유, 또는 안전한 축복 시주 중 하나를 선택합니다"
 rasputin_found_khlystism_event_preview_tt:0 "지하 성소 창단 의식 이벤트가 열리며 [learning|E] 황홀경의 원무 계시, [diplomacy|E] 귀족 신도 성찬식, 또는 은밀한 피의 서약 중 하나를 선택합니다"
 villains_religious_decision.0010.t:0 "타오르는 밤의 횃불 집회"
 villains_religious_decision.0010.desc:0 "수천 개의 횃불이 밤하늘을 핏빛으로 물들이고, 갈색 제복을 맞춰 입은 돌격대원들의 군화 소리가 광장 바닥을 천둥처럼 뒤흔든다. 단상 아래 운집한 군중은 숨을 죽인 채 내 입술이 열리기만을 기다리고 있다.\n\n오늘 밤의 열기를 어떻게 폭발시키느냐에 따라 수많은 청년들이 광신적인 전사로 거듭날 수도, 혹은 어설픈 소동 끝에 웃음거리로 전락할 수도 있다."
 villains_religious_decision.0010.a:0 "목청이 찢어져라 민족의 숙명과 복수를 포효한다!"
 villains_religious_decision.0010.a.success:0 "광란의 연설이 군중의 혼을 완전히 사로잡음"
 villains_religious_decision.0010.a.failure:0 "갈라진 쉰 목소리에 청중의 야유와 실소가 터져 나옴"
 villains_religious_decision.0010.b:0 "돌격대의 횃불 행진으로 반대파 거리를 무자비하게 휩쓴다."
 villains_religious_decision.0010.b.success:0 "일사불란한 폭력의 시위가 온 수도를 공포와 복종으로 얼어붙게 함"
 villains_religious_decision.0010.b.failure:0 "통제를 벗어난 패싸움이 유혈 폭동으로 번져 민심이 악화됨"
 villains_religious_decision.0010.c:0 "각본대로 엄숙하게 단상에서 돌격대 사열만 받는다."
 villains_religious_decision.0020.t:0 "발코니 위의 새로운 카이사르"
 villains_religious_decision.0020.desc:0 "대리석 발코니 아래로 검은 셔츠의 물결이 끝없이 펼쳐지고, 나를 연호하는 함성이 고대 원형경기장의 메아리처럼 성벽을 때린다. 나는 턱을 한껏 치켜들고 양팔을 허리에 얹은 채 군중을 내려다보았다.\n\n이탈리아의 뜨거운 피를 끓어오르게 할 불멸의 웅변을 선보일 것인가, 아니면 고대 로마의 개선식을 재현한 장엄한 볼거리로 그들의 눈을 홀릴 것인가?"
 villains_religious_decision.0020.a:0 "팔짱을 끼고 우렁찬 사자후로 로마의 부활을 선언한다!"
 villains_religious_decision.0020.a.success:0 "불타는 웅변에 열광한 시민들이 앞다투어 검은셔츠단에 자원함"
 villains_religious_decision.0020.a.failure:0 "과장된 몸짓이 광대극 같다는 수군거림이 광장에 퍼짐"
 villains_religious_decision.0020.b:0 "독수리 군기와 개선 아치를 앞세운 제국 재건 연극을 연출한다."
 villains_religious_decision.0020.b.success:0 "장엄한 고대 로마의 재현이 지식인과 평민 모두를 매료시킴"
 villains_religious_decision.0020.b.failure:0 "어설픈 나무 무대 장치가 무너지며 값비싼 웃음거리가 됨"
 villains_religious_decision.0020.c:0 "검은셔츠단 대열의 절도 있는 시가 행진만 독려한다."
 villains_religious_decision.0030.t:0 "붉은 잉크로 적힌 심야의 명단"
 villains_religious_decision.0030.desc:0 "모두가 잠든 깊은 밤, 집무실 책상 위에는 파이프 담배 연기가 자욱하게 내려앉고 붉은 연필 자국이 빼곡한 체포 명단이 놓여 있다. 복도 너머에서는 장화 소리와 함께 반혁명 용의자들이 끌려가는 신음이 희미하게 들려온다.\n\n의심스러운 그림자를 단 한 명도 남김없이 뿌리 뽑을 것인가, 아니면 배부른 지주와 부농들의 금고를 털어 혁명 과업의 밑거름으로 삼을 것인가?"
 villains_religious_decision.0030.a:0 "당과 군부 깊숙이 숨은 반혁명 음모자 전원을 색출하라!"
 villains_religious_decision.0030.a.success:0 "완벽한 숙청 작전으로 모든 정적과 음모꾼들의 숨통을 틀어쥠"
 villains_religious_decision.0030.a.failure:0 "편집증적 오판으로 유능한 충신들만 숙청되어 행정이 마비됨"
 villains_religious_decision.0030.b:0 "반동 귀족과 부농들이 숨긴 금화와 곡물을 국가 명의로 전부 몰수하라."
 villains_religious_decision.0030.b.success:0 "치밀한 재산 압류로 국고가 가득 차고 직할지 기강이 확립됨"
 villains_religious_decision.0030.b.failure:0 "농민들이 곡물과 가축을 불태우며 저항해 징수 성과가 참담함"
 villains_religious_decision.0030.c:0 "이미 감옥에 갇힌 소수의 태업 사보타주범만 본보기로 처단한다."
 villains_religious_decision.0040.t:0 "역사상 가장 위대한 황금 성물 만찬"
 villains_religious_decision.0040.desc:0 "연회장 천장의 촛대가 눈부신 황금빛 휘장을 비추고, 돈주머니가 묵직한 영주들과 열광적인 신도들이 내 한마디에 지갑을 열 준비를 마쳤다. 탁자 위에는 금박을 입힌 성경과 내 서명이 새겨진 한정판 성물들이 번쩍이고 있다.\n\n거물 귀족들을 상대로 초대형 독점 계약을 밀어붙일 것인가, 아니면 군중의 애국심을 자극해 소액 후원금의 파도를 일으킬 것인가?"
 villains_religious_decision.0040.a:0 "부유한 영주들에게 최고급 황금 성물 독점 거래를 성사시킨다!"
 villains_religious_decision.0040.a.success:0 "환상적인 거래의 기술로 귀족들의 금고를 통째로 쓸어 담음"
 villains_religious_decision.0040.a.failure:0 "만찬 도중 얇은 금박이 벗겨지며 사기 경매 추문이 폭발함"
 villains_religious_decision.0040.b:0 "광신적인 지지자들 앞에서 유세를 펼쳐 애국 후원금을 쓸어 담는다!"
 villains_religious_decision.0040.b.success:0 "구름 같은 인파가 감동하여 금화 자루를 단상 위로 던져 올림"
 villains_religious_decision.0040.b.failure:0 "유세 도중 치명적인 말실수로 후원자들이 썰물처럼 빠져나감"
 villains_religious_decision.0040.c:0 "검증된 핵심 신도들에게만 정가로 축복 기념품을 판매한다."
 villains_religious_decision.0050.t:0 "등불 흔들리는 사령부 진중 요정"
 villains_religious_decision.0050.desc:0 "비단 병풍 너머로 현악기 가락이 흐르고, 따스하게 데운 최고급 청주 향기가 연회장을 가득 채운다. 참모들과 빈객들의 잔이 거나하게 돌며 분위기가 무르익자, 내 가슴속에서 다시금 주체할 수 없는 명장의 피가 끓어오른다!\n\n이 자리에서 보급 따위는 초식동물의 풀뜯기로 충분하다는 불세출의 정신력 필승 작전을 일장훈시할 것인가, 아니면 오늘 밤만큼은 술과 가무로 손님들의 환심을 사는 데 집중할 것인가?"
 villains_religious_decision.0050.a:0 "술상을 치워라! 보급 무시 정신력 필승 작전을 일장훈시한다!"
 villains_religious_decision.0050.a.success:0 "기적 같은 광기의 달변에 장교단 전원이 눈물을 흘리며 감화됨!"
 villains_religious_decision.0050.a.failure:0 "무능한 만취 헛소리에 참모들이 절망하며 사령부 사기가 바닥을 침"
 villains_religious_decision.0050.b:0 "게이샤의 가무와 호쾌한 주량으로 장교들과 빈객들의 환심을 산다."
 villains_religious_decision.0050.b.success:0 "완벽한 주석 풍류로 연회장이 웃음과 충성 맹세로 가득 참"
 villains_religious_decision.0050.b.failure:0 "주량을 넘긴 만취 추태로 상을 엎고 인사불성이 되어 망신을 당함"
 villains_religious_decision.0050.c:0 "작전 이야기는 입 밖에 내지 않고 조용히 독주와 풍류를 즐긴다."
 villains_religious_decision.0060.t:0 "백두의 태양을 모시는 영생 대축전"
 villains_religious_decision.0060.desc:0 "수만 개의 붉은 깃발과 거대한 태양 문양이 광장을 뒤덮은 가운데, 오늘 주체의 영생 성열에 오를 [idolized_target.GetTitledFirstName](을)를 기리는 봉안식이 막을 올렸다. 북소리가 대지를 울리고 백성들은 눈물을 흘릴 준비를 마친 채 단상을 우러러보고 있다.\n\n보위부의 서슬 퍼런 감시망으로 숨소리조차 허용치 않는 절대 복종을 관철할 것인가, 아니면 웅장한 서사시와 예술 선전으로 만민의 자발적 숭배를 이끌어낼 것인가?"
 villains_religious_decision.0060.a:0 "보위부를 총동원해 눈물 한 방울까지 검열하는 무결점 우상화를 관철한다!"
 villains_religious_decision.0060.a.success:0 "완벽한 감시와 공포 속에 온 나라가 백두혈통 앞에 일심단결함"
 villains_religious_decision.0060.a.failure:0 "과도한 강제 동원에 반발한 불경 낙서 사건이 터져 체면이 구겨짐"
 villains_religious_decision.0060.b:0 "거대한 태양 기념비와 혁명 서사시로 백성들의 열광적 숭배를 연출한다!"
 villains_religious_decision.0060.b.success:0 "압도적인 예술 선전에 감화된 백성들이 진심으로 만세를 연호함"
 villains_religious_decision.0060.b.failure:0 "조악하게 급조된 기념비와 찬가가 뒷골목의 수군거림을 자초함"
 villains_religious_decision.0060.c:0 "핵심 간부들만 참석한 가운데 엄숙하게 혈통 봉안 의식을 치른다."
 villains_religious_decision.0070.t:0 "영년의 새벽과 비워진 도시"
 villains_religious_decision.0070.desc:0 "붉은 수건을 두른 유격대원들이 골목마다 북을 울리며 모든 도시민에게 즉각 농촌으로 떠나라고 외친다. 화폐와 시장, 낡은 계급의 때가 묻은 도시는 오늘부로 소멸하고 오직 앙카르의 순수한 농경 공동체만이 남을 것이다.\n\n비밀 감시망을 가동해 단 한 명의 낙오자도 없이 밀림 개간지로 몰아넣을 것인가, 아니면 수확량을 네 배로 늘릴 대운하와 집단농장을 내 손으로 직접 설계할 것인가?"
 villains_religious_decision.0070.a:0 "앙카르 비밀 감시망으로 도시민 전원을 밀림 협동농장으로 강제 행군시킨다!"
 villains_religious_decision.0070.a.success:0 "철저한 감시 아래 모든 인력이 협동농장과 유격대에 완벽히 편입됨"
 villains_religious_decision.0070.a.failure:0 "행군 대열에서 집단 탈주와 폭동이 터져 식량 배급망이 무너짐"
 villains_religious_decision.0070.b:0 "벼 수확량 네 배 달성을 목표로 전국의 바둑판 수로를 직접 설계한다!"
 villains_religious_decision.0070.b.success:0 "기적적인 수로 완공으로 황무지가 비옥한 대풍작 곡창지대로 변모함!"
 villains_religious_decision.0070.b.failure:0 "상식을 무시한 수로 공사가 대홍수와 끔찍한 대기근을 불러일으킴"
 villains_religious_decision.0070.c:0 "외곽 거주민부터 단계적으로 농촌 노동대에 편입시킨다."
 villains_religious_decision.0080.t:0 "등불 아래의 반동 지식인 심문"
 villains_religious_decision.0080.desc:0 "축축한 석조 심문실 한가운데 놓인 나무 의자에 불순한 학식을 뽐내던 [arrested_intellectual.GetTitledFirstName](이)가 창백하게 질린 얼굴로 앉아 있다. 책상 위에는 자백서 양식과 먹물 벼루가 정갈하게 놓여 있다.\n\n교묘한 함정 심문으로 외세와 내통했다는 자백과 은닉 금화를 모두 토해내게 만들 것인가, 아니면 공개 사상 투쟁 집회를 열어 저 오만한 지식인의 논리를 만인 앞에서 꺾어버릴 것인가?"
 villains_religious_decision.0080.a:0 "집요한 유도 심문으로 첩자 자백서와 은닉 재산을 남김없이 받아낸다!"
 villains_religious_decision.0080.a.success:0 "[arrested_intellectual.GetShortUIName](이)가 무너져 내리며 은닉 금고와 죄상을 모두 실토함"
 villains_religious_decision.0080.a.failure:0 "[arrested_intellectual.GetShortUIName](이)가 심문의 허점을 찌르고 간수를 매수해 도주함!"
 villains_religious_decision.0080.b:0 "사상 투쟁 집회에서 지식인의 위선적인 학문을 공개 논파해 굴복시킨다!"
 villains_religious_decision.0080.b.success:0 "완벽한 사상 논파에 굴복한 지식인이 눈물로 자기비판을 올림"
 villains_religious_decision.0080.b.failure:0 "날카로운 반박에 말문이 막혀 궁정 한복판에서 큰 망신을 당함"
 villains_religious_decision.0080.c:0 "번거로운 문답 없이 곧장 쇠사슬을 채워 지하감옥에 처넣는다."
 villains_religious_decision.0090.t:0 "시장통에 울려 퍼진 경제 전쟁의 나팔"
 villains_religious_decision.0090.desc:0 "비단과 향신료, 금화가 오가던 번화한 상점가 입구를 무장한 심바 대대 병사들이 겹겹이 포위했다. 겁에 질린 대상인들이 장부를 껴안은 채 내 명령만을 기다리고 있고, 내 뒤의 장교들은 부유한 점포 열쇠를 차지할 생각에 군침을 흘리고 있다.\n\n군대를 풀어 창고와 점포를 일거에 접수하고 충직한 장교들에게 통 크게 하사할 것인가, 아니면 내가 직접 국영 상회의 총재가 되어 국가 경제를 지휘할 것인가?"
 villains_religious_decision.0090.a:0 "심바 대대를 투입해 상점가를 전격 압류하고 충성파 장교들에게 나눠준다!"
 villains_religious_decision.0090.a.success:0 "일사불란한 무력 접수로 막대한 금화와 군부의 절대 충성을 확보함"
 villains_religious_decision.0090.a.failure:0 "통제를 잃은 병사들의 약탈 방화로 시장 거리가 잿더미가 됨"
 villains_religious_decision.0090.b:0 "몰수한 모든 상권을 내 직속 국영 상회로 재편해 직접 경영한다!"
 villains_religious_decision.0090.b.success:0 "뜻밖의 천재적 상술로 교역망이 번창하며 금화가 폭포처럼 쏟아짐!"
 villains_religious_decision.0090.b.failure:0 "복잡한 회계 장부를 읽지 못해 물류가 마비되고 상권이 붕괴함"
 villains_religious_decision.0090.c:0 "전면 추방 대신 상인 조합에서 거액의 특별 보호세만 징수한다."
 villains_religious_decision.0100.t:0 "나일강 악어 연못의 피의 만찬"
 villains_religious_decision.0100.desc:0 "횃불이 일렁이는 강변 연회장 아래, 거대한 나일강 악어들이 흙탕물 속에서 누런 눈을 번뜩이며 턱을 딱딱거리고 있다. 끌려 나온 [crocodile_victim.GetTitledFirstName](은)는 사색이 되어 목숨을 구걸하고, 초청받은 봉신들은 마른침을 삼키며 내 손짓을 주시한다.\n\n천하무적 헤비급 챔피언의 괴력을 과시하기 위해 포박을 풀고 맨주먹으로 때려눕혀 연못에 던져 넣을 것인가, 아니면 비밀경찰을 시켜 본보기로 수장시킬 것인가?"
 villains_religious_decision.0100.a:0 "밧줄을 풀어라! 내 맨주먹으로 때려눕혀 직접 악어 밥으로 던져주마!"
 villains_religious_decision.0100.a.success:0 "벼락같은 강펀치 한 방에 희생양이 연못으로 날아가며 모두가 전율함!"
 villains_religious_decision.0100.a.failure:0 "필사적으로 저항한 희생양에게 상처를 입고 호위병의 도움으로 겨우 처형함"
 villains_religious_decision.0100.b:0 "비밀경찰 요원들을 시켜 봉신들의 눈앞에서 잔혹하게 수장시킨다."
 villains_religious_decision.0100.b.success:0 "피도 눈물도 없는 처형 연출에 모든 불만 세력이 공포로 얼어붙음"
 villains_religious_decision.0100.b.failure:0 "지나치게 역겨운 연출에 참석한 귀족들이 구역질하며 반감을 품음"
 villains_religious_decision.0100.c:0 "철창 너머에서 안전하게 결박된 죄수를 연못으로 밀어 넣는다."
 villains_religious_decision.0110.t:0 "흔들리는 촛불과 황실 침실의 속삭임"
 villains_religious_decision.0110.desc:0 "자욱한 유향 연기와 흔들리는 촛불 그림자가 침실을 감싸고, 병마와 불안에 지친 귀족 가문의 시선이 내 깊고 어두운 눈동자에 얽매여 있다. 나는 성호를 그으며 나직한 목소리로 기도를 읊조렸다.\n\n이 기회에 최면 같은 눈빛으로 가문 가장의 영혼을 완벽히 결박해 치명적인 약점을 쥐어잡을 것인가, 아니면 고향 시베리아의 비전 약초술로 진짜 기적 같은 쾌유를 선보여 성자의 명성을 얻을 것인가?"
 villains_religious_decision.0110.a:0 "내 눈을 똑바로 보시오… 최면의 암시로 영주의 영혼과 약점을 쥐어잡는다!"
 villains_religious_decision.0110.a.success:0 "최면에 홀린 후원자가 눈물을 흘리며 가문의 은밀한 비밀과 금화를 바침"
 villains_religious_decision.0110.a.failure:0 "최면 술수가 들통나 불경한 요승이라는 고함과 함께 침실에서 쫓겨남!"
 villains_religious_decision.0110.b:0 "시베리아 약초 비방과 간절한 기도로 병마를 씻어내 성자로 추앙받는다."
 villains_religious_decision.0110.b.success:0 "놀라운 약효로 열기가 가라앉으며 모두가 살아있는 성자라고 경배함"
 villains_religious_decision.0110.b.failure:0 "약초 배합 실수로 구토와 복통만 심해져 체면과 신앙심이 깎임"
 villains_religious_decision.0110.c:0 "무난한 축복 기도와 안수 의식만 베풀고 후한 시주를 챙긴다."
 villains_religious_decision.0120.t:0 "성스러운 광란의 지하 원무"
 villains_religious_decision.0120.desc:0 "성당 아래 비밀 지하실, 하얀 소복을 입은 귀족 연인들과 추종자들이 나를 중심으로 거대한 원을 그리고 서 있다. 위선적인 성직자들의 낡은 율법을 부수고, 육신의 고행과 황홀경을 통해 신과 하나가 되는 새로운 비의 종파가 탄생하는 순간이다!\n\n숨이 멎을 듯한 광란의 원무와 신비주의 설법으로 절대적 광신을 불어넣을 것인가, 아니면 감미로운 유혹의 성찬으로 귀족 후원자들의 재물과 사교계를 단숨에 장악할 것인가?"
 villains_religious_decision.0120.a:0 "새벽이 밝을 때까지 황홀경의 원무와 신비 계시로 영혼을 불태운다!"
 villains_religious_decision.0120.a.success:0 "신들린 설법과 원무 속에 모든 신도가 당신을 살아있는 구원자로 경배함!"
 villains_religious_decision.0120.a.failure:0 "지하실 밖으로 기괴한 비명과 소문이 새어 나가 추문으로 번짐"
 villains_religious_decision.0120.b:0 "달콤한 포도주와 유혹의 성찬으로 귀족 연인들의 몸과 금고를 사로잡는다!"
 villains_religious_decision.0120.b.success:0 "매혹된 귀족 추종자들이 막대한 후원금과 함께 종파의 선봉에 섬"
 villains_religious_decision.0120.b.failure:0 "질투에 눈먼 연인들 사이에 다툼이 벌어져 비밀 모임이 소란스럽게 파함"
 villains_religious_decision.0120.c:0 "외부의 귀를 피해 침묵 속에서 엄숙한 피의 서약만 나눈다."
 axis_mass_agitation_triumph_modifier:0 "열광적인 대중 선동 대성공"
 axis_mass_agitation_triumph_modifier_desc:0 "신들린 대중 연설에 매료된 온 영지민이 광적인 열성으로 군대와 통치자 아래 결집하고 있습니다."
 axis_mass_agitation_fiasco_modifier:0 "웃음거리가 된 군중 연설"
 axis_mass_agitation_fiasco_modifier_desc:0 "연설 도중 갈라진 목소리와 어설픈 연출이 조롱거리가 되어 추종자들의 사기가 크게 꺾였습니다."
 axis_street_riot_county_modifier:0 "유혈 시가전 후유증"
 axis_street_riot_county_modifier_desc:0 "통제를 벗어난 무장 행진이 거리 패싸움과 방화로 번져 도시 상권과 민심이 크게 흉흉해졌습니다."
 stalin_great_purge_triumph_modifier:0 "강철의 무결점 대숙청"
 stalin_great_purge_triumph_modifier_desc:0 "숨죽인 심야 체포 작전이 모든 잠재적 배신자들을 정확히 도려내어 그 누구도 감히 역심을 품지 못합니다."
 stalin_purge_paranoia_backlash_modifier:0 "편집증적 오판 숙청의 혼란"
 stalin_purge_paranoia_backlash_modifier_desc:0 "엉뚱한 충신들과 유능한 관리들까지 마구잡이로 숙청당한 탓에 행정과 징병 체계가 마비되었습니다."
 trump_art_of_the_deal_boom_modifier:0 "황금 성물 대호황 거래"
 trump_art_of_the_deal_boom_modifier_desc:0 "부유한 영주들과 성사시킨 초고가 성물 독점 계약 덕분에 국고에 황금이 마르지 않고 흘러들어 옵니다."
 trump_fraud_scandal_modifier:0 "도금 성물 사기 경매 논란"
 trump_fraud_scandal_modifier_desc:0 "비싸게 팔아넘긴 황금 성물의 도금이 벗겨지면서 후원자들과 봉신들 사이에 거센 사기 논란이 일고 있습니다."
 mutaguchi_banzai_delusion_inspired_modifier:0 "전염된 정신력 필승의 광기"
 mutaguchi_banzai_delusion_inspired_modifier_desc:0 "사령관의 기적 같은 궤변에 전염된 장교단이 보급이 없어도 이길 수 있다는 무모한 돌격 정신으로 불타오릅니다."
 mutaguchi_drunken_blunder_modifier:0 "만취 작전 훈시의 사기 붕괴"
 mutaguchi_drunken_blunder_modifier_desc:0 "연회장에서 쏟아낸 터무니없는 무능 지휘관의 헛소리에 참모들과 병사들이 깊은 절망에 빠졌습니다."
 mutaguchi_hangover_disgrace_modifier:0 "인사불성 만취 추태"
 mutaguchi_hangover_disgrace_modifier_desc:0 "과음 끝에 술상을 뒤엎고 쓰러진 추태가 궁정 안팎의 입방아에 오르내리고 있습니다."
 kim_paektu_idolization_supreme_modifier:0 "유일사상 일심단결의 정점"
 kim_paektu_idolization_supreme_modifier_desc:0 "성대하게 거행된 백두혈통 봉안식을 통해 수령을 향한 신격화와 체제 결속력이 하늘을 찌르고 있습니다."
 kim_idolization_backlash_modifier:0 "강압적 우상화의 민심 이반"
 kim_idolization_backlash_modifier_desc:0 "무리한 우상화 동원과 어설픈 선전 사업이 백성과 간부들 사이에 은밀한 반감을 키웠습니다."
 pol_pot_year_zero_miracle_harvest_modifier:0 "영년 협동농장의 기적 대풍작"
 pol_pot_year_zero_miracle_harvest_modifier_desc:0 "새로 건설된 관개 수로와 집단 노동이 기적적으로 맞물리며 수확량과 건설 속도가 폭발적으로 증가했습니다."
 pol_pot_commune_famine_modifier:0 "영년 집단농장 대기근"
 pol_pot_commune_famine_modifier_desc:0 "무지한 농법 강요와 무리한 강제 이주로 인해 들판이 황폐해지고 심각한 기근이 영지를 덮쳤습니다."
 idi_amin_economic_boom_modifier:0 "국영 상회 번영의 기적"
 idi_amin_economic_boom_modifier_desc:0 "몰수한 상점과 교역망이 예상 밖으로 원활하게 운영되어 국고와 군부 모두 막대한 부를 누리고 있습니다."
 idi_amin_economic_collapse_modifier:0 "경제 전쟁 상권 붕괴"
 idi_amin_economic_collapse_modifier_desc:0 "숙련된 상인들을 내쫓고 장부도 못 읽는 군인들이 점포를 차지한 바람에 시장 유통망이 완전히 마비되었습니다."
 rasputin_charlatan_exposed_modifier:0 "탄로 난 요승의 최면 술수"
 rasputin_charlatan_exposed_modifier_desc:0 "귀족 침실에서 부리던 최면 수작이 발각되면서 거짓 예언자라는 불신과 경계의 시선이 뒤따르고 있습니다."
 rasputin_khlyst_ecstasy_fervor_modifier:0 "흘리스티 황홀경의 광신"
 rasputin_khlyst_ecstasy_fervor_modifier_desc:0 "창단 의식의 강렬한 신비 체험에 매료된 신도들과 귀족 연인들이 아낌없는 헌신을 바치고 있습니다."
 rasputin_khlyst_scandal_rumors_modifier:0 "지하 비밀 집회의 추문"
 rasputin_khlyst_scandal_rumors_modifier_desc:0 "심야 지하실에서 벌어진 문란한 의식에 관한 흉흉한 소문이 퍼져 타 종파 신도들의 거센 비난을 받고 있습니다."
 kim_paektu_idolization_decision_no_item_selected:0 "우상화로 추대할 백두혈통 대상이 선택되지 않았습니다"
 pol_pot_arrest_intellectuals_decision_no_item_selected:0 "심문소로 압송할 구사회 지식인이 선택되지 않았습니다"
 idi_amin_srb_crocodile_feast_decision_no_item_selected:0 "악어 밥 만찬에서 처형할 정적이 선택되지 않았습니다"

 # === Second Religious & Ideological Decisions (Trump, Hitler, Mussolini, Mutaguchi, Stalin) ===
 trump_youre_fired_tribunal_decision:0 "공개 성과 심판과 해고 선고"
 trump_youre_fired_tribunal_decision_desc:0 "아메리카니즘에서 파산과 무능은 구원받을 수 없는 최악의 죄악이며, 오직 거래에서 승리하는 자만이 황금의 은총을 누릴 자격이 있습니다. 봉신이나 자문위원을 황금 원탁 알현실로 직접 호출하여 실적을 낱낱이 추궁하십시오. 징벌적 관세 칙령을 들이밀어 막대한 공납을 쥐어짜거나, 만좌의 앞에서 손가락을 겨누며 가차 없이 해고를 선고하여 진정한 승자의 위엄을 만천하에 과시할 시간입니다."
 trump_youre_fired_tribunal_decision_tooltip:0 "지정한 가신을 알현실 원탁으로 호출하여 관리력 관세 협박이나 외교력 공개 해고 대결을 펼치는 전용 이벤트를 시작합니다."
 trump_youre_fired_tribunal_decision_confirm:0 "원탁 심판장으로 호출하라!"
 trump_youre_fired_tribunal_decision_no_item_selected:0 "심판대에 세울 대상이 선택되지 않음"
 trump_youre_fired_tribunal_decision_req_candidate:0 "성인이고 투옥되지 않은 자문위원, 봉신 또는 궁정 신하가 최소 1명 이상 있어야 함"
 trump_youre_fired_tribunal_decision_select_tt:0 "선택한 인물이 생존해 있으며 감옥에 갇혀 있지 않아야 함"
 trump_youre_fired_tribunal_event_preview_tt:0 "선택한 인물을 원탁 앞에 세우고 #V 관리력#! 관세 재협상, 대상과의 #V 외교력#! 공개 해고 대결, 또는 안전한 충성 서약 중 하나를 집행합니다"
 villains_religious_decision.0130.t:0 "황금 원탁의 심판: 거래의 기술과 해고 선고"
 villains_religious_decision.0130.desc:0 "양털 휘장과 황금 독수리 깃발이 드리워진 평의회 대전 한복판에 무거운 침묵이 내려앉았다. 참나무 원탁 위에 수북이 쌓인 세금 양피지 장부 너머로 호출된 [fired_target.GetTitledFirstName]의 이마에 식은땀이 흐르고, 배석한 귀족들은 숨을 죽인 채 내 입술만 바라보고 있다.\n\n\"솔직히 말해 보지. 이 장부 숫자는 재앙이야. 역사상 최악의 거래라고! 다들 그렇게 말하고 있어.\" 나는 원탁을 손바닥으로 짚고 몸을 앞으로 기울이며 차갑게 쏘아보았다. 지금 저 가련한 패배자에게 감당 못 할 징벌적 관세 청구서를 들이밀어 금고와 약점을 통째로 털어낼 것인가, 아니면 만좌의 앞에서 손가락을 곧게 겨누며 영원히 잊지 못할 해고 통보를 날려 줄 것인가?"
 villains_religious_decision.0130.a:0 "징벌적 관세 칙령을 들이밀어 추가 공납과 이면 각서를 받아낸다!"
 villains_religious_decision.0130.a.success:0 "압도적인 거래의 기술로 금화와 약점을 모두 챙김"
 villains_religious_decision.0130.a.failure:0 "장부 조항의 허점을 역공당해 협상이 결렬됨"
 villains_religious_decision.0130.b:0 "만좌의 앞에서 손가락을 겨누며 외친다. \"넌 해고야!\""
 villains_religious_decision.0130.b.success:0 "가차 없는 해고 선고에 온 궁정이 승자의 권위에 압도됨"
 villains_religious_decision.0130.b.failure:0 "해고당한 신하가 궁정 한복판에서 거세게 맞받아쳐 소동이 벌어짐"
 villains_religious_decision.0130.c:0 "황금 인장이 찍힌 충성 서약서에 서명하게 하고 마지막 기회를 준다."
 hitler_grand_architecture_and_art_purge_decision:0 "퇴폐 예술 심판과 대건축 모형 친람식"
 hitler_grand_architecture_and_art_purge_decision_desc:0 "위대한 민족 공동체의 정신은 나약하고 타락한 예술이 아니라 영원을 압도하는 거대한 석조 건축에서 완성됩니다! 영지 곳곳의 귀족 저택과 수도원에 숨겨진 퇴폐적인 성화와 채색 필사본을 전면 압류하고, 내가 밤을 지새워 직접 목탄으로 설계한 천년 수도의 백색 대성당 모형을 봉신들 앞에 공개하여 불멸의 질서를 각인시킬 때입니다."
 hitler_grand_architecture_and_art_purge_decision_tooltip:0 "백색 대성당 석조 모형 친람식을 열어 외교력 건축 설파나 계책력 압류 미술품 해외 밀매 판정을 진행하는 전용 이벤트를 시작합니다."
 hitler_grand_architecture_and_art_purge_decision_confirm:0 "천년 수도의 모형을 공개하라!"
 hitler_grand_architecture_event_preview_tt:0 "석조 회랑에서 #V 외교력#! 대건축 모형 설파, #V 계책력#! 압류 미술품 국외 밀매, 또는 안전한 불온 서적 소각 의식 중 하나를 선택합니다"
 villains_religious_decision.0140.t:0 "백색 돔의 환영과 압류된 성화 상자"
 villains_religious_decision.0140.desc:0 "횃불이 일렁이는 석조 회랑 한가운데, 밤새워 깎아 만든 거대한 백색 석회암 대성당과 개선 열주 모형이 위용을 드러냈다. 회랑 한편에서는 사슬갑옷을 입은 병사들이 귀족 저택에서 압류해 온 화려한 성화와 금박 필사본들을 거친 나무 상자에 쓸어 담고 있다.\n\n나는 직접 그린 목탄 설계도 두루마리를 쥐고 숨을 죽인 봉신들 앞에 섰다. 고대 로마조차 초라하게 만들 이 완벽한 비례와 거대한 돔의 숭고함을 설파하여 전 영지의 건설 역량을 하나로 결집할 것인가, 아니면 저 쓸모없는 퇴폐 미술품들을 국경 너머 부유한 상인들에게 비밀리에 고가로 팔아치워 국고를 두둑이 채울 것인가?"
 villains_religious_decision.0140.a:0 "밤새 직접 설계한 백색 대성당 모형의 완벽한 비례를 열변으로 설파한다!"
 villains_religious_decision.0140.a.success:0 "장엄한 천년 수도 청사진에 봉신들과 장인들이 압도됨"
 villains_religious_decision.0140.a.failure:0 "석공 장인이 돔 하중 결함을 지적하자 참지 못하고 불같이 격노함"
 villains_religious_decision.0140.b:0 "압류한 퇴폐 미술품들을 국경 밖 상인들에게 비밀리에 고가로 매각한다."
 villains_religious_decision.0140.b.success:0 "은밀한 국경 경매로 막대한 금화와 사상 통제를 동시에 거머쥠"
 villains_religious_decision.0140.b.failure:0 "측근들의 명화 빼돌리기와 위선적인 밀매 소문이 궁정에 새어나감"
 villains_religious_decision.0140.c:0 "광장에서 불온 서적 소각식을 열고 궁정 화가들에게 영웅 벽화를 명한다."
 mussolini_battle_for_grain_and_marshes_decision:0 "밀 증산 대전투와 정시 역참 개간 선전전"
 mussolini_battle_for_grain_and_marshes_decision_desc:0 "새롭게 태어난 로마인은 나약한 탁상공론 대신 대지와 땀방울, 그리고 한 치의 오차도 없는 규율로 증명됩니다! 황금빛으로 익어가는 밀밭 한복판에 직접 뛰어들어 상반신을 드러낸 채 큰낫을 휘두르며 강철 같은 지도자의 육체를 백성들에게 각인시키고, 늪지대 배수로 개간과 석조 역참 가도 정비를 강행하여 우리 영지의 모든 파발 마차가 정시에 도착하게 만드십시오."
 mussolini_battle_for_grain_and_marshes_decision_tooltip:0 "황금 밀밭 현장에 직접 나서 기량·외교력 상의 탈의 수확 시범이나 관리력·학식 역참 개간 판정을 진행하는 전용 이벤트를 시작합니다."
 mussolini_battle_for_grain_and_marshes_decision_confirm:0 "큰낫과 밀단을 높이 들어라!"
 mussolini_battle_for_grain_event_preview_tt:0 "수확 현장에서 #V 기량·외교력#! 상의 탈의 낫질 시범, #V 관리력·학식#! 늪지 개간 및 정시 역참 정비, 또는 안전한 풍년 찬가 편찬 중 하나를 진행합니다"
 villains_religious_decision.0150.t:0 "황금 밀밭의 강철 육체와 정시에 달리는 역참 마차"
 villains_religious_decision.0150.desc:0 "뜨거운 이탈리아의 태양이 황금빛으로 물든 밀밭과 저 멀리 고대 로마의 석조 수도교를 눈부시게 비추고 있다. 밀짚모자를 쓴 농부들이 구름처럼 몰려든 가운데, 궁정 서기는 양피지와 깃펜을 들고 나의 가장 영웅적인 순간을 화폭에 담을 준비를 마쳤다.\n\n나는 겉옷을 과감히 벗어 던지고 턱을 당당히 치켜든 채 잘 벼려진 무쇠 큰낫을 거머쥐었다. 뙤약볕 아래 직접 밀단을 베어 넘기며 강철 같은 신로마인의 기상을 만백성 앞에 과시할 것인가, 아니면 늪지대 간척과 로마 가도 역참 규율을 매섭게 다그쳐 단 한 대의 파발 마차도 늦지 않는 완벽한 행정을 증명할 것인가?"
 villains_religious_decision.0150.a:0 "상반신을 드러내고 뙤약볕 아래 직접 큰낫을 휘둘러 밀단을 높이 치켜든다!"
 villains_religious_decision.0150.a.success:0 "강철 같은 수확 시범에 농민들의 환호성이 들판을 뒤흔듦"
 villains_religious_decision.0150.a.failure:0 "성급하게 낫질을 몰아치다 일사병과 요통으로 밀밭에 주저앉음"
 villains_religious_decision.0150.b:0 "늪지대 배수로 개간과 석조 가도 규율을 강행해 모든 마차를 정시에 달리게 한다!"
 villains_religious_decision.0150.b.success:0 "개간된 농지와 정시 운행 역참망으로 물류와 세수가 급증함"
 villains_religious_decision.0150.b.failure:0 "날림으로 쌓은 제방이 무너지고 역참 마차들이 진흙탕에 고립됨"
 villains_religious_decision.0150.c:0 "밀 이삭 화관을 머리에 쓰고 서기들에게 영웅적인 풍년 화보만 그리게 한다."
 mutaguchi_jingisukan_herbivore_logistics_decision:0 "징기스칸식 우마 보급령과 초식 행군 감찰"
 mutaguchi_jingisukan_herbivore_logistics_decision_desc:0 "보급이 끊겨 진격할 수 없다니, 그따위 나약한 소리는 정신력이 썩어 빠진 탓입니다! 옛 영웅들의 지혜를 본받아 물소와 황소 수백 마리에 군량을 싣고 강을 건너 잡아먹으면 될 일이며, 설령 소가 없으면 어떻습니까? 우리 민족은 본래 초식동물이니 사방에 자라난 푸른 정글의 풀과 나무뿌리가 전부 하늘이 내린 군량입니다! 직접 우기 강가로 나가 물소 도하를 독전하고 나태한 일선 지휘관들의 군기를 바로잡으십시오."
 mutaguchi_jingisukan_herbivore_logistics_decision_tooltip:0 "폭우가 쏟아지는 정글 강가에서 관리력·전투력 물소 도하 도박이나 기량·외교력 들풀 시식 및 부하 문책 판정을 진행하는 전용 이벤트를 시작합니다."
 mutaguchi_jingisukan_herbivore_logistics_decision_confirm:0 "풀도 다 군량이다, 전진하라!"
 mutaguchi_jingisukan_herbivore_event_preview_tt:0 "정글 도하 현장에서 #V 관리력·전투력#! 물소 보급대 강행 도하, #V 기량·외교력#! 야초 시식 및 부하 장수 남탓 문책, 또는 안전한 본영 기원 참배 중 하나를 단행합니다"
 villains_religious_decision.0160.t:0 "흙탕물 급류의 물소 떼와 한 줌의 푸른 잡초"
 villains_religious_decision.0160.desc:0 "장대비가 억수같이 쏟아지는 밀림의 황톳빛 강물 속에서 대나무 짐바리를 짊어진 물소 떼가 거센 급류에 놀라 날뛰고 있다. 비에 흠뻑 젖은 일선 장수가 창백해진 얼굴로 달려와 식량 수송이 불가능하니 후퇴해야 한다고 읍소하자, 내 머릿속에서 뜨거운 울화가 치밀어 올랐다.\n\n나는 군배 부채를 높이 치켜들고 발밑의 젖은 정글 잡초를 한 움큼 뜯어 장수의 코앞에 들이밀었다! \"사방이 온통 푸른 풀밭인데 식량이 없다는 게 말이 되느냐!\" 지금 당장 물소 부대를 채찍질해 기어이 급류를 건너게 하는 세기의 병참 기적을 보여줄 것인가, 아니면 직접 들풀 국을 들이켜며 저 무능한 부하 장수에게 모든 실패 책임을 뒤집어씌울 것인가?"
 villains_religious_decision.0160.a:0 "군배를 휘둘러 물소 보급대 전원을 거친 급류 너머로 강행 도하시킨다!"
 villains_religious_decision.0160.a.success:0 "기적적으로 물소 떼가 강을 건너 전설의 생체 보급선이 완성됨!"
 villains_religious_decision.0160.a.failure:0 "물소 떼가 급류에 놀라 군량과 함께 전부 하류로 떠내려감!"
 villains_religious_decision.0160.b:0 "직접 들풀 국을 들이켜 시범을 보이고 나약한 부하 장수를 가차 없이 문책한다!"
 villains_religious_decision.0160.b.success:0 "초식 행군 정신력과 완벽한 남탓 문책으로 사령부 기강을 다잡음"
 villains_religious_decision.0160.b.failure:0 "독초가 섞인 잡초를 삼켰다가 극심한 복통으로 진흙탕에 뒹굶"
 villains_religious_decision.0160.c:0 "전선 시찰은 접어두고 본영 신사에서 필승 참배만 올린 뒤 전령을 보낸다."
 stalin_five_year_plan_stakhanov_decision:0 "오개년 중공업 계획과 노력영웅 경진대회"
 stalin_five_year_plan_stakhanov_decision_desc:0 "혁명 조국이 사방의 적대 세력에게 짓밟히지 않으려면 남들이 백 년에 걸쳐 이룰 제철과 성채 건설을 단 오 년 만에 주파해야 합니다! 전 영지의 대장간과 광산에 초인적인 오개년 중공업 할당량을 하달하고, 하룻밤에 철광석 열네 수레를 캐낸 모범 노동자를 노력영웅으로 추앙하여 모든 백성이 잠을 줄여가며 용광로 앞으로 달려가게 만드십시오."
 stalin_five_year_plan_stakhanov_decision_tooltip:0 "거대 제철 대장간을 시찰하며 관리력 오개년 할당량 강행이나 외교력·전투력 노력영웅 선전 및 적위대 동원 판정을 진행하는 전용 이벤트를 시작합니다."
 stalin_five_year_plan_stakhanov_decision_confirm:0 "용광로의 불길을 멈추지 마라!"
 stalin_five_year_plan_event_preview_tt:0 "제철소 현장에서 #V 관리력#! 오개년 초과 달성령, #V 외교력·전투력#! 노력영웅 선전 및 적위대 소집, 또는 안전한 죄수 채석장 투입 중 하나를 집행합니다"
 villains_religious_decision.0170.t:0 "타오르는 제철 용광로와 열네 수레의 노력영웅"
 villains_religious_decision.0170.desc:0 "시뻘건 쇳물 열기와 매캐한 석탄 연기가 자욱한 거대 석조 대장간 안, 거대한 풀무 소리와 함께 모루 위에서 불꽃이 소나기처럼 튀어 오른다. 나무 단상 위에 선 나는 양피지에 적힌 영지별 철광석·무기 생산 할당량 도표를 매서운 눈으로 내려다보았다.\n\n\"볼셰비키에게 점령 못 할 요새나 불가능한 할당량 따위는 없다.\" 나는 단상 난간 너머로 땀범벅이 되어 망치질을 이어가는 대장장이들을 가리켰다. 지방 관리들의 비명을 묵살하고 전 영지에 오개년 중공업 초과 달성령을 가차 없이 밀어붙일 것인가, 아니면 하룻밤에 열네 배의 실적을 올렸다는 모범 장인을 노력영웅으로 대대적으로 선전하여 전 인민의 충성 경쟁과 무장 열기를 불태울 것인가?"
 villains_religious_decision.0170.a:0 "변명은 용납하지 않는다! 전 영지에 오개년 중공업 초과 달성령을 강행하라!"
 villains_religious_decision.0170.a.success:0 "밤낮없는 용광로 가동으로 건설 속도와 생산력이 폭발적으로 상승함"
 villains_religious_decision.0170.a.failure:0 "처벌을 두려워한 관리들의 허위 장부 조작으로 자재 파동이 벌어짐"
 villains_religious_decision.0170.b:0 "열네 수레의 기적을 이룬 모범 대장장이를 노력영웅으로 추앙해 열풍을 일으킨다!"
 villains_religious_decision.0170.b.success:0 "노력영웅 경쟁 열풍 속에 충성스러운 노동 적위대가 자진 결집함"
 villains_religious_decision.0170.b.failure:0 "사전에 꾸며낸 기록이라는 소문이 퍼져 장인들의 태업이 번짐"
 villains_religious_decision.0170.c:0 "지하감옥의 죄수들을 변경 채석장과 벌목장에 투입해 할당량을 채운다."
 stalin_shock_worker_brigade_name:0 "스타하노프 돌격 노동 여단"
 trump_tariff_deal_master_modifier:0 "징벌적 관세 협상의 달인"
 trump_tariff_deal_master_modifier_desc:0 "원탁 앞 가차 없는 압박 협상으로 불공정한 무역과 봉신들의 공납 조건을 완전히 재편했습니다."
 trump_youre_fired_authority_modifier:0 "가차 없는 해고자의 권위"
 trump_youre_fired_authority_modifier_desc:0 "무능한 가신을 만좌의 앞에서 공개 해고한 본보기가 궁정 전체에 긴장감과 승자의 카리스마를 불어넣었습니다."
 trump_bad_deal_humiliation_modifier:0 "망신스러운 졸속 협상"
 trump_bad_deal_humiliation_modifier_desc:0 "큰소리쳤던 관세 압박이 계약서의 허점으로 역공당하며 거래의 달인이라는 명성에 금이 갔습니다."
 hitler_germania_grand_model_modifier:0 "천년 수도 대건축 청사진"
 hitler_germania_grand_model_modifier_desc:0 "거대한 백색 석조 대성당 모형이 영지의 석공과 봉신들에게 광적인 건설 열기를 불어넣고 있습니다."
 hitler_cultural_purification_modifier:0 "퇴폐 예술 압류 및 사상 정화"
 hitler_cultural_purification_modifier_desc:0 "불온 미술품 색출과 엄격한 문화 검열로 불순 세력의 암약을 억누르고 신앙 결속을 다졌습니다."
 hitler_rejected_artist_rage_modifier:0 "무시당한 예술가의 격분"
 hitler_rejected_artist_rage_modifier_desc:0 "완벽하다고 믿었던 건축 설계에 결함이 지적되자 주체할 수 없는 분노로 궁정 행정이 경색되었습니다."
 mussolini_shirtless_harvester_modifier:0 "밀밭의 강철 수확자"
 mussolini_shirtless_harvester_modifier_desc:0 "뙤약볕 아래 농민들과 함께 큰낫을 휘두른 지도자의 활력이 백성들의 열광적인 지지를 이끌어냈습니다."
 mussolini_carriages_on_time_modifier:0 "정시에 도착하는 역참 마차"
 mussolini_carriages_on_time_modifier_desc:0 "늪지 개간과 엄격한 로마 가도 역참 규율 덕분에 군대와 물자 수송이 한 치의 지체도 없이 이루어집니다."
 mussolini_sunstroke_fiasco_modifier:0 "밀밭의 일사병 추태"
 mussolini_sunstroke_fiasco_modifier_desc:0 "무리한 상의 탈의 수확 시범 도중 더위를 먹고 쓰러진 소문이 퍼져 체면과 기력이 모두 깎였습니다."
 mussolini_bogged_down_public_works_modifier:0 "진흙탕에 빠진 전시 토목"
 mussolini_bogged_down_public_works_modifier_desc:0 "선전에만 급급해 날림으로 강행한 배수로와 가도가 무너지며 오히려 영지 통행과 세수가 악화되었습니다."
 mutaguchi_miracle_ox_convoy_modifier:0 "기적의 징기스칸 우마 보급대"
 mutaguchi_miracle_ox_convoy_modifier_desc:0 "모두가 미친 짓이라 비웃었던 물소와 황소 수송대가 기적적으로 강을 건너 자급자족 행군을 뒷받침합니다!"
 mutaguchi_herbivore_march_spirit_modifier:0 "초식 행군과 무책임 정신력"
 mutaguchi_herbivore_march_spirit_modifier_desc:0 "들풀을 뜯어 먹으며 진격하라는 추상같은 호령과 부하 장수 문책으로 병사들이 굶주림을 정신력으로 견뎌냅니다."
 mutaguchi_drowned_buffalo_disaster_modifier:0 "수장된 물소 보급 대참사"
 mutaguchi_drowned_buffalo_disaster_modifier_desc:0 "급류에 휩쓸려 떠내려간 물소 떼와 함께 군량이 수장되어 전군의 보급선이 처참하게 붕괴했습니다."
 mutaguchi_toxic_weed_stomachache_modifier:0 "독초 시식 복통 굴욕"
 mutaguchi_toxic_weed_stomachache_modifier_desc:0 "아무 풀이나 먹을 수 있다고 호기롭게 삼킨 정글 잡초에 독성이 있어 지휘관이 극심한 배탈로 앓아누웠습니다."
 stalin_five_year_plan_shock_work_modifier:0 "오개년 중공업 돌격 건설"
 stalin_five_year_plan_shock_work_modifier_desc:0 "밤낮없이 타오르는 제철소 용광로와 무자비한 할당량 독려로 성채와 기반 시설이 초고속으로 들어섭니다."
 stalin_stakhanovite_fervor_modifier:0 "스타하노프 노력영웅 열풍"
 stalin_stakhanovite_fervor_modifier_desc:0 "할당량을 열네 배 초과 달성한 노력영웅 신화가 온 영지의 노동자와 병사들을 광적인 경쟁으로 몰아넣습니다."
 stalin_falsified_quota_collapse_modifier:0 "허위 생산 장부와 자재 파동"
 stalin_falsified_quota_collapse_modifier_desc:0 "숙청이 두려운 관리들이 서류상 숫자만 부풀리는 바람에 실제 건설 현장과 세수가 심각한 혼란에 빠졌습니다."
 kim_asymmetric_force_development_decision:0 "비대칭 전력 개발"
 kim_asymmetric_force_development_decision_desc:0 "사방을 에워싼 대국들의 침략 야욕을 단숨에 분쇄하려면 재래식 창칼이 아니라 적의 성벽 자체를 흔적도 없이 날려버릴 초월적 결전 병기가 필요하다! 국고와 영지의 모든 구리와 초석을 지하 비밀 주조창에 쏟아부어 시대를 앞서간 거대 청동 사석포 열 문을 주조하고 시험 발사를 강행할 시간이다."
 kim_asymmetric_force_development_decision_tooltip:0 "지하 비밀 주조창을 가동하여 극악의 성공 확률을 뚫고 사석포 열 문으로 구성된 전략 포병 중대 생산을 시도하거나 위장 무력시위를 벌입니다."
 kim_asymmetric_force_development_decision_confirm:0 "지하 화포 주조창에 점화하라!"
 kim_asymmetric_force_development_event_preview_tt:0 "극악의 확률로 #V 사석포 10기#! 세습 특수 부대를 생산하는 시험 발사 도박 또는 #V 계략#! 기반 통나무 모형 화포 위장 열병식 이벤트가 발생합니다."
 villains_religious_decision.0180.t:0 "지하 비밀 주조창의 시험 발사"
 villains_religious_decision.0180.desc:0 "매캐한 유황 연기와 붉은 쇳물 열기가 가득 찬 지하 석조 주조창 한복판에 거대한 청동 포신 열 문이 참나무 포차 위에 육중한 자태를 드러냈다. 배석한 서기들과 대장장이들은 지금 시대 기술로는 청동 두께와 흑색화약 배합을 조금만 잘못 맞추어도 포신이 산산조각 나 주조창 전체가 무너질 것이라며 바들바들 떨고 있다.\n\n하지만 단 한 번만 시험 발사에 성공한다면 천하의 어떤 난공불락 요새도 단숨에 잿더미로 만들 무적의 자위적 억제력을 손에 넣게 된다. 대장장이들의 목숨을 걸고 화약을 두 배로 채워 넣을 것인가, 아니면 검은 옻칠을 칠한 통나무 모형 포신으로 사방의 적들을 감쪽같이 속일 것인가?"
 villains_religious_decision.0180.a:0 "정석 배합대로 청동 포신을 주조하고 시험 발사를 단행하라!"
 villains_religious_decision.0180.a.success:0 "천지를 뒤흔드는 굉음과 함께 거대 사석포 열 문 주조에 대성공함!"
 villains_religious_decision.0180.a.failure:0 "청동 포신이 압력을 이기지 못하고 균열을 일으키며 산산조각 남"
 villains_religious_decision.0180.b:0 "장인들의 목을 걸고 흑색화약을 두 배로 쑤셔 넣어라! 무조건 쏴 올려!"
 villains_religious_decision.0180.b.success:0 "기적 같은 불기둥이 솟구치며 무적의 사석포 중대가 완성됨!"
 villains_religious_decision.0180.b.failure:0 "과충전된 포신이 폭발하며 날아온 청동 파편에 경상을 입음"
 villains_religious_decision.0180.b.critical_failure:0 "지하 화약고가 연쇄 대폭발하여 참관석이 무너지며 극심한 중상을 입음!"
 villains_religious_decision.0180.c:0 "검은 무쇠 옻칠을 한 소나무 통나무 모형 포신으로 야간 열병식을 열어라."
 villains_religious_decision.0180.c.success:0 "사방의 첩자들이 거대 통나무를 진짜 결전 화포로 착각하고 경악함"
 villains_religious_decision.0180.c.failure:0 "열병식 도중 쏟아진 폭우에 검은 먹물이 번져 통나무 결이 들통남"
 kim_juche_bombard_regiment_name:0 "주체 화성 사석포 중대"
 kim_asymmetric_deterrence_modifier:0 "자위적 사석포 전략 억제력"
 kim_asymmetric_deterrence_modifier_desc:0 "시대를 초월한 거대 청동 사석포의 천둥 같은 포성이 안팎의 적대 세력과 봉신들을 완벽한 공포와 복종 속에 묶어두고 있습니다."
 kim_failed_foundry_explosion_modifier:0 "지하 화포 주조창 폭발 후폭풍"
 kim_failed_foundry_explosion_modifier_desc:0 "무리한 화포 시험 발사 도중 발생한 대규모 폭발 사고로 막대한 자재가 잿더미가 되고 백성들의 원성이 높아졌습니다."
 kim_wooden_cannon_bluff_modifier:0 "옻칠 통나무 화포 위장 억제력"
 kim_wooden_cannon_bluff_modifier_desc:0 "횃불 아래 위풍당당하게 행진한 검은 통나무 모형 포신들이 적국의 세작들을 감쪽같이 속여 넘겨 누구도 섣불리 도발하지 못합니다."
