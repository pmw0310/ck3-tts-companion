 bookmark_reincarnated_trump_subheading:0 "노섬벌랜드와 컴벌랜드의 행정관"
 bookmark_reincarnated_trump_desc:0 "거대한 국경 장벽과 무역 관세로 세계를 뒤흔들던 부동산 재벌이자 대통령 도널드 트럼프는, 서기 867년 브리튼 북부의 옛 로마 방벽—하드리아누스 방벽이 가로지르는 노섬벌랜드와 컴벌랜드의 독립 행정관으로 눈을 떴습니다.\n\n눈을 뜨자마자 옛 주군 노섬브리아가 바이킹에게 멸망할 부실 매물임을 간파한 그는, 특유의 거래의 기술로 바이킹 삼형제와 10년 불가침 협상을 타결지은 뒤 머시아와 동맹을 맺고 노섬브리아의 뒤통수를 쳤습니다! 황금과 관세를 숭배하는 아메리카니즘을 선포한 그가, 과연 노섬브리아를 집어삼키고 역사상 가장 크고 아름다운 장벽을 다시 세울 수 있을까요?"
 TRUCE_TRUMP_VIKING_DEAL:0 "거래의 기술에 따른 불가침 협상"
