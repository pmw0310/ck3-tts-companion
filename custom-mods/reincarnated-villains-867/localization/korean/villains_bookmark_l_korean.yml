 pol_pot_proclaim_democratic_kampuchea_decision:0 "민주 캄푸치아 창건과 제0년 선포"
 pol_pot_proclaim_democratic_kampuchea_decision_desc:0 "앙코르의 낡은 신왕과 부패한 사원 귀족들이 마침내 무너졌습니다! 이제 화폐와 시장, 계급과 구시대의 역사를 모두 불태우고, 오직 앙카르의 지령 아래 모든 인민이 검은 농민복을 입고 집단농장을 일구는 위대한 '제0년'의 나라—'민주 캄푸치아'의 창건을 선포할 시간입니다!"
 pol_pot_proclaim_democratic_kampuchea_decision_tooltip:0 "'민주 캄푸치아'를 창설하고 폴 포트 가문의 제0년 농본 공산주의 체제를 선포합니다."
 pol_pot_proclaim_democratic_kampuchea_decision_confirm:0 "오늘부터 역사는 제0년으로 다시 시작된다!"
