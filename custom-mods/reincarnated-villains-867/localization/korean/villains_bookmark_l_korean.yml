 sa_stormtroopers_flavor:0 "#F 갈색 셔츠를 맞춰 입고 당원 집회장과 거리를 장악한 국가사회주의 당원 행동대입니다. 광신적인 사기와 기동력으로 적의 전열을 기습해 무너뜨립니다.#!"
 stalin_red_guards_name:0 "볼셰비키 적위대"
 red_guards:0 "적위대"
 red_guards_flavor:0 "#F 붉은 완장을 차고 혁명과 숙청의 최전선에 나선 무장 노동자·당원 결사대입니다. 혹독한 추위와 깊은 삼림 속에서도 당 중앙의 지령을 끝까지 관철합니다.#!"
 mussolini_blackshirts_name:0 "검은셔츠단 의용대"
 blackshirts_militia:0 "검은셔츠단"
 blackshirts_militia_flavor:0 "#F 검은 셔츠와 단검, 곤봉으로 무장하고 '두체'의 명령에 따라 행군하는 파시스트 준군사 행동대입니다. 시가전과 구릉지 기습에서 거침없는 공세를 펼칩니다.#!"
 bookmark_reincarnated_stalin:0 "서기장 이오시프 스탈린"
 bookmark_reincarnated_stalin_subheading:0 "모스크바와 블라디미르의 족장"
 bookmark_reincarnated_stalin_desc:0 "모스크바 별장에서 눈을 감았던 이오시프 스탈린이 다시 깨어났을 때, 화려한 크렘린 궁전은 온데간데없고 통나무 울타리만 둘러쳐진 서기 867년 모스크바의 원시 부족 마을이 펼쳐져 있었습니다.\n\n프롤레타리아 노동자는커녕 문자도 모르는 삼림 부족민들뿐이지만, 서기장 동지에게는 사소한 문제일 뿐입니다. 사유재산 철폐와 무자비한 대숙청의 교리를 내걸고 붉은 군대를 일으킨 그가, 통나무집에서 시작해 유라시아를 뒤덮는 소비에트 초강대국을 건설할 수 있을까요?"
 dynn_Stalin_867:0 "스탈린"
 dynn_Stalin_867_motto:0 "만국의 노동자여, 단결하라!"
 nick_the_general_secretary:0 "강철의 사나이"
 nick_the_general_secretary_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 강철처럼 냉혹한 의지와 무자비한 숙청으로 당과 인민을 틀어쥔 '강철의 사나이'입니다. 편집증적인 감시망 앞에 영지의 귀족과 농민들은 숨조차 제대로 쉬지 못합니다."
 bolshevism_religion:0 "공산주의"
 bolshevism_religion_adj:0 "공산주의"
 bolshevism_religion_adherent:0 "공산주의자"
 bolshevism_religion_adherent_plural:0 "공산주의자"
 bolshevism_religion_desc:0 "모든 토지와 생산수단의 집산화와 계급 철폐, 세계 혁명 전쟁을 설파하는 공산주의 이념 체계입니다."
 bolshevism:0 "볼셰비즘"
 bolshevism_adj:0 "볼셰비즘"
 bolshevism_adherent:0 "볼셰비키"
 bolshevism_adherent_plural:0 "볼셰비키"
 bolshevism_desc:0 "모든 토지와 생산수단의 집산화, 당 중앙의 절대 권위, 그리고 무자비한 숙청과 세계 혁명 전쟁을 설파하는 급진적 사상입니다. 봉건적 특권과 낡은 계급 질서를 타파하고 오직 당 중앙과 최고 서기장의 강철 같은 지령에 복종하는 것만이 인민의 낙원을 건설하는 길이라 가르칩니다."
