 khlystism_desc:0 "'성스러운 방탕을 통한 구원'을 설파하는 러시아 신비주의 비밀 종파 흘리스티는, 엄격한 제도권 성직자와 수도원을 배격하고 성령이 살아있는 인간의 육신에 직접 강림한다고 믿습니다. 끝없는 원무와 황홀경의 야간 집회 속에서 육체적 죄악에 깊이 빠져들고 참회할 때에야 비로소 영혼이 구원에 이른다고 가르칩니다."
