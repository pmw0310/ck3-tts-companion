 artifact_relic_golden_fasces_name:0 "신로마 집정관의 황금 속간"
 artifact_relic_golden_fasces_desc:0 "고대 로마 집정관의 권위와 파시스트 국가의 절대적인 단결을 상징하는 황금 결속 도끼입니다. 하나하나의 나뭇가지는 부러지기 쉬우나 하나로 묶인 다발은 결코 꺾이지 않는다는 전체주의 결속의 이념이 깃들어 있습니다."
 artifact_relic_san_sepolcro_manifesto_name:0 "산 세폴크로 창립 강령 원고"
 artifact_relic_san_sepolcro_manifesto_desc:0 "밀라노 산 세폴크로 광장에서 이탈리아 전투 파쇼의 창설을 선포하며 낭독된 파시즘 최초의 강령 원고입니다. 검은셔츠단 대원들의 서약이 적힌 이 문서는 파시스트 운동의 출발점으로 추앙받습니다."
 artifact_relic_blackshirt_standard_name:0 "로마 진군 검은셔츠단 군기"
 artifact_relic_blackshirt_standard_desc:0 "에밀리아로마냐에서 결집해 로마 진군의 선봉에 섰던 검은셔츠단 제1군단의 검은 독수리 군기입니다. 금실로 수놓인 속간과 해골 문양은 타협 없는 진격을 상징합니다."
 artifact_relic_march_on_rome_dagger_name:0 "나폴리 대집회 집정관 단검"
 artifact_relic_march_on_rome_dagger_desc:0 "로마 진군 직전 나폴리 전당대회에서 두체가 검은셔츠단 사령관들에게 하사하며 권력 장악을 결의한 의식용 황금 단검입니다."
 artifact_relic_mare_nostrum_aquila_name:0 "마레 노스트룸의 청동 독수리상"
 artifact_relic_mare_nostrum_aquila_desc:0 "고대 로마가 카르타고를 굴복시키고 지중해를 우리의 바다로 삼았던 영광을 기리며 주조된 군단 독수리 성물입니다."
 artifact_relic_blutfahne_name:0 "피의 깃발 블루트파네"
 artifact_relic_blutfahne_desc:0 "뮌헨 봉기 당시 쓰러진 당원들의 피로 물든 국가사회주의 최고의 성물 군기입니다. 모든 신규 당기와 군단은 이 깃발의 끝자락을 맞대는 의식을 통해서만 비로소 정식 성화로 인정받습니다."
 artifact_relic_bronze_reichsadler_name:0 "제국수상부의 청동 독수리상"
 artifact_relic_bronze_reichsadler_desc:0 "천년왕국의 수도 베를린을 굽어보도록 주조된 거대한 청동 제국 독수리 조형물입니다. 날카로운 발톱으로 세계를 움켜쥔 독수리의 형상은 국가에 대한 절대 복종과 정복 의지를 드러냅니다."
 artifact_relic_reichsparteitag_chalice_name:0 "전당대회의 성화 성배"
 artifact_relic_reichsparteitag_chalice_desc:0 "뉘른베르크 제국 전당대회에서 수십만 대열이 빛의 성당 아래 모여 충성 맹세를 봉헌할 때 사용된 의식용 성배입니다."
 artifact_relic_mein_kampf_manuscript_name:0 "나의 투쟁 친필 원본"
 artifact_relic_mein_kampf_manuscript_desc:0 "총통이 빈에서의 청년기 각성과 뮌헨 봉기 이후 직접 구술하고 서명한 국가사회주의 최고 경전의 친필 원본입니다."
 artifact_relic_wewelsburg_ring_name:0 "베벨스부르크 검은 태양 성배"
 artifact_relic_wewelsburg_ring_desc:0 "토이토부르크 숲 인근 파더보른의 베벨스부르크 성 지하 원탁에서 최정예 기사단이 충성을 맹세할 때 봉헌된 비전의 성배입니다."
 artifact_relic_kremlin_red_star_name:0 "크렘린의 붉은 별과 국새"
 artifact_relic_kremlin_red_star_desc:0 "모스크바 크렘린 첨탑 위에서 세계 프롤레타리아 혁명을 비추는 붉은 루비 별과 노동자 및 농민의 주권을 상징하는 낫과 망치 국새입니다."
 artifact_relic_aurora_shell_name:0 "방호순양함 오로라호의 포탄피"
 artifact_relic_aurora_shell_desc:0 "네바강 위에서 겨울궁전 습격과 시월 사회주의 대혁명의 개시를 알린 방호순양함 오로라호의 주포 탄피입니다. 구시대를 끝내고 새 시대를 연 혁명의 첫 포성이 이 성물에 남아 있습니다."
 artifact_relic_konarmiya_banner_name:0 "제1기병군의 적기"
 artifact_relic_konarmiya_banner_desc:0 "광활한 우크라이나 평원을 질주하며 반혁명 백군을 분쇄한 붉은 군대 제1기병군의 피 묻은 군기입니다. 깃발에 수놓인 금빛 낫과 망치는 적색 테러의 무자비한 진격을 상징합니다."
 artifact_relic_tsaritsyn_order_name:0 "강철 서기장의 방어 훈장"
 artifact_relic_tsaritsyn_order_desc:0 "볼가강 하류의 붉은 요새를 포위망 속에서 끝까지 사수한 지휘관과 전사들에게 수여된 최초의 혁명 무공 성물입니다."
 artifact_relic_communist_manifesto_name:0 "공산당 선언 친필 초판본"
 artifact_relic_communist_manifesto_desc:0 "트리어에서 태어난 프롤레타리아의 예언자 카를 마르크스가 집필한 혁명 사상의 최고 경전 초판본입니다. 만국의 노동자가 단결하여 낡은 세상의 사슬을 끊으라는 불멸의 선언이 담겨 있습니다."
 artifact_trump_art_of_the_deal_regalia_name:0 "거래의 기술 초판본과 대통령 인장"
 artifact_trump_art_of_the_deal_regalia_desc:0 "금박 장정으로 마감된 거래의 기술 초판본과 백악관 대통령 황금 직인입니다. 트럼프 가문의 당주에게 대대로 전수되어 영지 세수 협상과 가문의 명성을 든든히 뒷받침해 주는 가보입니다."
 artifact_mutaguchi_imphal_gunto_name:0 "제15군 사령관의 임팔 지휘 군도"
 artifact_mutaguchi_imphal_gunto_desc:0 "무다구치 렌야가 임팔 진격을 명령하며 뽑아 들었던 사령관 지휘 군도입니다. 보급 따위는 현지에서 풀을 뜯어 해결하면 된다는 광기 어린 정신주의가 깃들어 있어, 오직 무다구치 렌야 본인이 패용할 때만 전군의 보급 지속 기간과 돌격력이 폭발적으로 상승하며 사후 후손은 결코 다룰 수 없습니다."
 artifact_kim_paektu_marshal_star_name:0 "백두산 혁명 원수별과 최고사령관 국새"
 artifact_kim_paektu_marshal_star_desc:0 "백두혈통의 정통성과 유일영도체제를 상징하는 금빛 원수별 훈장과 최고사령관 국새입니다. 백두 김 씨 가문의 계승자에게 대대로 전해져 반대파의 책동을 억누르고 서슬 퍼런 공포를 유지시킵니다."
 hitler_proclaim_thousand_year_reich_decision:0 "독일 왕국 창건 선포"
 hitler_proclaim_thousand_year_reich_decision_desc:0 "인스브루크의 작은 산악 요새에서 시작된 우리의 투쟁은 마침내 바이에른 전역과 알프스를 완전히 장악하기에 이르렀습니다. 이제 낡은 카롤링거 왕실의 굴레를 벗어던지고, 히틀러 가문의 영도 아래 하나 된 '독일 왕국'의 창건을 온 세상에 선포할 때가 왔습니다!"
 hitler_proclaim_thousand_year_reich_decision_tooltip:0 "독자적인 '독일 왕국'을 창설하고 히틀러 가문의 영구적인 총통 지도 체제를 선포합니다."
 hitler_proclaim_thousand_year_reich_decision_confirm:0 "하나의 백성, 하나의 왕국, 하나의 총통!"
 hitler_thousand_year_reich_dynasty_modifier:0 "독일 총통의 혈통"
 hitler_thousand_year_reich_dynasty_modifier_desc:0 "이 가문은 바이에른과 알프스를 평정하고 국가사회주의 독일 왕국을 창건하여, 모든 가문원이 강력한 군사적 권위와 공포를 발휘합니다."
 hitler_ss_guard_army_name:0 "총통 직속 친위대"
 stalin_establish_supreme_soviet_decision:0 "소비에트 왕국 수립과 대숙청"
 stalin_establish_supreme_soviet_decision_desc:0 "모스크바와 블라디미르의 삼림 지대를 완전히 장악한 지금, 구시대 봉건 귀족들을 일소할 '대숙청'을 단행하고 역사상 최초의 붉은 왕국—'소비에트 왕국'을 수립할 시간입니다! 강철의 규율과 무자비한 감시망으로 스탈린 가문의 철권통치를 영구히 굳힐 것입니다."
 stalin_establish_supreme_soviet_decision_tooltip:0 "'소비에트 왕국'을 창설하고 대숙청을 통해 스탈린 가문의 영구적인 철권통치 체제를 확립합니다."
 stalin_establish_supreme_soviet_decision_confirm:0 "소비에트 만세! 반동분자들에게 자비란 없다!"
 stalin_iron_curtain_dynasty_modifier:0 "강철의 서기장 가문"
 stalin_iron_curtain_dynasty_modifier_desc:0 "이 가문은 소비에트 왕국을 수립하고 무자비한 대숙청과 중앙집권화를 관철하여, 모든 반역 음모를 분쇄하고 봉신들로부터 절대적인 복종과 공물을 받아냅니다."
 stalin_nkvd_divisions_name:0 "내무인민위원부 경비사단"
 mussolini_march_on_rome_decision:0 "로마 진군과 신로마 왕국 창건"
 mussolini_march_on_rome_decision_desc:0 "밀라노에서 타오른 검은 셔츠단의 불길이 마침내 북이탈리아 전역을 집어삼켰습니다! 고대 로마의 카이사르가 루비콘강을 건넜듯, 이제 두체의 깃발 아래 '신로마 왕국'의 탄생을 선포하고 지중해를 다시 '우리의 바다'로 만들 때입니다."
 mussolini_march_on_rome_decision_tooltip:0 "'신로마 왕국'을 창설하고 무솔리니 가문의 신로마 질서를 선포합니다."
 mussolini_march_on_rome_decision_confirm:0 "모든 길은 다시 로마로 통한다!"
 mussolini_new_roman_order_dynasty_modifier:0 "신로마의 두체 가문"
 mussolini_new_roman_order_dynasty_modifier_desc:0 "이 가문은 신로마 왕국을 창건하고 고대 로마의 영광을 계승했음을 선포하여, 모든 가문원이 막대한 위신과 정통성을 누립니다."
 mussolini_roman_legions_name:0 "두체 근위 검은셔츠 군단"
 mutaguchi_execute_operation_ugo_decision:0 "임팔 총군 왕국 창건과 초식 병참 교리"
 mutaguchi_execute_operation_ugo_decision_desc:0 "보급이 부족하다고 징징대던 나약한 참모들은 모두 틀렸습니다! 우리는 임팔과 카마루파의 험준한 정글을 돌파해 '일본인은 본래 초식동물'이라는 위대한 진리를 실전으로 증명하고 마침내 '임팔 총군 왕국'을 세웠습니다. 이제 전군에 초식 자급자족 병참 교리를 영구히 하달하여 인도 대륙 끝까지 진격할 것입니다!"
 mutaguchi_execute_operation_ugo_decision_tooltip:0 "'임팔 총군 왕국'을 창설하고 무다구치 가문 고유의 초식 병참 교리를 영구히 확립합니다."
 mutaguchi_execute_operation_ugo_decision_confirm:0 "풀을 뜯어 먹으며 인도로 진격하라!"
 mutaguchi_herbivore_logistics_dynasty_modifier:0 "임팔의 초식 병참 교리"
 mutaguchi_herbivore_logistics_dynasty_modifier_desc:0 "이 가문은 '풀만 있으면 어디든 진군할 수 있다'는 초식 병참 교리를 확립하여, 군대의 보급 지속 기간과 진군 속도가 비약적으로 상승하고 유지비가 대폭 절감됩니다."
 mutaguchi_imphal_vanguard_name:0 "임팔 돌파 반자이 선봉대"
 trump_build_great_wall_and_tower_decision:0 "미국 왕국 창건과 황금 트럼프 타워 건립"
 trump_build_great_wall_and_tower_decision_desc:0 "노섬브리아 전역이 우리의 수중에 들어왔습니다! 이제 무너져가던 옛 하드리아누스 방벽을 역사상 가장 크고 아름다운 '위대한 국경 대장벽'으로 재건하고, 수도에 황금빛 트럼프 타워를 세워 중세 브리튼 땅에 천 년 앞서 '미국 왕국'의 탄생을 선포할 시간입니다!"
 trump_build_great_wall_and_tower_decision_tooltip:0 "'미국 왕국'을 창설하고 수도에 황금 트럼프 타워와 대장벽을 건립합니다."
 trump_build_great_wall_and_tower_decision_confirm:0 "역사상 가장 크고 아름다운 나라가 될 겁니다!"
 trump_golden_empire_dynasty_modifier:0 "거래의 기술과 황금 제국"
 trump_golden_empire_dynasty_modifier_desc:0 "이 가문은 모든 통치와 외교를 완벽한 부동산 거래로 승화시켜, 직할지 세금 수입이 급증하고 모든 건축 비용과 기간이 대폭 단축됩니다."
 trump_golden_tower_county_modifier:0 "황금 트럼프 타워와 대장벽"
 trump_golden_tower_county_modifier_desc:0 "하늘 높이 솟은 황금빛 타워와 난공불락의 국경 대장벽이 자리한 이 백작령은 막대한 무역 관세 수입과 철통같은 방어력을 자랑합니다."
 kim_proclaim_paektu_monolithic_system_decision:0 "조선 인민공화국 창건과 유일영도 체제 선포"
 kim_proclaim_paektu_monolithic_system_decision_desc:0 "서경과 북계를 넘어 개성 일대까지 완전히 평정한 지금, 백두산의 성스러운 혈통을 이어받은 우리 가문 아래 '조선 인민공화국'의 창건을 온 천하에 선포할 때가 왔습니다! 당중앙의 유일사상 십대원칙을 영구히 반포하고, 대를 이어 충성을 바칠 호위사령부 결사대를 창설할 것입니다."
 kim_proclaim_paektu_monolithic_system_decision_tooltip:0 "'조선 인민공화국'을 창설하고 백두혈통의 영구적인 유일영도 체제를 확립합니다."
 kim_proclaim_paektu_monolithic_system_decision_confirm:0 "백두의 혈통을 대를 이어 끝까지!"
 kim_paektu_monolithic_system_dynasty_modifier:0 "백두혈통 유일영도 체제"
 kim_paektu_monolithic_system_dynasty_modifier_desc:0 "이 가문은 조선 인민공화국을 창건하고 신성불가침의 백두혈통 유일영도 체제를 확립하여, 모든 가문원이 강력한 정통성과 공포, 그리고 직할지 통치 한계 보너스를 누립니다."
 kim_supreme_guard_command_name:0 "최고사령부 호위총국 결사대"
 e_greater_german_reich:0 "게르마니아"
 e_greater_german_reich_adj:0 "게르마니아"
 e_soviet_union:0 "소련"
 e_soviet_union_adj:0 "소련"
 e_new_roman_empire:0 "신로마 제국"
 e_new_roman_empire_adj:0 "신로마 제국"
 e_greater_east_asia_imphal:0 "남방 총군"
