 nick_brother_number_one_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 얼굴 없는 최고 조직 '앙카르'의 정점에서 모든 도시 문명과 지식인을 말살하고 역사를 제0년으로 되돌리려는 광기 어린 '킬링필드의 설계자'입니다."
