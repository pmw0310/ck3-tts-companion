 bookmark_reincarnated_kim_jongun_desc:0 "백두혈통의 절대 권력을 휘두르던 김정은과 그의 친여동생 김여정이 서기 867년 옛 고구려의 수도 서경과 성주를 다스리는 실력주의 남매 영주로 함께 눈을 떴습니다.\n\n핵미사일도 호화 열차도 없는 천 년 전의 한반도지만, 남매는 지체 없이 백두산 성지 숭배와 수령 유일체제를 결합한 주체사상의 기치를 올리고 선대 수령들을 살아있는 신으로 추대했습니다. 폭풍군단 결사대와 여동생의 서슬 퍼런 숙청 정치를 앞세워, 과연 최고존엄은 삼한을 적화통일하고 지상낙원을 건설할 수 있을까요?"
