 e_american_empire:0 "미합중국"
 e_american_empire_adj:0 "미합중국"
 e_juche_korea:0 "대조선"
 e_juche_korea_adj:0 "대조선"
 title_peoples_republic_kingdom:0 "인민공화국"
 title_peoples_republic_empire:0 "인민공화국"
 title_soviet_union_empire:0 "사회주의공화국연방"
 mutaguchi_grand_marshal:0 "대원수"
 hitler_proclaim_greater_german_reich_decision:0 "게르마니아 제국 선포"
 hitler_proclaim_greater_german_reich_decision_desc:0 "바이에른과 알프스, 오스트리아에서 북방의 베를린에 이르기까지 모든 독일 땅이 마침내 하나의 깃발 아래 통일되었습니다! 이제 분열의 역사를 끝내고 영원히 무너지지 않을 '게르마니아 제국'의 탄생을 온 세상에 선포할 때입니다!"
 hitler_proclaim_greater_german_reich_decision_tooltip:0 "'게르마니아 제국'을 창설하고 수도를 세계수도 게르마니아로 재건하여 제국의 패권을 확립합니다."
 hitler_proclaim_greater_german_reich_decision_confirm:0 "위대한 게르마니아 제국이여, 영원하라!"
 hitler_greater_german_reich_dynasty_modifier:0 "게르마니아 제국의 지배자"
 hitler_greater_german_reich_dynasty_modifier_desc:0 "이 가문은 전 독일 권역을 통일하고 게르마니아 제국을 창건하여, 모든 가문원이 압도적인 군사 지휘력과 기사 전투력, 제국의 위신을 떨칩니다."
 hitler_germania_world_capital_county_modifier:0 "세계수도 게르마니아"
 hitler_germania_world_capital_county_modifier_desc:0 "거대한 국민대회당과 개선문이 세워진 천년제국의 세계수도로서 막대한 세금과 병력, 개발 성장을 이끌어냅니다."
 hitler_waffen_ss_panzer_army_name:0 "무장친위대 기갑척탄병 사단"
 stalin_proclaim_ussr_superpower_decision:0 "소비에트 연방 창설과 5개년 계획 완수"
 stalin_proclaim_ussr_superpower_decision_desc:0 "모스크바에서 노브고로드와 키이우에 이르는 광활한 대지가 마침내 붉은 깃발 아래 하나로 묶였습니다! 제1차 5개년 계획의 대성공과 함께 인류 역사상 가장 거대한 프롤레타리아 초강대국—'소비에트 사회주의 공화국 연방'의 출범을 선포할 시간입니다!"
 stalin_proclaim_ussr_superpower_decision_tooltip:0 "'소비에트 사회주의 공화국 연방' 제국을 창설하고 5개년 계획을 완수하여 초강대국 체제를 수립합니다."
 stalin_proclaim_ussr_superpower_decision_confirm:0 "깨뜨릴 수 없는 자유 공화국들의 연방이여!"
 stalin_ussr_superpower_dynasty_modifier:0 "붉은 제국의 대원수"
 stalin_ussr_superpower_dynasty_modifier_desc:0 "이 가문은 소비에트 사회주의 공화국 연방을 창설하고 철의 장막과 계획경제를 완성하여, 모든 봉신의 공물과 병력을 총동원하고 적대 음모를 원천 봉쇄합니다."
 stalin_socialist_metropolis_county_modifier:0 "사회주의 총본산 모스크바"
 stalin_socialist_metropolis_county_modifier_desc:0 "5개년 계획의 총아로 거듭난 세계 혁명의 수도로서 건설 속도와 세수, 개발도가 폭발적으로 증가합니다."
 stalin_red_army_shock_corps_name:0 "붉은 군대 제1근위 충격군"
 mussolini_restore_mare_nostrum_empire_decision:0 "마레 노스트룸과 신로마 제국 복원"
 mussolini_restore_mare_nostrum_empire_decision_desc:0 "밀라노에서 시작된 행군이 영원한 도시 로마와 나폴리를 넘어 마침내 바다 건너 카르타고까지 정복했습니다! 아우구스투스와 트라야누스의 옛 제국이 오늘 검은 깃발 아래 부활했으니, 지중해는 다시금 우리의 호수 '마레 노스트룸'이 되었습니다!"
 mussolini_restore_mare_nostrum_empire_decision_tooltip:0 "'신로마 제국'을 복원하고 로마를 제국의 수도로 삼아 지중해 패권을 천명합니다."
 mussolini_restore_mare_nostrum_empire_decision_confirm:0 "로마 제국이 오늘 다시 태어났다!"
 mussolini_mare_nostrum_empire_dynasty_modifier:0 "마레 노스트룸의 황제"
 mussolini_mare_nostrum_empire_dynasty_modifier_desc:0 "이 가문은 로마와 카르타고를 아우르는 신로마 제국을 복원하여, 불굴의 군단 전투력과 제국의 정통성을 영구히 누립니다."
 mussolini_eternal_imperial_rome_county_modifier:0 "영원한 제국의 수도 로마"
 mussolini_eternal_imperial_rome_county_modifier_desc:0 "신로마 제국의 심장으로 다시금 화려하게 재건된 영원한 도시 로마는 막대한 부와 통제력을 뿜어냅니다."
 mussolini_praetorian_cohort_name:0 "신로마 프라이토리아니 근위군단"
 mutaguchi_proclaim_greater_east_asia_decision:0 "남방 총군 제국 수립과 인도 대륙 정복"
 mutaguchi_proclaim_greater_east_asia_decision_desc:0 "임팔과 아삼의 정글을 넘어 버마와 벵골의 대평원까지 모두 우리 제15군의 군화 아래 무릎을 꿇었습니다! 보급선 없이도 풀을 뜯으며 대륙을 횡단할 수 있다는 무다구치 병참학의 완벽한 승리입니다. 이제 인도양과 동남아시아를 아우르는 '남방 총군 제국'의 수립을 선포합니다!"
 mutaguchi_proclaim_greater_east_asia_decision_tooltip:0 "'남방 총군 제국'을 창설하고 인도·버마 전역을 아우르는 무다구치 가문의 대제국을 수립합니다."
 mutaguchi_proclaim_greater_east_asia_decision_confirm:0 "보급은 적에게서, 아니 정글에서 조달한다! 진격하라!"
 mutaguchi_greater_east_asia_dynasty_modifier:0 "남방 총군의 정글 대원수"
 mutaguchi_greater_east_asia_dynasty_modifier_desc:0 "이 가문은 임팔을 넘어 벵골과 버마를 평정하고 초식 기동전의 극의를 달성하여, 군대의 보급 지속력과 진군 속도, 전투 유리함이 극대화됩니다."
 mutaguchi_southern_expeditionary_army_name:0 "황군 남방 총군 결사대"
 trump_proclaim_pax_americana_empire_decision:0 "팍스 아메리카나와 미합중국 제국 선포"
 trump_proclaim_pax_americana_empire_decision_desc:0 "노섬벌랜드에서 요크와 스코틀랜드, 그리고 런던에 이르기까지 브리튼 제도 전체가 우리의 완벽한 부동산 포트폴리오로 편입되었습니다! 이제 역사상 가장 부유하고 위대한 초강대국—'미합중국 제국'을 선포하고 전 세계에 '팍스 아메리카나'와 황금 관세의 시대를 열겠습니다!"
 trump_proclaim_pax_americana_empire_decision_tooltip:0 "'미합중국 제국'을 창설하고 수도에 세계 금융의 중심지 월스트리트를 개장합니다."
 trump_proclaim_pax_americana_empire_decision_confirm:0 "우리는 승리하고 또 승리해서, 승리에 지칠 지경입니다!"
 trump_pax_americana_empire_dynasty_modifier:0 "팍스 아메리카나 초강대국"
 trump_pax_americana_empire_dynasty_modifier_desc:0 "이 가문은 압도적인 자본력과 협상력으로 미합중국 제국을 건설하여, 직할지 한계와 세금 수입이 폭증하고 건축 및 용병 고용 비용이 대폭 절감됩니다."
 trump_wall_street_capital_county_modifier:0 "세계 금융의 수도 월스트리트"
 trump_wall_street_capital_county_modifier_desc:0 "황금 트럼프 타워 아래 전 세계의 금화가 모여드는 금융 수도로서 상상을 초월하는 세금 수입과 발전 속도를 자랑합니다."
 trump_marine_expeditionary_force_name:0 "미합중국 해병 원정군"
 kim_proclaim_juche_superpower_empire_decision:0 "대조선 인민공화국 선포와 주체 천하통일"
 kim_proclaim_juche_superpower_decision_desc:0 "혁명의 수도 서경에서 출발한 우리의 폭풍군단이 개성과 경주를 넘어 북방 고토까지 삼천리 강토를 완전히 평정하였습니다! 이제 어버이 수령님들의 유훈을 받들어 온 세상이 우러러보는 주체의 대제국—'대조선 인민공화국'의 완성을 엄숙히 선포합니다!"
 kim_proclaim_juche_superpower_empire_decision_desc:0 "혁명의 수도 서경에서 출발한 우리의 폭풍군단이 개성과 경주를 넘어 북방 고토까지 삼천리 강토를 완전히 평정하였습니다! 이제 어버이 수령님들의 유훈을 받들어 온 세상이 우러러보는 주체의 대제국—'대조선 인민공화국'의 완성을 엄숙히 선포합니다!"
 kim_proclaim_juche_superpower_empire_decision_tooltip:0 "'대조선 인민공화국'을 창설하고 천하통일 대업을 완수하여 영원한 수령 통치 체제를 완성합니다."
 kim_proclaim_juche_superpower_empire_decision_confirm:0 "위대한 대조선 만세! 주체혁명 위업 만세!"
 kim_juche_superpower_empire_dynasty_modifier:0 "대조선의 영원한 수령"
 kim_juche_superpower_empire_dynasty_modifier_desc:0 "이 가문은 삼한과 북방 고토를 아우르는 대조선 인민공화국을 건설하여, 신앙인들의 절대적인 숭배와 직할지 한계, 공포 및 정통성을 영구히 누립니다."
 kim_revolutionary_pyongyang_county_modifier:0 "혁명의 수도 평양 직할시"
 kim_revolutionary_pyongyang_county_modifier_desc:0 "주체사상탑과 인민대학습당이 우뚝 솟은 강성대국의 심장부로서 난공불락의 요새 방어력과 높은 개발 성장을 자랑합니다."
 kim_strategic_rocket_guard_corps_name:0 "전략군 붉은기 근위군단"
 kim_paektu_idolization_decision:0 "백두혈통 우상화 사업 선포"
 kim_paektu_idolization_decision_desc:0 "백두산의 정기를 타고난 김씨 일가의 핏줄은 평범한 인간이 아니라 온 인민이 영원히 받들어 모셔야 할 주체의 태양이자 광명성입니다! 당 중앙위원회와 선전선동부를 총동원하여 전국 방방곡곡에 영생탑과 태양상을 세우고, 선택된 백두혈통 일원을 살아있는 성인이자 영원한 수령으로 신격화하겠습니다."
 kim_paektu_idolization_decision_tooltip:0 "백두혈통 우상화 대축전을 열어 선택한 일원을 성인으로 추대하고, 계책력이나 외교력·학식 판정에 따라 체제 결속 보상이 결정되는 전용 이벤트를 시작합니다."
 kim_paektu_idolization_decision_confirm:0 "백두산의 광명성으로 영원히 추대하라!"
 kim_paektu_idolization_decision_req_candidate:0 "아직 [GetTrait('saint').GetName( GetNullCharacter )]으로 우상화되지 않은 백두혈통 가문원 또는 직계 가족이 존재함"
 kim_paektu_idolization_decision_select_tt:0 "우상화할 백두혈통 인물을 선택해야 합니다."
 kim_paektu_idolization_decision_effect_tt:0 "[idolized_target.GetShortUIName|U] 동지가 [GetTrait('saint').GetName( GetNullCharacter )] 특성 및 황금 후광을 얻고 주체사상 영생 성인 명부에 공식 등재됨"
 axis_mass_agitation_decision:0 "대중 선동과 군중 집회 개최"
 axis_mass_agitation_decision_hitler_title:0 "제국 전당대회 및 대중 선동 연설"
 axis_mass_agitation_decision_mussolini_title:0 "광장 발코니 대중 선동 연설"
 axis_mass_agitation_decision_hitler_desc:0 "깃발과 횃불이 물결치는 광장에 수만 명의 군중이 집결했습니다! 침이 튀도록 포효하는 총통의 열변으로 민중의 이성을 마비시키고, 거리에서 휩쓸려 자원입대하는 열성 돌격대원들을 긁어모으겠습니다!"
 axis_mass_agitation_decision_mussolini_desc:0 "궁전 발코니 아래 운집한 인파가 두체의 등장을 연호하고 있습니다! 팔짱을 끼고 턱을 치켜든 특유의 과장된 몸짓과 불타는 웅변으로 로마의 영광을 부르짖어, 군중을 열광시키고 검은셔츠단 의용대를 거리로 불러 모으겠습니다!"
 axis_mass_agitation_decision_tooltip:0 "대규모 군중 집회를 열고 당신의 외교력이나 계책력에 따라 돌격의용대 소집 규모와 선동 성과가 결정되는 전용 이벤트를 시작합니다."
 axis_mass_agitation_decision_hitler_confirm:0 "하일! 하나의 민족, 하나의 제국, 하나의 총통!"
 axis_mass_agitation_decision_mussolini_confirm:0 "믿으라, 복종하라, 그리고 싸우라!"
 axis_mass_agitation_modifier:0 "광적인 군중 선동"
 axis_mass_agitation_modifier_desc:0 "통치자의 최면 같은 대중 연설에 홀린 영지민들이 앞다투어 징집에 응하고 있습니다."
 stalin_great_purge_decision:0 "반혁명분자 대숙청 단행"
 stalin_great_purge_decision_desc:0 "당 내부와 영지 곳곳에 숨어든 트로츠키주의자, 반혁명 음모꾼, 그리고 곡물을 빼돌리는 배부른 부농들을 뿌리째 뽑아낼 시간입니다! 죄목이 없으면 만들어서라도 무자비한 숙청 재판과 재산 국유화를 단행하여, 온 나라에 강철 같은 공포와 통제력을 확립하겠습니다!"
 stalin_great_purge_decision_tooltip:0 "심야 숙청 재판을 열어 당신의 계책력이나 관리력에 따라 반혁명분자 색출 및 재산 몰수 성과가 결정되는 전용 이벤트를 시작합니다."
 stalin_great_purge_decision_confirm:0 "숙청 명단에 서명하라! 반동분자에게 자비란 없다!"
 stalin_great_purge_modifier:0 "대숙청의 공포 정치"
 stalin_great_purge_modifier_desc:0 "밤마다 울리는 체포조의 발소리에 모든 봉신과 음모꾼들이 공포에 질려 감히 숨소리조차 크게 내지 못하며 세금을 바칩니다."
 trump_monetize_faith_decision:0 "애국 후원금 모금 및 황금 굿즈 판매"
 trump_monetize_faith_decision_desc:0 "우리의 위대한 애국자들과 열성 신도들은 트럼프 타워가 새겨진 황금 성조기 성경과 한정판 황금 신발, 애국 채권에 기꺼이 지갑을 열 준비가 되어 있습니다! 그들의 뜨거운 신앙심과 애국심을 역사상 가장 아름다운 현금 흐름으로 전환하겠습니다!"
 trump_monetize_faith_decision_tooltip:0 "황금 성전 후원 만찬을 열어 당신의 관리력이나 외교력에 따라 성물 경매 수익과 후원 규모가 결정되는 전용 이벤트를 시작합니다."
 trump_monetize_faith_decision_confirm:0 "최고의 굿즈, 최고의 후원금! 지금 바로 주문하세요!"
 trump_super_pac_fundraising_modifier:0 "슈퍼 팩 황금 모금"
 trump_super_pac_fundraising_modifier_desc:0 "지지자들의 자발적인 정치 후원금과 황금 굿즈 판매 수익이 국고로 쏟아져 들어오며 용병 계약 협상력이 높아집니다."
 mutaguchi_geisha_banquet_decision:0 "사령부 진중 요정 연회 개최"
 mutaguchi_geisha_banquet_decision_desc:0 "전선의 장병들이 정글의 풀을 뜯으며 행군하는 동안, 후방 사령관에게는 고도의 작전 구상을 위한 심신 수양이 필요한 법입니다! 사령부 전용 진중 요정에 게이샤들을 불러 모아 최고급 청주와 산해진미로 성대한 밤 연회를 열겠습니다!"
 mutaguchi_geisha_banquet_decision_tooltip:0 "사령부 진중 요정 연회를 열어 정신력 작전 훈시나 주석 환대 판정에 따라 사기와 스트레스 해소가 갈리는 전용 이벤트를 시작합니다."
 mutaguchi_geisha_banquet_decision_confirm:0 "전선은 참모들에게 맡기고, 오늘 밤은 요정으로 간다!"
 mutaguchi_geisha_banquet_modifier:0 "사령부 요정의 밤"
 mutaguchi_geisha_banquet_modifier_desc:0 "사령부 후방에 마련된 호화 요정에서 매일 밤 연회를 즐기며 스트레스를 잊고 사교와 유혹에 열중하고 있습니다."
