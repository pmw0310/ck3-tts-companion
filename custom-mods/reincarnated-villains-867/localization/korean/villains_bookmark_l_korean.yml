 nick_conqueror_of_british_empire_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 스스로를 '지상의 모든 짐승과 바다의 모든 물고기의 주인'이자 '스코틀랜드의 마지막 왕', '대영제국의 정복자'라 칭하는 과대망상적 군벌 독재자입니다."
