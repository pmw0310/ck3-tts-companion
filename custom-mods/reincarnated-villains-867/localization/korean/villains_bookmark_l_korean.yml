 nick_the_president:0 "거래의 달인"
 nick_the_president_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 모든 외교와 전쟁, 통치를 거대한 부동산 협상으로 취급하는 '거래의 달인'입니다. 국경마다 거대하고 아름다운 방벽을 세우고 경쟁 영주들에게 막대한 관세를 물리는 데 집착합니다."
