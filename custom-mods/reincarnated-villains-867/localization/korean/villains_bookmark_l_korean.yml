 state_shinto_desc:0 "국가주의적 군국주의와 절대 복종의 정신주의, 그리고 끝없는 대동아 정복 전쟁의 교리를 결합한 급진적 사상입니다. 물자와 보급의 한계조차 '필승의 신념'과 옥쇄 정신으로 돌파할 수 있다고 설파하며, 오직 사령관의 무모한 돌격 명령에 목숨을 바치는 것만이 신성한 본분이라 가르칩니다."
