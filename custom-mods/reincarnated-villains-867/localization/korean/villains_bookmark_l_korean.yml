 national_socialism_desc:0 "전체주의적 국가관과 민족공동체 우월주의, 그리고 끝없는 생존권 정복 전쟁의 교리를 결합한 급진적 사상입니다. 나약한 자비와 금욕을 배격하며, 오직 절대적 지도자에 대한 복종과 투쟁, 그리고 철과 피를 통한 영토 확장만이 섭리를 실현하는 길이라고 설파합니다."
