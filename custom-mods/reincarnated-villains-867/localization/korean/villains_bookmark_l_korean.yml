l_korean:
 bm_867_reincarnated_hitler:0 "전생한 악당들"
 bm_867_reincarnated_hitler_desc:0 "서기 867년, 근현대사에서 온갖 광기와 기행, 블랙코미디로 역사를 뒤흔들었던 독재자·선동가·장군들이 어째서인지 천 년 전 중세 시대의 변방 영주로 나란히 전생했습니다.\n\n현세의 고집과 자기애, 기상천외한 사상을 고스란히 간직한 채 유라시아 각지에서 눈을 뜬 이들 중, 과연 누가 중세의 상식을 박살 내고 최후의 승자가 될까요?"
 bookmark_reincarnated_hitler:0 "총통 아돌프 히틀러"
 bookmark_reincarnated_hitler_subheading:0 "인스브루크와 브릭센의 백작"
 bookmark_reincarnated_hitler_desc:0 "베를린 지하 벙커에서 권총 방아쇠를 당긴 아돌프 히틀러가 눈을 뜬 곳은, 저승도 미술대학 강의실도 아닌 서기 867년 알프스 산골의 인스브루크와 브릭센 백작령이었습니다.\n\n비록 전차 한 대 없는 중세 봉건 영주 신세로 전락했지만, 특유의 광기 어린 웅변술과 생존권 집착은 조금도 식지 않았습니다. 알프스 너머 밀라노에 나란히 떨어진 옛 동맹 무솔리니와 다시 손을 잡은 그가, 과연 이번 생에는 모형이 아닌 진짜 세계수도를 세울 수 있을까요?"
 dynn_Hitler_867:0 "히틀러"
 dynn_Hitler_867_motto:0 "하나의 백성, 하나의 제국, 하나의 지도자"
 nick_the_fuhrer:0 "광기의 선동가"
 nick_the_fuhrer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 천 년 뒤의 세계에서 가져온 광기 어린 웅변술과 절대 권력을 향한 집념으로 군중을 최면에 빠뜨리는 선동가입니다. 그의 열변 앞에서는 중세의 신하들조차 공포와 열광 속에 복종합니다."
