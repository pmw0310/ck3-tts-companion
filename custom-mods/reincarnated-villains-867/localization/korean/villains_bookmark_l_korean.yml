 pol_pot_year_zero_utopia_dynasty_modifier_desc:0 "이 가문은 구시대의 사원 왕국을 타도하고 민주 캄푸치아를 창건하여, 철통같은 내부 감시망과 농민 유격대 동원력을 발휘합니다."
 pol_pot_angkar_central_division_name:0 "앙카르 혁명군 중앙사단"
 pol_pot_proclaim_angkar_agrarian_empire_decision:0 "캄푸치아 인민공화국 선포와 제0년 대공세"
 pol_pot_proclaim_angkar_agrarian_empire_decision_desc:0 "앙코르와 프놈펜에서 타오른 제0년의 불길이 메콩강 삼각주와 참파, 진랍의 정글까지 인도차이나 전역을 붉게 물들였습니다! 구시대의 화려한 사원 왕국들을 모두 허물고, 온 동남아시아를 하나의 거대한 집단농장으로 통합한 초강대국—'캄푸치아 인민공화국'의 완성을 선포합니다!"
 pol_pot_proclaim_angkar_agrarian_empire_decision_tooltip:0 "'캄푸치아 인민공화국' 제국을 창설하고 동남아시아 전역을 제0년의 거대 집단농장 제국으로 재편합니다."
 pol_pot_proclaim_angkar_agrarian_empire_decision_confirm:0 "위대한 앙카르와 붉은 캄푸치아여, 영원하라!"
 pol_pot_red_khmers_supreme_dynasty_modifier:0 "제0년의 최고 설계자"
 pol_pot_red_khmers_supreme_dynasty_modifier_desc:0 "이 가문은 인도차이나 전역을 평정하고 캄푸치아 인민공화국을 수립하여, 절대적인 공포와 직할지 통제력, 광신적인 충성을 누립니다."
 pol_pot_year_zero_commune_capital_county_modifier:0 "제0년 중앙 제1집단농장"
 pol_pot_year_zero_commune_capital_county_modifier_desc:0 "모든 인민이 밤낮없이 집단 노역과 군사 훈련에 동원되는 제0년 혁명의 심장부로서 막대한 식량 세수와 요새 방어력을 자랑합니다."
 pol_pot_red_khmers_grand_army_name:0 "앙카르 적색 크메르 총군단"
 pol_pot_year_zero_great_purge_decision:0 "제0년 도시 비우기와 집단농장 강제 하방"
 pol_pot_year_zero_great_purge_decision_desc:0 "도시에 기생하는 상인과 화폐 경제, 사치스러운 사원 문화는 모두 앙카르의 순수한 농경 유토피아를 좀먹는 구시대의 적폐입니다! 모든 도시 거주민을 즉시 정글의 집단농장으로 강제 하방시켜 괭이를 쥐여 주고, 영지 전체를 자급자족 농경 공동체로 재편하겠습니다!"
 pol_pot_year_zero_great_purge_decision_tooltip:0 "영년의 도시 비우기 행군을 단행하여 계책력이나 관리력 판정에 따라 집단농장 동원과 개간 성과가 갈리는 전용 이벤트를 시작합니다."
 pol_pot_year_zero_great_purge_decision_confirm:0 "모두 도시를 비우고 정글의 협동농장으로 집결하라!"
 pol_pot_year_zero_commune_labor_modifier:0 "제0년 집단농장 총동원령"
 pol_pot_year_zero_commune_labor_modifier_desc:0 "강제 하방된 신인민들의 집단 노역으로 영지 내 건설 비용과 기간이 대폭 단축되고 병력 충원 속도가 급증합니다."
 pol_pot_peasant_purification_squad_name:0 "앙카르 농민 정화대"
 pol_pot_arrest_intellectuals_decision:0 "반동 지식인 색출 및 투올슬렝 투옥"
 pol_pot_arrest_intellectuals_decision_desc:0 "글자를 읽을 줄 아는 자, 경전을 외우는 학자와 의사, 머리가 비상하거나 손바닥이 하얀 자들은 모두 앙카르를 배신할 부르주아 지식인들입니다! '보존해도 이득이 없고 제거해도 손해가 없다'는 원칙 아래, 영지 내의 지식인을 즉시 체포하여 투올슬렝 지하 감옥에 가두겠습니다!"
 pol_pot_arrest_intellectuals_decision_tooltip:0 "체포한 반동 지식인을 특별 심문소로 끌고 가 대상과의 계책력·학식 대결에 따라 자백 확보와 사상 개조 여부가 결정되는 전용 이벤트를 시작합니다."
 pol_pot_arrest_intellectuals_decision_confirm:0 "투올슬렝 지하 감옥으로 끌고 가라! 자백서를 받아내라!"
 pol_pot_arrest_intellectuals_decision_req_candidate:0 "궁정 또는 직속 봉신 중에 아직 투옥되지 않은 성인 지식인, 즉 [learning|E]이 10 이상이거나 학식·지성·학자·시인·의사 특성을 보유한 인물이 존재함"
 pol_pot_arrest_intellectuals_decision_select_tt:0 "투올슬렝 지하 감옥에 투옥할 반동 지식인을 선택해야 합니다."
 pol_pot_arrest_intellectuals_decision_effect_tt:0 "[arrested_intellectual.GetShortUIName|U](이)가 반동 지식인으로 지목되어 재산을 몰수당하고 즉시 지하 감옥에 투옥됨"
 pol_pot_tuol_sleng_purge_modifier:0 "투올슬렝 사상 심문"
 pol_pot_tuol_sleng_purge_modifier_desc:0 "투올슬렝 보안감옥에서 밤낮으로 이어지는 색출과 심문 앞에 영지 내의 모든 지식인과 음모꾼들이 공포에 떨고 있습니다."
 k_uganda:0 "우간다 제2공화국"
 k_uganda_adj:0 "우간다"
 e_uganda_empire:0 "우간다 대제국"
 e_uganda_empire_adj:0 "우간다"
 flav_idi_amin_king_male:0 "원수 각하"
 flav_idi_amin_emperor_male:0 "종신 대원수"
 idi_amin_proclaim_uganda_republic_decision:0 "우간다 제2공화국 및 종신 대통령 선포"
 idi_amin_proclaim_uganda_republic_decision_desc:0 "나일강 상류의 센나르와 알로디아 전역을 우리의 심바 대대가 완전히 장악했습니다! 이제 스스로에게 빅토리아 십자훈장과 원수 계급장을 수여하고, '스코틀랜드의 마지막 왕'이자 종신 대통령이 통치하는 불패의 군사 국가—'우간다 제2공화국'의 탄생을 온 세상에 선포할 시간입니다!"
 idi_amin_proclaim_uganda_republic_decision_tooltip:0 "'우간다 제2공화국'을 창설하고 종신 대통령 작위와 심바 기계화 대대 1,000명을 소집합니다."
 idi_amin_proclaim_uganda_republic_decision_confirm:0 "짐이 곧 우간다의 종신 대통령이자 원수 각하시다!"
 idi_amin_last_king_of_scotland_dynasty_modifier:0 "스코틀랜드의 마지막 왕이자 종신 원수"
 idi_amin_last_king_of_scotland_dynasty_modifier_desc:0 "이 가문은 우간다 제2공화국을 창건하고 스스로에게 온갖 화려한 원수 칭호와 훈장을 수여하여 압도적인 무력과 공포를 과시합니다."
 idi_amin_proclaim_british_conqueror_empire_decision:0 "대영제국 정복자 및 우간다 대제국 선포"
 idi_amin_proclaim_british_conqueror_empire_decision_desc:0 "나일강 상류에서 시작된 우리의 행군이 누비아와 코르도판, 다르푸르의 사바나까지 동아프리카 전역을 집어삼켰습니다! 이제 '지상의 모든 짐승과 바다의 모든 물고기의 주인'이자 '대영제국의 정복자'라는 위대한 칭호에 걸맞은 초거대 군벌 제국—'우간다 대제국'의 등극을 엄숙히 선포합니다!"
 idi_amin_proclaim_british_conqueror_empire_decision_tooltip:0 "'우간다 대제국'을 창설하고 수도 캄팔라 총사령부 버프 및 심바 기계화 대대 2,000명을 소집합니다."
 idi_amin_proclaim_british_conqueror_empire_decision_confirm:0 "지상의 모든 짐승과 바다의 물고기들아, 대원수 앞에 엎드려라!"
 idi_amin_conqueror_of_all_beasts_dynasty_modifier:0 "지상의 모든 짐승과 바다의 물고기들의 지배자"
 idi_amin_conqueror_of_all_beasts_dynasty_modifier_desc:0 "이 가문은 동아프리카를 제패하고 우간다 대제국을 건설하여, 누구도 감히 넘볼 수 없는 괴력과 공포, 최정예 친위 기사단을 거느립니다."
 idi_amin_kampala_command_capital_modifier:0 "캄팔라 총사령부와 나일강 악어 처형장"
 idi_amin_kampala_command_capital_modifier_desc:0 "대원수의 황금 연회장과 악어들이 우글거리는 처형장이 자리 잡은 제국의 수도로서 막대한 공납과 삼엄한 경비를 자랑합니다."
 idi_amin_economic_war_expulsion_decision:0 "경제 전쟁 선포 및 외래 상인 재산 몰수"
 idi_amin_economic_war_expulsion_decision_desc:0 "어젯밤 꿈속에서 전능하신 신께서 직접 계시를 내리셨습니다! 우리 영지의 상권을 쥐락펴락하며 금화를 쓸어 담는 외래 상인들과 배부른 부유층들의 재산을 전부 몰수하여, 충직한 심바 대대 장교들과 군부 측근들에게 통 크게 나누어 주는 위대한 '경제 전쟁'을 선포하겠습니다!"
 idi_amin_economic_war_expulsion_decision_tooltip:0 "경제 전쟁을 선포하여 전투력이나 관리력 판정에 따라 상점가 무력 접수 또는 국영 상회 운영 성과가 갈리는 전용 이벤트를 시작합니다."
 idi_amin_economic_war_expulsion_decision_confirm:0 "오늘부터 모든 상점과 금고는 우리 군부의 것이다!"
 idi_amin_economic_war_spoils_modifier:0 "경제 전쟁 적산 분배"
 idi_amin_economic_war_spoils_modifier_desc:0 "몰수한 상인들의 재산과 점포를 군부 장교들과 봉신들에게 후하게 나누어 주어 군대의 충성심과 사기가 하늘을 찌릅니다."
 idi_amin_srb_crocodile_feast_decision:0 "국가연구국 비밀 만찬 및 악어 밥 처형"
 idi_amin_srb_crocodile_feast_decision_desc:0 "감히 종신 대통령 각하께 불만을 품거나 맞서는 반역자들에게는 자비란 없습니다! 국가연구국 요원들을 보내 놈을 지하 취조실로 끌고 오십시오. 오늘 밤 원수 각하의 비밀 냉장고와 식탁에는 특별한 고기 요리가 오를 것이며, 남은 뼈다귀는 나일강의 굶주린 악어들에게 던져 줄 것입니다!"
 idi_amin_srb_crocodile_feast_decision_tooltip:0 "선택한 정적을 나일강 악어 연못 연회장으로 끌고 가 희생양과의 기량 육탄 대결이나 계책력 연출에 따라 처형 보상이 갈리는 전용 이벤트를 시작합니다."
 idi_amin_srb_crocodile_feast_decision_confirm:0 "식탁을 차려라! 남은 것은 나일강의 악어들에게 던져 주어라!"
 idi_amin_srb_crocodile_feast_decision_req_candidate:0 "감옥에 성인 죄수가 있거나, 궁정 신하·직속 봉신 중 경쟁자·원수 또는 의견이 -25 이하인 불만 세력이 존재함"
 idi_amin_srb_crocodile_feast_decision_select_tt:0 "국가연구국 비밀 만찬 및 악어 밥으로 처형할 대상을 선택해야 합니다."
 idi_amin_srb_crocodile_feast_decision_effect_tt:0 "[crocodile_victim.GetShortUIName|U](이)가 국가연구국 지하실로 끌려가 재산을 몰수당하고 원수의 비밀 만찬 제물로 식인 처형됨"
 idi_amin_crocodile_execution_modifier:0 "나일강의 악어와 원수의 식탁"
 idi_amin_crocodile_execution_modifier_desc:0 "정적을 직접 식탁에 올리고 나일강 악어 밥으로 던져 주는 기괴한 공포 앞에 모든 봉신과 음모꾼들이 벌벌 떨며 복종합니다."
 villains_trickster_fate_name:0 "변덕스러운 운명"
 villains_trickster_fate_name_possessive:0 "변덕스러운 운명의"
 mutaguchi_personal_only_tt:0 "무다구치 렌야 본인만 장착하고 효과를 받을 수 있음"
 artifact_mutaguchi_rising_sun_cordon_name:0 "훈1등 욱일대수장과 작전 참모 수첩"
 artifact_mutaguchi_rising_sun_cordon_desc:0 "대일본제국 훈1등 욱일대수장 정장과 버마 전선의 무모한 기동 계획이 빼곡히 적힌 작전 참모 수첩입니다. 무다구치 가문의 후계자들에게 대대로 전수되어 행군 보급 기간과 지휘 위신을 북돋아 줍니다."
 artifact_hitler_iron_cross_badge_name:0 "1급 철십자 훈장과 당수 배지"
 artifact_hitler_iron_cross_badge_desc:0 "은테 흑칠 철십자 훈장과 금테 초기 당원 배지를 한 쌍으로 엮은 가보입니다. 히틀러 가문의 당주에게 대대로 전승되어 신봉자들의 열광적인 충성과 연설의 위신을 높여 줍니다."
 artifact_stalin_steel_pipe_name:0 "강철 서기장의 담배 파이프"
 artifact_stalin_steel_pipe_desc:0 "묵직한 흑단 나무로 깎아 만든 서기장의 애용 담배 파이프입니다. 자욱한 연기 너머로 정적들의 숙청 명단을 침착하게 검토하던 냉혹함이 깃들어 있어 스탈린 가문 당주의 모략 방어와 평정심을 지켜 줍니다."
 artifact_mussolini_blackshirt_baton_name:0 "두체의 검은셔츠 지휘봉"
 artifact_mussolini_blackshirt_baton_desc:0 "로마 진군 당시 검은셔츠단 대열 앞에서 치켜들었던 황동 독수리 장식 지휘봉입니다. 무솔리니 가문의 후계자들에게 대대로 계승되어 기사단의 돌격 사기와 영주의 위신을 드높입니다."
 artifact_pol_pot_red_krama_notebook_name:0 "붉은 크라마 목도리와 제0년 수첩"
 artifact_pol_pot_red_krama_notebook_desc:0 "격자무늬 붉은 무명 크라마 목도리와 농촌 집단화 지침이 적힌 낡은 야전 수첩입니다. 폴 포트 가문의 후계자들에게 전수되어 광신적 추종자들의 결속을 다지고 숙청에 따르는 폭정 비난을 줄여 줍니다."
 artifact_idi_amin_victoria_cross_name:0 "종신 대통령의 자칭 빅토리아 십자훈장"
 artifact_idi_amin_victoria_cross_desc:0 "제국주의자들을 조롱하며 스스로 가슴에 달아 버린 거대한 금빛 십자훈장입니다. 이디 아민 가문의 당주에게 대대로 물려져 전장에서의 육중한 위압감과 공포, 과시적 위신을 더해 줍니다."
 mutaguchi_imphal_gunto_modifier:0 "제15군 사령관의 임팔 지휘 군도"
 mutaguchi_rising_sun_cordon_modifier:0 "훈1등 욱일대수장과 작전 참모 수첩"
 trump_art_of_the_deal_regalia_modifier:0 "거래의 기술 초판본과 대통령 인장"
 kim_paektu_marshal_star_modifier:0 "백두산 혁명 원수별과 최고사령관 국새"
 hitler_iron_cross_badge_modifier:0 "1급 철십자 훈장과 당수 배지"
 stalin_steel_pipe_modifier:0 "강철 서기장의 담배 파이프"
 mussolini_blackshirt_baton_modifier:0 "두체의 검은셔츠 지휘봉"
