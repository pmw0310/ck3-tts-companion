 bookmark_reincarnated_rasputin:0 "Grigori 'the Mad Monk' Rasputin"
 bookmark_reincarnated_rasputin_subheading:0 "Landless Wandering Mystic of the Neva"
 bookmark_reincarnated_rasputin_desc:0 "Grigori Rasputin, the Siberian mystic starets who enthralled Tsar Nicholas II and Tsarina Alexandra and shook Imperial Russia from behind velvet curtains, survived poisoned cakes, Madeira wine, and bullets before sinking beneath the frozen Neva—only to awaken in 867 AD on the very banks of that river with nothing but a wanderer's tent.\n\nCloaked in the respectable robes of pre-Schism Chalcedonian Greek Rite Christianity, he is free to roam the royal courts of Byzantium and Europe, mesmerizing noblewomen with miraculous healing and hypnotic seduction. Once his secret circle of lovers grows ripe to found the ecstatic sect of Khlystism, will emperors kneel once more beneath the Mad Monk's black cassock?"
 holy_site_neva_khlyst_name:0 "Neva"
 khlystism:0 "Khlystism"
 khlystism_adj:0 "Khlyst"
 khlystism_adherent:0 "Khlyst"
 khlystism_adherent_plural:0 "Khlysts"
 khlystism_desc:0 "Preaching salvation through sacred transgression, the secret Russian mystic sect of Khlystism rejects institutional clergy and monasteries, believing instead that the Holy Spirit descends directly into living flesh. Through ecstatic whirling vigils, believers plunge into carnal sin so that fervent repentance may elevate the soul to divine grace."
