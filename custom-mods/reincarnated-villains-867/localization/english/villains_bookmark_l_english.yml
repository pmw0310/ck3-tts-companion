 bookmark_reincarnated_trump:0 "President Donald Trump"
 bookmark_reincarnated_trump_subheading:0 "Count of Northumberland and Cumberland"
 bookmark_reincarnated_trump_desc:0 "Real estate mogul and 45th & 47th President of the United States—famed for his obsession with border walls and tariffs—Donald Trump has awakened over a millennium in the past in 867 AD right along the ancient Roman border wall of Britain: as the young independent Governor of Northumberland and Cumberland along Hadrian's Wall.\n\nRealizing at once that the Kingdom of Northumbria was doomed to fall to the Sons of Ragnar, he used his signature 'Art of the Deal' to strike a ten-year non-aggression truce with the invading Viking brothers, forged an alliance with Mercia, and betrayed King Aella by launching a war against Northumbria from within! Having proclaimed 'Americanism', can he swallow up Northumbria, rebuild Hadrian's Wall bigger and better than ever, and make Britain great again?"
