 pol_pot_proclaim_democratic_kampuchea_decision:0 "Proclaim Democratic Kampuchea and Year Zero"
 pol_pot_proclaim_democratic_kampuchea_decision_desc:0 "The decadent God-Kings of Angkor and their corrupt temple elites have fallen! It is time to burn away currency, markets, and history itself, and proclaim the birth of 'Democratic Kampuchea'—the agrarian utopia of Year Zero!"
 pol_pot_proclaim_democratic_kampuchea_decision_tooltip:0 "Found 'Democratic Kampuchea' and establish the Year Zero agrarian communist regime."
 pol_pot_proclaim_democratic_kampuchea_decision_confirm:0 "From this day forward, history begins anew at Year Zero!"
 pol_pot_year_zero_utopia_dynasty_modifier:0 "Supreme Organization of Year Zero"
 pol_pot_year_zero_utopia_dynasty_modifier_desc:0 "This dynasty overthrew the old temple kingdoms and founded Democratic Kampuchea, commanding total surveillance and peasant guerrilla mobilization."
 pol_pot_angkar_central_division_name:0 "Angkar Revolutionary Central Division"
 pol_pot_proclaim_angkar_agrarian_empire_decision:0 "Proclaim the People's Republic of Kampuchea"
 pol_pot_proclaim_angkar_agrarian_empire_decision_desc:0 "The flames of Year Zero have swept from Angkor and Phnom Penh across the Mekong Delta, Champa, and Chenla! Having torn down the old temple kingdoms, we now proclaim the supreme agrarian empire of Southeast Asia—the 'People's Republic of Kampuchea'!"
 pol_pot_proclaim_angkar_agrarian_empire_decision_tooltip:0 "Found the 'People's Republic of Kampuchea' Empire and unite mainland Southeast Asia under Angkar."
 pol_pot_proclaim_angkar_agrarian_empire_decision_confirm:0 "Long live Supreme Angkar and Red Kampuchea!"
 pol_pot_red_khmers_supreme_dynasty_modifier:0 "Supreme Architect of Year Zero"
 pol_pot_red_khmers_supreme_dynasty_modifier_desc:0 "This dynasty united Indochina under the People's Republic of Kampuchea, wielding absolute dread, domain authority, and ideological zeal."
 pol_pot_year_zero_commune_capital_county_modifier:0 "Central Collective Commune No. 1"
 pol_pot_year_zero_commune_capital_county_modifier_desc:0 "The beating heart of Year Zero where the entire population is mobilized day and night for collective farming and defense."
 pol_pot_red_khmers_grand_army_name:0 "Angkar Red Khmer Grand Army"
 pol_pot_year_zero_great_purge_decision:0 "Year Zero City Evacuation & Commune Relocation"
 pol_pot_year_zero_great_purge_decision_desc:0 "Urban merchants, currency, and decadent temple life are parasites upon Angkar's pure agrarian utopia! We shall evacuate all townsfolk into the jungle collectives with hoes in hand and reorganize the entire realm into self-sufficient communes!"
 pol_pot_year_zero_great_purge_decision_tooltip:0 "Launch the Year Zero city evacuation, opening an event where your Intrigue or Stewardship determines commune mobilization and harvest results."
 pol_pot_year_zero_great_purge_decision_confirm:0 "Empty the towns and march to the jungle communes!"
 pol_pot_year_zero_commune_labor_modifier:0 "Year Zero Commune Mobilization"
 pol_pot_year_zero_commune_labor_modifier_desc:0 "Mass collective labor drastically reduces construction costs and build times while accelerating levy reinforcement."
 pol_pot_peasant_purification_squad_name:0 "Angkar Peasant Purification Squad"
 pol_pot_arrest_intellectuals_decision:0 "Arrest Reactionary Intellectuals & Tuol Sleng Imprisonment"
 pol_pot_arrest_intellectuals_decision_desc:0 "Those who can read, scholars who recite scriptures, physicians, and the soft-handed intelligentsia are bourgeois traitors to Angkar! Under the maxim 'To keep you is no benefit, to destroy you is no loss', we shall immediately arrest the intellectuals in our realm and cast them into the dungeons of Tuol Sleng!"
 pol_pot_arrest_intellectuals_decision_tooltip:0 "Haul the selected intellectual into interrogation, pitting your Intrigue or Learning against theirs to extract confessions and hidden wealth."
 pol_pot_arrest_intellectuals_decision_confirm:0 "Drag them to Tuol Sleng and extract their confession!"
 pol_pot_arrest_intellectuals_decision_req_candidate:0 "There is at least one un-imprisoned adult intellectual with [learning|E] 10 or higher, or holding an intellectual or scholarly trait, among your courtiers, guests, or direct vassals"
 pol_pot_arrest_intellectuals_decision_select_tt:0 "You must select a reactionary intellectual to imprison in Tuol Sleng."
 pol_pot_arrest_intellectuals_decision_effect_tt:0 "[arrested_intellectual.GetShortUIName|U] is denounced as a reactionary intellectual, stripped of wealth, and thrown into the dungeon"
 pol_pot_tuol_sleng_purge_modifier:0 "Tuol Sleng Interrogation"
 pol_pot_tuol_sleng_purge_modifier_desc:0 "Relentless interrogations and purges in the security prison keep all intellectuals and plotters in the realm paralyzed with terror."
 k_uganda:0 "Second Republic of Uganda"
 k_uganda_adj:0 "Ugandan"
 e_uganda_empire:0 "Grand Empire of Uganda"
 e_uganda_empire_adj:0 "Ugandan"
 flav_idi_amin_king_male:0 "Field Marshal"
 flav_idi_amin_emperor_male:0 "Supreme Field Marshal"
 idi_amin_proclaim_uganda_republic_decision:0 "Proclaim the Second Republic of Uganda & President for Life"
 idi_amin_proclaim_uganda_republic_decision_desc:0 "Our Simba Battalion has secured Sennar and Alodia along the Upper Nile! Now it is time to award ourselves the Victoria Cross and the baton of Field Marshal, proclaiming the invincible military state of the 'Last King of Scotland'—the 'Second Republic of Uganda'!"
 idi_amin_proclaim_uganda_republic_decision_tooltip:0 "Found the 'Second Republic of Uganda' and muster 1,000 Simba Battalion troops."
 idi_amin_proclaim_uganda_republic_decision_confirm:0 "I am the President for Life and Field Marshal of Uganda!"
 idi_amin_last_king_of_scotland_dynasty_modifier:0 "Last King of Scotland & Field Marshal for Life"
 idi_amin_last_king_of_scotland_dynasty_modifier_desc:0 "This dynasty founded the Second Republic of Uganda and bestowed upon itself grand military honors, projecting overwhelming prowess and dread."
 idi_amin_proclaim_british_conqueror_empire_decision:0 "Proclaim Conqueror of the British Empire & Grand Empire of Uganda"
 idi_amin_proclaim_british_conqueror_empire_decision_desc:0 "Our march from the Upper Nile has swallowed Nubia, Kordofan, and the savannas of Darfur! Worthy of the title 'Lord of All the Beasts of the Earth and Fishes of the Sea' and 'Conqueror of the British Empire', we now proclaim the 'Grand Empire of Uganda'!"
 idi_amin_proclaim_british_conqueror_empire_decision_tooltip:0 "Found the 'Grand Empire of Uganda' and muster 2,000 Simba Battalion troops."
 idi_amin_proclaim_british_conqueror_empire_decision_confirm:0 "All beasts of the earth and fishes of the sea, bow before the Field Marshal!"
 idi_amin_conqueror_of_all_beasts_dynasty_modifier:0 "Lord of All the Beasts of the Earth and Fishes of the Sea"
 idi_amin_conqueror_of_all_beasts_dynasty_modifier_desc:0 "This dynasty conquered East Africa and established the Grand Empire of Uganda, commanding terrifying dread and elite knights."
 idi_amin_kampala_command_capital_modifier:0 "Kampala High Command & Nile Crocodile Pits"
 idi_amin_kampala_command_capital_modifier_desc:0 "Home to the Field Marshal's golden banquet hall and crocodile execution pits, the imperial capital boasts high tribute and fortifications."
 idi_amin_economic_war_expulsion_decision:0 "Declare Economic War & Expropriate Merchant Wealth"
 idi_amin_economic_war_expulsion_decision_desc:0 "Last night in a dream, the Almighty revealed His command! We shall launch a grand 'Economic War'—confiscating the shops and gold of wealthy merchants across the realm and distributing the spoils to our loyal Simba officers!"
 idi_amin_economic_war_expulsion_decision_tooltip:0 "Declare an Economic War and open an event where your Martial or Stewardship determines the spoils of seizing merchant districts."
 idi_amin_economic_war_expulsion_decision_confirm:0 "From today, every shop and treasury belongs to our officers!"
 idi_amin_economic_war_spoils_modifier:0 "Economic War Spoils Distribution"
 idi_amin_economic_war_spoils_modifier_desc:0 "Generous distribution of confiscated merchant properties among military officers boosts vassal loyalty and reduces army upkeep."
 idi_amin_srb_crocodile_feast_decision:0 "State Research Bureau Secret Banquet & Crocodile Execution"
 idi_amin_srb_crocodile_feast_decision_desc:0 "There is no mercy for traitors who dare oppose His Excellency the President for Life! Send the State Research Bureau agents to drag them into the basement. Tonight a special dish shall grace the Field Marshal's table, and the bones shall be tossed to the hungry crocodiles of the Nile!"
 idi_amin_srb_crocodile_feast_decision_tooltip:0 "Drag your chosen rival to the Nile crocodile pool, testing your Prowess or Intrigue for a terrifying execution spectacle."
 idi_amin_srb_crocodile_feast_decision_confirm:0 "Set the table, and throw the leftovers to the Nile crocodiles!"
 idi_amin_srb_crocodile_feast_decision_req_candidate:0 "You have an adult prisoner, or a rival, nemesis, or disgruntled courtier or vassal with opinion -25 or lower"
 idi_amin_srb_crocodile_feast_decision_select_tt:0 "You must select a target for the State Research Bureau execution."
 idi_amin_srb_crocodile_feast_decision_effect_tt:0 "[crocodile_victim.GetShortUIName|U] is dragged to the State Research Bureau basement, stripped of wealth, and devoured at the Field Marshal's banquet"
 idi_amin_crocodile_execution_modifier:0 "Crocodiles of the Nile & the Marshal's Table"
 idi_amin_crocodile_execution_modifier_desc:0 "Terrified of ending up on the Field Marshal's dinner plate or in the jaws of Nile crocodiles, all vassals and plotters cower in obedience."
