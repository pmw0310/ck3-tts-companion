l_english:
 bm_867_reincarnated_hitler:0 "Reincarnated Villains"
 bm_867_reincarnated_hitler_desc:0 "In 867 AD, notorious dictators, politicians, and generals from modern history have somehow all reincarnated a thousand years into the past as minor medieval counts.\n\nAwakening across Eurasia with their modern memories and eccentric ideologies fully intact, who among them will upend medieval history and emerge victorious?"
 bookmark_reincarnated_hitler:0 "Führer Adolf Hitler"
 bookmark_reincarnated_hitler_subheading:0 "Count of Innsbruck and Brixen"
 bookmark_reincarnated_hitler_desc:0 "Having lost consciousness in the Berlin bunker in 1945, Adolf Hitler has reincarnated over a millennium in the past in his ancestral Austro-Bavarian homeland—as the young Count of Innsbruck and Brixen in 867 AD.\n\nThough starting as a minor feudal vassal under Bavaria and the Kingdom of East Francia, his ruthless ambition, fanatical Stormtroopers, and demagogic charisma remain intact. Can he consolidate his power in the Alpine borderlands and rise once more to conquer medieval Europe?"
 dynn_Hitler_867:0 "Hitler"
 dynn_Hitler_867_motto:0 "One People, One Empire, One Leader"
 nick_the_fuhrer:0 "the Mad Demagogue"
 nick_the_fuhrer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] hypnotizes the masses with fanatical oratory and an obsession with absolute power brought from a millennium in the future."
