 bookmark_reincarnated_mutaguchi:0 "'The Commander' Renya Mutaguchi"
 bookmark_reincarnated_mutaguchi_subheading:0 "Count of Manipur and Dimapur"
 bookmark_reincarnated_mutaguchi_desc:0 "Infamous for orchestrating the catastrophic 1944 Imphal campaign—where he ignored all supply lines and ordered his starving troops to graze on jungle grass—Lieutenant General Renya Mutaguchi has awakened over a millennium in the past in 867 AD at the very site of his obsession: as the young Japanese Count of Manipur and Dimapur.\n\nSurrounded by the jungles of Assam, the Pagan realm of Burma to the east, and the kingdoms of Kamarupa and Bengal to the west, his stubborn delusion and fanatical belief in 'spirit over logistics' remain unbroken. Can he march beyond Imphal into India in this life?"
 dynn_Mutaguchi_867:0 "Mutaguchi"
 dynn_Mutaguchi_867_motto:0 "Japanese are inherently herbivores!"
 nick_the_imphal_commander:0 "the Commander"
 nick_the_imphal_commander_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is an incorrigible 'Commander' who firmly believes that logistics and supply lines can be overcome by sheer willpower—and by grazing on jungle grass."
