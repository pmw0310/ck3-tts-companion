 artifact_mutaguchi_rising_sun_cordon_desc:0 "The Grand Cordon of the Order of the Rising Sun paired with a campaign staff notebook filled with audacious march plans, passed down through House Mutaguchi to bolster supply endurance and martial prestige."
 artifact_hitler_iron_cross_badge_name:0 "Iron Cross First Class & Party Leader Badge"
 artifact_hitler_iron_cross_badge_desc:0 "A black-and-silver Iron Cross First Class paired with the golden Party Leader badge, inherited by House Hitler to command fanatical devotion from fellow believers and bolster diplomatic prestige."
 artifact_stalin_steel_pipe_name:0 "General Secretary's Briar Tobacco Pipe"
 artifact_stalin_steel_pipe_desc:0 "A heavy dark-wood briar pipe once smoked quietly while reviewing purge lists behind closed doors, passed down through House Stalin to steady the nerves and blunt hostile schemes."
 artifact_mussolini_blackshirt_baton_name:0 "Il Duce's Blackshirt Marshal Baton"
 artifact_mussolini_blackshirt_baton_desc:0 "A brass-eagle marshal baton raised high during the March on Rome, passed down through House Mussolini to inspire Blackshirt knights and project imperial prestige."
 artifact_pol_pot_red_krama_notebook_name:0 "Red Krama Scarf & Year Zero Field Notebook"
 artifact_pol_pot_red_krama_notebook_desc:0 "A checkered red cotton krama scarf kept alongside a weathered Year Zero cadre notebook, inherited within House Pol Pot to cement ideological loyalty and mute accusations of tyranny."
 artifact_idi_amin_victoria_cross_name:0 "President for Life's Self-Awarded Victoria Cross"
 artifact_idi_amin_victoria_cross_desc:0 "An oversized golden cross brazenly pinned onto his own chest in defiance of the British Empire, passed down through House Amin to project brute prowess, dread, and flamboyant prestige."
