 bookmark_reincarnated_pol_pot_subheading:0 "Count of Koh Ker and Sambhupura"
 bookmark_reincarnated_pol_pot_desc:0 "Saloth Sar—better known as Pol Pot, the notorious leader of the Khmer Rouge who abolished money, emptied the cities, and plunged Cambodia into the Killing Fields—has awakened in 867 AD in the jungle marches of Koh Ker and Sambhupura as a Mandala vassal beneath Devaraja Jayavarman III of Angkor.\n\nFinding himself in a pre-monetary jungle society devoid of modern cities or bespectacled intellectuals, he is overjoyed that his ideal 'Year Zero' agrarian utopia has already arrived! Proclaiming himself 'Brother Number One' of the faceless organization 'Angkar' and embracing the Aspect of Destruction, can he overthrow his Angkorian liege and tear down the Hindu-Buddhist temple-kingdoms of Southeast Asia?"
 dynn_Pol_Pot_867:0 "Pol Pot"
 dynn_Pol_Pot_867_motto:0 "To keep you is no benefit, to destroy you is no loss!"
 nick_brother_number_one:0 "the Architect of the Killing Fields"
