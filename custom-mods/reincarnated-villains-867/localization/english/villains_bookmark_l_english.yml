 bookmark_reincarnated_idi_amin:0 "'Conqueror of the British Empire' Idi Amin"
 bookmark_reincarnated_idi_amin_subheading:0 "Sheikh of Fazughli and Sennar"
 bookmark_reincarnated_idi_amin_desc:0 "Idi Amin Dada—the towering Ugandan military dictator who styled himself 'President for Life', 'Last King of Scotland', and 'Conqueror of the British Empire'—has awakened in 867 AD along the Upper Nile as the Muslim clan warlord of Fazughli and Sennar.\n\nThough neither his medal-festooned field marshal uniform nor the British Empire exists yet in ninth-century Africa, the former heavyweight boxing champion's terrifying physique and patronage-fueled rule of dread make him a natural terror on the medieval battlefield. Feeding his rivals to the crocodiles of the Nile, can 'Big Daddy' conquer East Africa and march north to claim the actual crown of Scotland?"
 dynn_Amin_867:0 "Amin"
 dynn_Amin_867_motto:0 "Lord of All the Beasts of the Earth and Fishes of the Sea!"
 nick_conqueror_of_british_empire:0 "the Conqueror of the British Empire"
 nick_conqueror_of_british_empire_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is a larger-than-life warlord dictator who proclaims [Select_CString( CHARACTER.IsLocalPlayer, 'yourself', CHARACTER.GetHerselfHimself )] 'Lord of All the Beasts of the Earth and Fishes of the Sea', 'Last King of Scotland', and 'Conqueror of the British Empire'."
