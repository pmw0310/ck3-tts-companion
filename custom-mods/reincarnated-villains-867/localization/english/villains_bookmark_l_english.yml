 aminism_desc:0 "An unorthodox Islamic warlord creed claiming direct dream revelations from Allah while exalting the absolute power of His Excellency the President for Life, 'Lord of All the Beasts of the Earth and Fishes of the Sea'. It preaches that chestfuls of medals and overwhelming brute force are divine providence, and that traitors belong in the jaws of Nile crocodiles or upon the sacrificial banquet table."
