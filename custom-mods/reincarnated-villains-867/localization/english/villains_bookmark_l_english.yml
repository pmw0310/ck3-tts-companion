 bookmark_reincarnated_mussolini:0 "Il Duce Benito Mussolini"
 bookmark_reincarnated_mussolini_subheading:0 "Count of Lombardia and Brescia"
 bookmark_reincarnated_mussolini_desc:0 "Cut down by partisans near Lake Como in 1945, Benito Mussolini—'Il Duce'—has awakened over a millennium in the past in 867 AD as the young Italian Count of Milan and Brescia, the twin cradles of his Fascist movement and final republic.\n\nThough the Pope still reigns in Rome to the south and the Carolingian Kingdom of Italy looms around him, his grandiose obsession with restoring the Roman Empire and claiming 'Mare Nostrum' burns brighter than ever. Can he lead his Blackshirts from Milan and complete the March on Rome once more?"
 dynn_Mussolini_867:0 "Mussolini"
 dynn_Mussolini_867_motto:0 "Believe, Obey, Fight!"
 nick_the_duce:0 "the Blackshirt Caesar"
 nick_the_duce_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] styles [Select_CString( CHARACTER.IsLocalPlayer, 'yourself', CHARACTER.GetHerselfHimself )] a new Caesar at the head of the Blackshirts, driving subjects on an endless march toward a reborn Roman Empire."
