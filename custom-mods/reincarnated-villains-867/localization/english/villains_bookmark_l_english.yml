 blackshirts_militia:0 "Blackshirts"
 blackshirts_militia_flavor:0 "#F Black-shirted Fascist paramilitary action squads marching at Il Duce's command, excelling in swift ambushes across hills and farmlands.#!"
 bookmark_reincarnated_stalin:0 "General Secretary Joseph Stalin"
 bookmark_reincarnated_stalin_subheading:0 "Count of Moskva and Vladimir"
 bookmark_reincarnated_stalin_desc:0 "Having breathed his last at his Moscow dacha in 1953, Joseph Stalin—the 'Man of Steel'—has awakened over a millennium in the past in 867 AD at the heart of his former Soviet capital as the young Russian Count of Moskva and Vladimir.\n\nSurrounded by untamed Finno-Ugric and Slavic tribes across the vast eastern forests, he has founded 'Bolshevism'—a radical creed of collective ownership, ruthless purges, and revolutionary warfare. Can the General Secretary forge a Red Empire from Moscow across medieval Eurasia?"
 dynn_Stalin_867:0 "Stalin"
 dynn_Stalin_867_motto:0 "Workers of the World, Unite!"
 nick_the_general_secretary:0 "the Man of Steel"
 nick_the_general_secretary_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] rules the vanguard of revolution with an iron will and ruthless purges as the 'Man of Steel'. Beneath [Select_CString( CHARACTER.IsLocalPlayer, 'your', CHARACTER.GetHerHis )] paranoid surveillance, nobles and peasants alike tremble."
