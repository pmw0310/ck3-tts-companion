 hitler_proclaim_greater_german_reich_decision:0 "Proclaim the Empire of Germania"
 hitler_proclaim_greater_german_reich_decision_desc:0 "From Bavaria, Tyrol, and Austria to the northern marches of Berlin, the German lands stand united under a single banner! Now we shall rebuild our capital into the World Capital Germania and proclaim the eternal Empire of Germania!"
 hitler_proclaim_greater_german_reich_decision_tooltip:0 "Found the 'Empire of Germania', transform your capital into World Capital Germania, and mobilize the elite Waffen-SS divisions."
 hitler_proclaim_greater_german_reich_decision_confirm:0 "Hail the Eternal Empire of Germania!"
 hitler_greater_german_reich_dynasty_modifier:0 "Rulers of the Empire of Germania"
 hitler_greater_german_reich_dynasty_modifier_desc:0 "Having unified the German lands into the Empire of Germania, this dynasty commands overwhelming knight effectiveness, army damage, and imperial dread."
 hitler_germania_world_capital_county_modifier:0 "World Capital Germania"
 hitler_germania_world_capital_county_modifier_desc:0 "Monumental halls and triumphal avenues make the World Capital of the Reich a powerhouse of tax revenue, levies, and development."
 hitler_waffen_ss_panzer_army_name:0 "Waffen-SS Panzergrenadier Divisions"
 stalin_proclaim_ussr_superpower_decision:0 "Establish the USSR & Complete the Five-Year Plan"
 stalin_proclaim_ussr_superpower_decision_desc:0 "From Moscow to Novgorod and Kiev, the vast lands of the Rus are united beneath the Red Banner! With the triumph of our Five-Year Plan, it is time to proclaim the Union of Soviet Socialist Republics!"
 stalin_proclaim_ussr_superpower_decision_tooltip:0 "Found the 'Union of Soviet Socialist Republics' empire and cement your dynasty's superpower rule."
 stalin_proclaim_ussr_superpower_decision_confirm:0 "An unbreakable union of Soviet republics!"
 stalin_ussr_superpower_dynasty_modifier:0 "Generalissimo of the Red Superpower"
 stalin_ussr_superpower_dynasty_modifier_desc:0 "Presiding over the Union of Soviet Socialist Republics, this dynasty commands massive vassal contributions, total counter-intelligence, and terrifying dread."
 stalin_socialist_metropolis_county_modifier:0 "Socialist Metropolis of Moscow"
 stalin_socialist_metropolis_county_modifier_desc:0 "Transformed by the Five-Year Plans into the capital of world revolution, this county boasts rapid construction and surging tax income."
 stalin_red_army_shock_corps_name:0 "1st Guards Red Army Shock Corps"
 mussolini_restore_mare_nostrum_empire_decision:0 "Mare Nostrum & Restore the New Roman Empire"
 mussolini_restore_mare_nostrum_empire_decision_desc:0 "Our legions have marched from Milan through Eternal Rome and Naples, crossing the sea to conquer Carthage itself! The empire of Augustus and Trajan is reborn under the Fascist banner, and the Mediterranean is once again Mare Nostrum!"
 mussolini_restore_mare_nostrum_empire_decision_tooltip:0 "Found the 'New Roman Empire', make Rome your imperial capital, and reclaim dominion over Mare Nostrum."
 mussolini_restore_mare_nostrum_empire_decision_confirm:0 "The Roman Empire is reborn today!"
 mussolini_mare_nostrum_empire_dynasty_modifier:0 "Emperors of Mare Nostrum"
 mussolini_mare_nostrum_empire_dynasty_modifier_desc:0 "Having restored the New Roman Empire across Italy and Carthage, this dynasty commands unyielding legionary toughness, damage, and imperial legitimacy."
 mussolini_eternal_imperial_rome_county_modifier:0 "Eternal Imperial Capital of Rome"
 mussolini_eternal_imperial_rome_county_modifier_desc:0 "Rebuilt as the gleaming heart of the New Roman Empire, Eternal Rome radiates wealth, development, and absolute order."
 mussolini_praetorian_cohort_name:0 "New Roman Praetorian Cohorts"
 mutaguchi_proclaim_greater_east_asia_decision:0 "Proclaim the Greater East Asia Imphal Empire"
 mutaguchi_proclaim_greater_east_asia_decision_desc:0 "From the jungles of Imphal and Assam to the plains of Pagan and Bengal, all have bowed before the 15th Army! Our victory proves beyond doubt that armies need no supply lines when there is grass to eat. Behold the Greater East Asia Imphal Empire!"
 mutaguchi_proclaim_greater_east_asia_decision_tooltip:0 "Found the 'Greater East Asia Imphal Empire' across Assam, Burma, and Bengal."
 mutaguchi_proclaim_greater_east_asia_decision_confirm:0 "Supply comes from the jungle grass! Advance!"
 mutaguchi_greater_east_asia_dynasty_modifier:0 "Jungle Grand Marshal of Greater East Asia"
 mutaguchi_greater_east_asia_dynasty_modifier_desc:0 "Having conquered Assam, Burma, and Bengal through sheer willpower and herbivore logistics, this dynasty enjoys unmatched supply duration, speed, and battle advantage."
 mutaguchi_southern_expeditionary_army_name:0 "Imperial Southern Expeditionary Army"
 trump_proclaim_pax_americana_empire_decision:0 "Pax Americana & Proclaim the American Golden Empire"
 trump_proclaim_pax_americana_empire_decision_desc:0 "From Northumberland and York to Scotland and London, Britannia has become our ultimate real estate portfolio! Now we shall proclaim the American Golden Empire, open Wall Street in our capital, and usher in an era of Pax Americana!"
 trump_proclaim_pax_americana_empire_decision_tooltip:0 "Found the 'American Golden Empire' and establish Wall Street in your capital."
 trump_proclaim_pax_americana_empire_decision_confirm:0 "We're going to win so much, you'll get tired of winning!"
 trump_pax_americana_empire_dynasty_modifier:0 "Pax Americana Superpower"
 trump_pax_americana_empire_dynasty_modifier_desc:0 "Ruling the American Golden Empire through supreme deal-making, this dynasty enjoys expanded domain limits, surging taxes, and cheap construction and mercenaries."
 trump_wall_street_capital_county_modifier:0 "Wall Street Financial Capital"
 trump_wall_street_capital_county_modifier_desc:0 "The financial center of the world beneath the Golden Trump Tower, generating unprecedented tax revenues and rapid development."
 trump_marine_expeditionary_force_name:0 "United States Marine Expeditionary Force"
 kim_proclaim_juche_superpower_empire_decision:0 "Proclaim the People's Republic of Great Joseon"
 kim_proclaim_juche_superpower_empire_decision_desc:0 "From our revolutionary capital of Seogyeong, our Storm Corps have swept across Gaeseong, Gyeongju, and the northern ancestral marches to unify the entire realm! Upholding the eternal teachings of the Fatherly Leaders, we solemnly proclaim the People's Republic of Great Joseon!"
 kim_proclaim_juche_superpower_empire_decision_tooltip:0 "Found the 'People's Republic of Great Joseon' empire and complete the unification of the peninsula and northern marches under the Mount Paektu bloodline."
 kim_proclaim_juche_superpower_empire_decision_confirm:0 "Long live Great Joseon! Long live the Juche Revolution!"
 kim_juche_superpower_empire_dynasty_modifier:0 "Eternal Supreme Leader of Great Joseon"
 kim_juche_superpower_empire_dynasty_modifier_desc:0 "Having unified the Three Kingdoms and northern marches into the People's Republic of Great Joseon, this dynasty commands total devotion, expanded domain limits, dread, and legitimacy."
 kim_revolutionary_pyongyang_county_modifier:0 "Revolutionary Capital Pyongyang"
 kim_revolutionary_pyongyang_county_modifier_desc:0 "The fortified heart of the Socialist Superpower of Korea, boasting mighty defenses, development growth, and tax revenues."
 kim_strategic_rocket_guard_corps_name:0 "Strategic Red Banner Guard Corps"
 kim_paektu_idolization_decision:0 "Proclaim Mount Paektu Bloodline Idolization"
 kim_paektu_idolization_decision_desc:0 "Those born of the sacred bloodline of Mount Paektu are no mere mortals—they are the Shining Stars and Eternal Suns of the Juche revolution! By mobilizing the Propaganda and Agitation Department to erect Towers of Eternal Life across the realm, we shall deify a chosen member of the Mount Paektu family as a living Saint with a golden halo!"
 kim_paektu_idolization_decision_tooltip:0 "Open the Mount Paektu Idolization festival to canonize the chosen bloodline member, with Intrigue or Diplomacy and Learning determining regime rewards."
 kim_paektu_idolization_decision_confirm:0 "Exalt the Shining Star of Mount Paektu forever!"
 kim_paektu_idolization_decision_req_candidate:0 "There is a Mount Paektu dynasty or close family member who does not yet have the [GetTrait('saint').GetName( GetNullCharacter )] trait"
 kim_paektu_idolization_decision_select_tt:0 "You must select a Mount Paektu family member to idolize."
 kim_paektu_idolization_decision_effect_tt:0 "[idolized_target.GetShortUIName|U] gains the [GetTrait('saint').GetName( GetNullCharacter )] trait with a golden halo and is enshrined in the Juche Saints roster"
 axis_mass_agitation_decision:0 "Hold Mass Agitation & Rally Speech"
 axis_mass_agitation_decision_hitler_title:0 "Reich Party Congress & Mass Agitation Speech"
 axis_mass_agitation_decision_mussolini_title:0 "Piazza Balcony Mass Agitation Speech"
 axis_mass_agitation_decision_hitler_desc:0 "Tens of thousands have gathered beneath a sea of banners and torches! With a thunderous speech, we shall ignite fanatic zeal in the hearts of the masses, restore order to our capital, and rally eager SA Stormtrooper volunteers from the streets!"
 axis_mass_agitation_decision_mussolini_desc:0 "A roaring crowd fills the piazza below the palace balcony, chanting for Il Duce! With bold gestures and fiery rhetoric proclaiming the glory of New Rome, we shall electrify the populace, tighten our grip on the capital, and muster Blackshirt volunteers!"
 axis_mass_agitation_decision_tooltip:0 "Convene a mass rally and open an event where your Diplomacy or Intrigue determines the scale of volunteer mobilization and agitation rewards."
 axis_mass_agitation_decision_hitler_confirm:0 "One People, One Reich, One Führer!"
 axis_mass_agitation_decision_mussolini_confirm:0 "Believe, Obey, Fight!"
 axis_mass_agitation_modifier:0 "Fanatic Mass Agitation"
 axis_mass_agitation_modifier_desc:0 "Electrified by the ruler's fiery oratory, the populace flocks to the banners and coreligionists rally in fervent solidarity."
 stalin_great_purge_decision:0 "Launch the Great Purge of Counter-Revolutionaries"
 stalin_great_purge_decision_desc:0 "It is time to uproot the Trotskyite conspirators, saboteurs, and hoarding Kulaks hiding within our party and domain! Through ruthless show trials and property nationalization, we shall fill the state treasury and enforce iron discipline and dread across the realm!"
 stalin_great_purge_decision_tooltip:0 "Convene a midnight purge trial and open an event where your Intrigue or Stewardship determines the outcome of rooting out traitors and seizing wealth."
 stalin_great_purge_decision_confirm:0 "Sign the purge lists! No mercy for enemies of the people!"
 stalin_great_purge_modifier:0 "Terror of the Great Purge"
 stalin_great_purge_modifier_desc:0 "Terrified by midnight arrests and show trials, vassals and conspirators alike cower in submission and pay their dues without complaint."
 trump_monetize_faith_decision:0 "Patriotic Fundraising & Golden Merch Sale"
 trump_monetize_faith_decision_desc:0 "Our tremendous patriots and believers are ready to open their wallets for limited-edition Golden Trump Bibles, gilded sneakers, and Patriot Bonds! Let us convert their fervent devotion into the greatest cash flow in history!"
 trump_monetize_faith_decision_tooltip:0 "Host a Golden Temple fundraising gala where your Stewardship or Diplomacy determines the profits of your relic auction and rally donations."
 trump_monetize_faith_decision_confirm:0 "The best merch, the best fundraising! Order now!"
 trump_super_pac_fundraising_modifier:0 "Super PAC Golden Fundraising"
 trump_super_pac_fundraising_modifier_desc:0 "Grassroots donations and golden merchandise revenues pour into the treasury while improving mercenary contract deals."
 mutaguchi_geisha_banquet_decision:0 "Host Headquarters Geisha Ryotei Banquet"
 mutaguchi_geisha_banquet_decision_desc:0 "While the troops march through the jungle eating grass, a brilliant commander requires 'spiritual refinement' in the rear! Let us summon the finest geishas to our headquarters ryotei for an extravagant night of sake and celebration!"
 mutaguchi_geisha_banquet_decision_tooltip:0 "Host a headquarters geisha banquet where your strategy lecture or hospitality check determines officer morale and stress relief."
 mutaguchi_geisha_banquet_decision_confirm:0 "Leave the front line to the staff—tonight we feast at the ryotei!"
 mutaguchi_geisha_banquet_modifier:0 "Headquarters Ryotei Nights"
 mutaguchi_geisha_banquet_modifier_desc:0 "Enjoying lavish nightly banquets with geishas at rear headquarters, melting away stress and indulging in courtly seduction."
