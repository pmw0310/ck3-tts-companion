 villains_religious_decision.0010.t:0 "Night of Blazing Torches"
 villains_religious_decision.0010.desc:0 "Thousands of blazing torches stain the night sky crimson while the thunderous boots of brown-clad stormtroopers shake the flagstones of the grand square. Below the high podium, a breathless sea of faces waits for my first word.\n\nDepending on how I ignite their fervor tonight, legions of fanatical youths will flock to our banners, or the entire spectacle could collapse into hoarse ridicule."
 villains_religious_decision.0010.a:0 "Roar of destiny and vengeance until my throat bleeds!"
 villains_religious_decision.0010.a.success:0 "Frenzied oratory utterly mesmerizes the multitude"
 villains_religious_decision.0010.a.failure:0 "Cracked voice draws jeers and awkward laughter"
 villains_religious_decision.0010.b:0 "Sweep the opposition quarters with an intimidating torchlight march."
 villains_religious_decision.0010.b.success:0 "Disciplined street terror freezes the capital in obedience"
 villains_religious_decision.0010.b.failure:0 "Unruly street brawls spiral into destructive riots"
 villains_religious_decision.0010.c:0 "Stick to the script and review the stormtrooper columns from the podium."
 villains_religious_decision.0020.t:0 "The New Caesar Upon the Balcony"
 villains_religious_decision.0020.desc:0 "Beneath the marble balcony stretches a boundless tide of black shirts, their rhythmic chants hammering the walls like echoes of an ancient amphitheater. Thrusting my chin high toward the clouds with hands planted firmly on my hips, I survey the crowd.\n\nShall I unleash thunderous oratory to set Italian blood boiling, or dazzle their eyes with a grand pageant worthy of imperial Rome?"
 villains_religious_decision.0020.a:0 "Cross my arms and bellow the rebirth of Imperial Rome!"
 villains_religious_decision.0020.a.success:0 "Fiery rhetoric drives ecstatic citizens into the Blackshirts"
 villains_religious_decision.0020.a.failure:0 "Overblown gestures spark whispers of buffoonery across the piazza"
 villains_religious_decision.0020.b:0 "Stage an imperial triumph complete with eagle standards and arches."
 villains_religious_decision.0020.b.success:0 "Majestic Roman pageantry captivates scholars and commoners alike"
 villains_religious_decision.0020.b.failure:0 "Flimsy wooden props collapse into an expensive embarrassment"
 villains_religious_decision.0020.c:0 "Content myself with an orderly parade of the Blackshirt cohorts."
 villains_religious_decision.0030.t:0 "The Midnight List in Red Ink"
 villains_religious_decision.0030.desc:0 "Deep in the dead of night, thick pipe smoke coils above my desk where arrest warrants bleed with red pencil marks. Beyond the heavy oak doors echo the muffled boots of secret police dragging suspected saboteurs down cold stone stairs.\n\nShall we tear out every last hidden conspirator within the court and army, or strip wealthy landowners and kulaks of every hidden coin?"
 villains_religious_decision.0030.a:0 "Root out every last counter-revolutionary traitor in court and army!"
 villains_religious_decision.0030.a.success:0 "Ruthless purge crushes every plot and paralyzes all opposition"
 villains_religious_decision.0030.a.failure:0 "Paranoid blunders purge loyalists and cripple realm administration"
 villains_religious_decision.0030.b:0 "Confiscate every hidden granary and coffer of the kulaks and nobles."
 villains_religious_decision.0030.b.success:0 "Methodical requisitions fill the treasury and tighten state control"
 villains_religious_decision.0030.b.failure:0 "Peasants burn their own grain and livestock in fierce defiance"
 villains_religious_decision.0030.c:0 "Make an example only of the few saboteurs already in custody."
 villains_religious_decision.0040.t:0 "The Greatest Golden Relic Gala in History"
 villains_religious_decision.0040.desc:0 "Chandeliers blaze across gilded banners as deep-pocketed lords and adoring believers crowd the banquet hall, eager to part with their coin. Upon velvet tables gleam gold-leafed scriptures and limited-edition blessed keepsakes bearing my personal seal.\n\nShall I corner the wealthiest nobles into an exclusive luxury deal, or whip the faithful crowd into a frenzy of grass-roots donations?"
 villains_religious_decision.0040.a:0 "Close a massive, exclusive golden relic deal with the richest lords!"
 villains_religious_decision.0040.a.success:0 "Masterful art of the deal empties noble coffers into your hands"
 villains_religious_decision.0040.a.failure:0 "Cheap gold leaf peels off mid-banquet, sparking a fraud scandal"
 villains_religious_decision.0040.b:0 "Hold a roaring rally to sweep up patriotic donations from the crowd!"
 villains_religious_decision.0040.b.success:0 "Electrified believers hurl sacks of gold onto the stage"
 villains_religious_decision.0040.b.failure:0 "Embarrassing gaffe cools the hall and sends donors walking out"
 villains_religious_decision.0040.c:0 "Sell blessed keepsakes at a safe fixed price to loyal insiders."
 villains_religious_decision.0050.t:0 "Lanterns of the Headquarters Ryotei"
 villains_religious_decision.0050.desc:0 "Silken screens glow softly beneath paper lanterns as plucked strings and the aroma of warm sake fill the headquarters banquet hall. As cups circulate among my staff officers and honored guests, the irrepressible pride of a self-proclaimed military genius swells within my chest!\n\nShall I overturn the table to lecture everyone on how sheer fighting spirit conquers all without supply lines, or focus on charming the guests with fine sake and song?"
 villains_religious_decision.0050.a:0 "Clear the cups! Lecture the staff on invincible spirit over logistics!"
 villains_religious_decision.0050.a.success:0 "Miraculous frenzy-fueled bravado moves the entire officer corps to tears!"
 villains_religious_decision.0050.a.failure:0 "Delusional drunken rambling leaves your staff officers in utter despair"
 villains_religious_decision.0050.b:0 "Win over officers and guests with geisha dances and bold toasts."
 villains_religious_decision.0050.b.success:0 "Splendid hospitality fills the banquet with laughter and loyalty"
 villains_religious_decision.0050.b.failure:0 "Drunken stupor overturns tables and ends in humiliating disgrace"
 villains_religious_decision.0050.c:0 "Keep silent about strategy and quietly savor the sake and music."
 villains_religious_decision.0060.t:0 "Grand Festival of the Eternal Paektu Sun"
 villains_religious_decision.0060.desc:0 "Beneath tens of thousands of crimson banners and towering sun emblems, the grand consecration ceremony begins to exalt [idolized_target.GetTitledFirstName] among the eternal saints of Juche. Great drums shake the earth as the assembled populace gazes upward at the marble rostrum.\n\nShall state security enforce breathless, absolute obedience through terror, or shall sweeping poetic propaganda inspire heartfelt worship across the realm?"
 villains_religious_decision.0060.a:0 "Mobilize state security to enforce flawless, breathless idolization!"
 villains_religious_decision.0060.a.success:0 "Total surveillance and awe bind the entire realm in monolithic unity"
 villains_religious_decision.0060.a.failure:0 "Harsh coercion sparks defaced monuments and covert resentment"
 villains_religious_decision.0060.b:0 "Unveil grand sun monuments and epic hymns to inspire mass devotion!"
 villains_religious_decision.0060.b.success:0 "Magnificent propaganda moves the masses to genuine, thunderous cheers"
 villains_religious_decision.0060.b.failure:0 "Crudely rushed monuments and verses invite quiet mockery"
 villains_religious_decision.0060.c:0 "Conduct a solemn enshrinement ceremony attended only by inner cadres."
 villains_religious_decision.0070.t:0 "Dawn of Year Zero and the Emptied City"
 villains_religious_decision.0070.desc:0 "Guerrillas clad in crimson scarves beat drums through every street, ordering all townsfolk to abandon the corrupt city at once. Currency, markets, and old class distinctions end today; only the pure agrarian communes of Angkar shall remain.\n\nShall our secret surveillance network drive every last soul into jungle labor camps, or shall I personally design a grand canal grid to quadruple the rice harvest?"
 villains_religious_decision.0070.a:0 "Enforce a total jungle march under Angkar secret surveillance!"
 villains_religious_decision.0070.a.success:0 "Relentless oversight channels the entire populace into commune labor"
 villains_religious_decision.0070.a.failure:0 "Mass desertions and riots shatter the evacuation columns and rations"
 villains_religious_decision.0070.b:0 "Personally draft a nationwide grid of canals to quadruple rice yields!"
 villains_religious_decision.0070.b.success:0 "Miraculous irrigation turns jungle wasteland into a bumper granary!"
 villains_religious_decision.0070.b.failure:0 "Ignorant canal engineering triggers catastrophic floods and famine"
 villains_religious_decision.0070.c:0 "Induct outer-district residents into rural labor teams step by step."
 villains_religious_decision.0080.t:0 "Interrogation Beneath the Single Lamp"
 villains_religious_decision.0080.desc:0 "Upon a wooden chair in the damp stone interrogation chamber sits [arrested_intellectual.GetTitledFirstName], pale and trembling beneath a lone oil lamp. Across the table rest blank confession scrolls and fresh dark ink.\n\nShall I weave a relentless trap of questions to extract a spy confession and hidden gold, or drag this arrogant scholar before a public struggle session to crush their arguments?"
 villains_religious_decision.0080.a:0 "Wring out a full spy confession and every hidden coin through guile!"
 villains_religious_decision.0080.a.success:0 "[arrested_intellectual.GetShortUIName] breaks down, confessing all and surrendering hidden gold"
 villains_religious_decision.0080.a.failure:0 "[arrested_intellectual.GetShortUIName] exploits a lapse in security and slips out of reach!"
 villains_religious_decision.0080.b:0 "Refute their bourgeois learning in a public ideological struggle session!"
 villains_religious_decision.0080.b.success:0 "Crushing ideological rebuttal forces tearful self-criticism and conversion"
 villains_religious_decision.0080.b.failure:0 "Sharp counterarguments leave you tongue-tied and humiliated before the court"
 villains_religious_decision.0080.c:0 "Skip the questioning and throw them straight into dungeon chains."
 villains_religious_decision.0090.t:0 "Trumpets of the Economic War"
 villains_religious_decision.0090.desc:0 "Armed warriors of the Simba Battalion ring the bustling merchant quarter where silk, spices, and gold change hands. Terrified traders clutch their ledgers awaiting my decree, while my officers behind me eye the keys to the richest storehouses with hungry grins.\n\nShall I unleash the troops to seize the warehouses and reward my loyal commanders, or take personal charge of a grand state trade guild myself?"
 villains_religious_decision.0090.a:0 "Send in the Simba Battalion to seize the shops and reward loyal officers!"
 villains_religious_decision.0090.a.success:0 "Swift military seizure secures overflowing coffers and fierce army loyalty"
 villains_religious_decision.0090.a.failure:0 "Unchecked looting and fires reduce the rich market quarter to ashes"
 villains_religious_decision.0090.b:0 "Reorganize every seized shop into a state guild under my personal management!"
 villains_religious_decision.0090.b.success:0 "Unexpected commercial brilliance sends trade profits soaring!"
 villains_religious_decision.0090.b.failure:0 "Baffling ledgers and botched orders paralyze trade across the realm"
 villains_religious_decision.0090.c:0 "Spare their shops in exchange for a hefty special protection tribute."
 villains_religious_decision.0100.t:0 "Bloody Banquet at the Crocodile Pool"
 villains_religious_decision.0100.desc:0 "Below the torchlit riverside pavilion, massive Nile crocodiles snap their jaws in the murky shallows, yellow eyes gleaming in the dark. Dragged to the water edge, [crocodile_victim.GetTitledFirstName] begs pitifully for mercy while my assembled vassals swallow hard.\n\nShall I unbind the prisoner to knock them into the jaws with my own bare fists like a heavyweight champion, or have the secret police stage a chilling execution?"
 villains_religious_decision.0100.a:0 "Cut the ropes! I will knock them into the crocodile jaws with my own fists!"
 villains_religious_decision.0100.a.success:0 "A thunderous bare-knuckle blow sends the victim flying into the jaws!"
 villains_religious_decision.0100.a.failure:0 "Desperate resistance leaves you wounded before guards finish the deed"
 villains_religious_decision.0100.b:0 "Have secret police agents stage a chilling drowning before the vassals."
 villains_religious_decision.0100.b.success:0 "Merciless spectacle freezes every scheming vassal in silent terror"
 villains_religious_decision.0100.b.failure:0 "Grotesque excess sickens the attending nobles and stirs revulsion"
 villains_religious_decision.0100.c:0 "Safely shove the bound prisoner through the iron grate into the water."
 villains_religious_decision.0110.t:0 "Flickering Candles in the Noble Bedchamber"
 villains_religious_decision.0110.desc:0 "Thick incense smoke and trembling candlelight veil the bedchamber as anxious noble eyes lock onto my dark, unblinking gaze. Tracing a slow sign over the sickbed, I murmur a resonant prayer that fills the hushed room.\n\nShall I bind the patron ruler soul with hypnotic suggestion to seize an unbreakable hold over their house, or apply genuine Siberian herbal lore to work a wondrous recovery?"
 villains_religious_decision.0110.a:0 "Look deep into my eyes… bind the patron soul and secrets through hypnosis!"
 villains_religious_decision.0110.a.success:0 "Spellbound patron surrenders deep secrets, gold, and unwavering obedience"
 villains_religious_decision.0110.a.failure:0 "Hypnotic trickery is exposed, getting you driven out as a wicked charlatan!"
 villains_religious_decision.0110.b:0 "Cleanse the illness with Siberian herbal remedies and fervent prayer."
 villains_religious_decision.0110.b.success:0 "Miraculous recovery leaves the household worshiping you as a living saint"
 villains_religious_decision.0110.b.failure:0 "Botched herbal brew worsens the stomach cramps and tarnishes your aura"
 villains_religious_decision.0110.c:0 "Offer a comforting blessing and laying on of hands for generous alms."
 villains_religious_decision.0120.t:0 "The Underground Circle of Sacred Ecstasy"
 villains_religious_decision.0120.desc:0 "Deep within a hidden cellar beneath the chapel, noble lovers and devoted followers clad in white linen form a breathless circle around me. Tonight we shatter the hollow rules of hypocritical priests and birth a new mystic covenant where flesh and spirit merge in divine ecstasy!\n\nShall I lead a whirling rite of mystic revelation to ignite fanatical zeal, or host an intoxicating communion to captivate high society and its gold?"
 villains_religious_decision.0120.a:0 "Whirl until dawn in ecstatic flagellation and mystic revelation!"
 villains_religious_decision.0120.a.success:0 "Transcendent whirling rite crowns you the undisputed living savior!"
 villains_religious_decision.0120.a.failure:0 "Wild shrieks leak past the cellar doors, fueling dark scandal across the realm"
 villains_religious_decision.0120.b:0 "Captivate noble devotees body and purse with sweet wine and sacred communion!"
 villains_religious_decision.0120.b.success:0 "Enchanted aristocrats lavish gold and prestige upon your newborn sect"
 villains_religious_decision.0120.b.failure:0 "Jealous quarrels among noble lovers mar the sacred founding night"
 villains_religious_decision.0120.c:0 "Exchange a hushed covenant of blood away from prying ears."
 axis_mass_agitation_triumph_modifier:0 "Triumphant Mass Agitation"
 axis_mass_agitation_triumph_modifier_desc:0 "Mesmerized by a spellbinding rally speech, the populace rallies beneath the ruler banner with fanatical zeal."
 axis_mass_agitation_fiasco_modifier:0 "Humiliating Rally Fiasco"
 axis_mass_agitation_fiasco_modifier_desc:0 "A cracked voice and clumsy staging turned the grand rally into a laughingstock, dampening follower morale."
 axis_street_riot_county_modifier:0 "Bloody Street Riot Aftermath"
 axis_street_riot_county_modifier_desc:0 "An unruly armed march degenerated into street brawls and arson, leaving townsfolk bitter and commerce disrupted."
 stalin_great_purge_triumph_modifier:0 "Ironclad Great Purge"
 stalin_great_purge_triumph_modifier_desc:0 "Surgical midnight arrests excised every potential traitor, leaving the entire court in breathless obedience."
 stalin_purge_paranoia_backlash_modifier:0 "Paranoid Purge Backlash"
 stalin_purge_paranoia_backlash_modifier_desc:0 "Indiscriminate arrests swept away loyal stewards and capable officers, paralyzing realm administration."
 trump_art_of_the_deal_boom_modifier:0 "Golden Relic Deal Boom"
 trump_art_of_the_deal_boom_modifier_desc:0 "Exclusive luxury relic contracts with wealthy nobles keep rivers of gold flowing steadily into the treasury."
 trump_fraud_scandal_modifier:0 "Gilded Relic Fraud Scandal"
 trump_fraud_scandal_modifier_desc:0 "Peeling gold leaf on costly keepsakes sparked an embarrassing fraud uproar among donors and vassals."
 mutaguchi_banzai_delusion_inspired_modifier:0 "Contagious Spirit-Over-Matter Mania"
 mutaguchi_banzai_delusion_inspired_modifier_desc:0 "Infected by their commander miraculous bluster, the officer corps charges ahead convinced sheer willpower conquers all."
 mutaguchi_drunken_blunder_modifier:0 "Drunken Strategy Lecture Blunder"
 mutaguchi_drunken_blunder_modifier_desc:0 "Absurd drunken boasting at the banquet left staff officers and soldiers alike questioning their commander sanity."
 mutaguchi_hangover_disgrace_modifier:0 "Disgraceful Banquet Hangover"
 mutaguchi_hangover_disgrace_modifier_desc:0 "Collapsing into overturned sake tables left a lingering headache and plenty of courtly gossip."
 kim_paektu_idolization_supreme_modifier:0 "Zenith of Monolithic Idolization"
 kim_paektu_idolization_supreme_modifier_desc:0 "A flawless bloodline consecration elevated reverence for the Supreme Leader to an unassailable height."
 kim_idolization_backlash_modifier:0 "Forced Idolization Backlash"
 kim_idolization_backlash_modifier_desc:0 "Heavy-handed mobilization and clumsy propaganda bred quiet resentment behind forced smiles."
 pol_pot_year_zero_miracle_harvest_modifier:0 "Year Zero Miracle Harvest"
 pol_pot_year_zero_miracle_harvest_modifier_desc:0 "Newly dug irrigation grids and commune labor unexpectedly aligned to produce overflowing granaries."
 pol_pot_commune_famine_modifier:0 "Year Zero Commune Famine"
 pol_pot_commune_famine_modifier_desc:0 "Reckless forced marches and disastrous canal plans ruined the paddies and plunged the communes into famine."
 idi_amin_economic_boom_modifier:0 "State Trade Guild Boom"
 idi_amin_economic_boom_modifier_desc:0 "Seized merchant networks thrived against all expectations, enriching both the treasury and the officer corps."
 idi_amin_economic_collapse_modifier:0 "Economic War Market Collapse"
 idi_amin_economic_collapse_modifier_desc:0 "Driving out skilled traders in favor of innumerate soldiers left storehouses empty and markets paralyzed."
 rasputin_charlatan_exposed_modifier:0 "Exposed Charlatan Mystic"
 rasputin_charlatan_exposed_modifier_desc:0 "Caught attempting hypnotic manipulation in a noble bedchamber, whispers of fraud now shadow your prayers."
 rasputin_khlyst_ecstasy_fervor_modifier:0 "Khlyst Ecstatic Fervor"
 rasputin_khlyst_ecstasy_fervor_modifier_desc:0 "Swept up in the transcendent ecstasy of the founding night, noble devotees shower you with ardent devotion."
 rasputin_khlyst_scandal_rumors_modifier:0 "Underground Sect Scandal"
 rasputin_khlyst_scandal_rumors_modifier_desc:0 "Lurid rumors of midnight cellar rites leaked abroad, drawing sharp condemnation from conventional believers."
