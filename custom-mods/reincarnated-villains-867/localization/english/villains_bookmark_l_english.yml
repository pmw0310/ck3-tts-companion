 bolshevik_hostility_doctrine_name:0 "Proletarian Internationalism"
 bolshevik_hostility_doctrine_desc:0 "Fellow revolutionary socialist faiths are embraced as righteous comrades, whereas fascist ideologies and old-world state religions are condemned as mortal class enemies."
 axis_hostility_doctrine_name:0 "Axis Ideological Pact"
 axis_hostility_doctrine_desc:0 "Totalitarian faiths bound to the Axis pact recognize one another as righteous allies while waging merciless war against Bolsheviks and rival creeds."
 kim_proclaim_juche_superpower_decision_desc:0 "From our revolutionary capital of Seogyeong, our Storm Corps have swept across Gaeseong, Gyeongju, and the northern ancestral marches to unify the entire realm! Upholding the eternal teachings of the Fatherly Leaders, we solemnly proclaim the People's Republic of Great Joseon!"
