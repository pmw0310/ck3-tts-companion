 artifact_relic_golden_fasces_name:0 "Golden Fasces of the New Roman Consul"
 artifact_relic_golden_fasces_desc:0 "A ceremonial golden bundle of rods and an axe symbolizing the supreme authority of Rome and the unbreakable unity of the totalitarian state."
 artifact_relic_san_sepolcro_manifesto_name:0 "San Sepolcro Founding Manifesto"
 artifact_relic_san_sepolcro_manifesto_desc:0 "The original founding manifesto proclaimed at Piazza San Sepolcro in Milan, revered as the foundational scripture of the Blackshirts."
 artifact_relic_blackshirt_standard_name:0 "Blackshirt Standard of the March on Rome"
 artifact_relic_blackshirt_standard_desc:0 "The black eagle standard of the first Blackshirt legions from Emilia-Romagna that spearheaded the March on Rome."
 artifact_relic_march_on_rome_dagger_name:0 "Consular Dagger of the Naples Congress"
 artifact_relic_march_on_rome_dagger_desc:0 "A ceremonial golden dagger presented by Il Duce at the Naples Fascist Congress on the eve of the March on Rome."
 artifact_relic_mare_nostrum_aquila_name:0 "Bronze Aquila of Mare Nostrum"
 artifact_relic_mare_nostrum_aquila_desc:0 "A bronze Roman legionary eagle cast to commemorate the subjugation of Carthage and the reclamation of the Mediterranean as Our Sea."
 artifact_relic_blutfahne_name:0 "The Blutfahne"
 artifact_relic_blutfahne_desc:0 "The blood-stained banner from the Munich uprising, venerated as the highest sacred standard used to consecrate every new party banner."
 artifact_relic_bronze_reichsadler_name:0 "Bronze Reichsadler of the Chancellery"
 artifact_relic_bronze_reichsadler_desc:0 "A massive bronze imperial eagle cast to watch over Berlin, embodying absolute obedience and the relentless will to conquer."
 artifact_relic_reichsparteitag_chalice_name:0 "Chalice of the Nuremberg Rally"
 artifact_relic_reichsparteitag_chalice_desc:0 "A ceremonial chalice used during the grand nocturnal rallies in Nuremberg where hundreds of thousands swore eternal fealty."
 artifact_relic_mein_kampf_manuscript_name:0 "Original Manuscript of Mein Kampf"
 artifact_relic_mein_kampf_manuscript_desc:0 "The signed original manuscript of the supreme National Socialist scripture, born from the Führer's awakening in Vienna and Munich."
 artifact_relic_wewelsburg_ring_name:0 "Black Sun Chalice of Wewelsburg"
 artifact_relic_wewelsburg_ring_desc:0 "An esoteric ritual chalice consecrated in the crypt of Wewelsburg Castle near Paderborn and the Teutoburg Forest."
 artifact_relic_kremlin_red_star_name:0 "Red Star and State Seal of the Kremlin"
 artifact_relic_kremlin_red_star_desc:0 "A ruby star from the spires of the Moscow Kremlin paired with the hammer-and-sickle seal of proletarian sovereignty."
 artifact_relic_aurora_shell_name:0 "Shell Casing of the Cruiser Aurora"
 artifact_relic_aurora_shell_desc:0 "The historic blank shell casing fired from the cruiser Aurora on the Neva River that signaled the storming of the Winter Palace and the dawn of the October Revolution."
 artifact_relic_konarmiya_banner_name:0 "Red Banner of the First Cavalry Army"
 artifact_relic_konarmiya_banner_desc:0 "A battle-scarred red standard carried across the Ukrainian steppes by the Red Cavalry as they crushed the counter-revolutionary White armies."
 artifact_relic_tsaritsyn_order_name:0 "Defense Order of the Man of Steel"
 artifact_relic_tsaritsyn_order_desc:0 "The sacred revolutionary decoration forged to honor the unyielding defense of the Red citadel on the lower Volga."
 artifact_relic_communist_manifesto_name:0 "First Edition of the Communist Manifesto"
 artifact_relic_communist_manifesto_desc:0 "An original manuscript penned by Karl Marx of Trier, calling upon the workers of the world to unite and cast off their chains."
 artifact_trump_art_of_the_deal_regalia_name:0 "First Edition Art of the Deal & Presidential Seal"
 artifact_trump_art_of_the_deal_regalia_desc:0 "A gold-embossed first edition of The Art of the Deal paired with the Presidential Seal, handed down to the head of House Trump to sharpen tax negotiations and elevate dynastic prestige."
 artifact_mutaguchi_imphal_gunto_name:0 "15th Army Commander's Imphal Gunto"
 artifact_mutaguchi_imphal_gunto_desc:0 "The command saber drawn by Renya Mutaguchi to order the march on Imphal. Imbued with fanatical herbivore logistics, only Renya Mutaguchi himself can wield its reckless power, and no descendant after his death can ever equip it."
 artifact_kim_paektu_marshal_star_name:0 "Mount Paektu Marshal's Star & Supreme Seal"
 artifact_kim_paektu_marshal_star_desc:0 "The golden Marshal's Star and Supreme Commander's Seal symbolizing the Mount Paektu bloodline, inherited within House Kim to sustain dread and vigilance against internal plots."
 hitler_proclaim_thousand_year_reich_decision:0 "Found the Kingdom of Germany"
 hitler_proclaim_thousand_year_reich_decision_desc:0 "What began in our Alpine stronghold of Innsbruck has now conquered all of Bavaria! The time has come to cast off the Carolingian yoke and proclaim the founding of the Kingdom of Germany under the eternal leadership of House Hitler!"
 hitler_proclaim_thousand_year_reich_decision_tooltip:0 "Found the custom 'Kingdom of Germany' and establish an eternal Führer state for the Hitler dynasty."
 hitler_proclaim_thousand_year_reich_decision_confirm:0 "One People, One Kingdom, One Führer!"
 hitler_thousand_year_reich_dynasty_modifier:0 "Bloodline of the Führer"
 hitler_thousand_year_reich_dynasty_modifier_desc:0 "This dynasty founded the Kingdom of Germany across Bavaria and the Alps, granting all members formidable military authority and dread."
 hitler_ss_guard_army_name:0 "Führer Escort Guard"
 stalin_establish_supreme_soviet_decision:0 "Found the Soviet Kingdom & Great Purge"
 stalin_establish_supreme_soviet_decision_desc:0 "With the forests of Moscow and Vladimir firmly under our control, it is time to unleash a Great Purge against reactionary nobles and proclaim the world's first red monarchy—the Soviet Kingdom!"
 stalin_establish_supreme_soviet_decision_tooltip:0 "Found the 'Soviet Kingdom' and establish permanent iron-fisted rule for the Stalin dynasty."
 stalin_establish_supreme_soviet_decision_confirm:0 "Long live the Soviet Kingdom! No mercy for reactionaries!"
 stalin_iron_curtain_dynasty_modifier:0 "Dynasty of the Man of Steel"
 stalin_iron_curtain_dynasty_modifier_desc:0 "Through ruthless purges and total centralization, this dynasty crushes hostile schemes and extracts absolute obedience from its vassals."
 stalin_nkvd_divisions_name:0 "NKVD Internal Guard Divisions"
 mussolini_march_on_rome_decision:0 "March on Rome & Found the Kingdom of New Rome"
 mussolini_march_on_rome_decision_desc:0 "The Blackshirts' flame ignited in Milan now shakes all of northern Italy! Like Caesar crossing the Rubicon, we shall proclaim the Kingdom of New Rome and make the Mediterranean 'Our Sea' once more!"
 mussolini_march_on_rome_decision_tooltip:0 "Found the 'Kingdom of New Rome' and proclaim the Mussolini dynasty's New Roman Order."
 mussolini_march_on_rome_decision_confirm:0 "All roads lead to Rome once more!"
 mussolini_new_roman_order_dynasty_modifier:0 "Duce of the New Roman Order"
 mussolini_new_roman_order_dynasty_modifier_desc:0 "Having founded the New Roman Kingdom, this dynasty claims the mantle of Eternal Rome, bestowing immense prestige and legitimacy upon its members."
 mussolini_roman_legions_name:0 "Duce's Blackshirt Legions"
 mutaguchi_execute_operation_ugo_decision:0 "Found the Imperial Kingdom of Imphal"
 mutaguchi_execute_operation_ugo_decision_desc:0 "The weak-willed staff officers whining about supply lines were wrong! By conquering the jungles of Imphal and Kamarupa, we have proven in combat that humans are naturally herbivores and founded the Imperial Kingdom of Imphal!"
 mutaguchi_execute_operation_ugo_decision_tooltip:0 "Found the 'Imperial Kingdom of Imphal' and permanently establish the Mutaguchi dynasty's Herbivore Logistics doctrine."
 mutaguchi_execute_operation_ugo_decision_confirm:0 "Graze on the jungle grass and advance into India!"
 mutaguchi_herbivore_logistics_dynasty_modifier:0 "Imphal Herbivore Logistics Doctrine"
 mutaguchi_herbivore_logistics_dynasty_modifier_desc:0 "Convinced that soldiers can survive by eating grass anywhere, this dynasty's armies enjoy vastly extended supply duration, faster movement, and reduced maintenance."
 mutaguchi_imphal_vanguard_name:0 "Imphal Breakthrough Banzai Vanguard"
 trump_build_great_wall_and_tower_decision:0 "Found the United States & Build Trump Tower"
 trump_build_great_wall_and_tower_decision_desc:0 "With all of Northumberland in our hands, it is time to rebuild Hadrian's Wall into the biggest, most beautiful Border Wall in history, erect a Golden Trump Tower, and proclaim the United States of America a thousand years early!"
 trump_build_great_wall_and_tower_decision_tooltip:0 "Found the kingdom of the 'United States of America' and erect the Golden Trump Tower in your capital."
 trump_build_great_wall_and_tower_decision_confirm:0 "It's going to be the greatest country in history!"
 trump_golden_empire_dynasty_modifier:0 "The Art of the Deal & Golden Empire"
 trump_golden_empire_dynasty_modifier_desc:0 "Turning statecraft into prime real estate deals, this dynasty enjoys surging domain taxes and drastically reduced construction costs and build times."
 trump_golden_tower_county_modifier:0 "Golden Trump Tower & Great Border Wall"
 trump_golden_tower_county_modifier_desc:0 "Protected by an impenetrable border wall and dominated by a gleaming golden tower, this county boasts massive tariff revenues and fortifications."
 kim_proclaim_paektu_monolithic_system_decision:0 "Found the People's Kingdom of Korea"
 kim_proclaim_paektu_monolithic_system_decision_desc:0 "Having unified Seogyeong, Bukgye, and marched south to secure all of Gaeseong, it is time to proclaim the founding of the People's Kingdom of Korea under the eternal Mount Paektu Bloodline!"
 kim_proclaim_paektu_monolithic_system_decision_tooltip:0 "Found the 'People's Kingdom of Korea' and establish the eternal Mount Paektu Monolithic Leadership System."
 kim_proclaim_paektu_monolithic_system_decision_confirm:0 "Carry the Mount Paektu revolution through the generations!"
 kim_paektu_monolithic_system_dynasty_modifier:0 "Mount Paektu Monolithic System"
 kim_paektu_monolithic_system_dynasty_modifier_desc:0 "Enforcing absolute devotion to the sacred bloodline of Mount Paektu, this dynasty commands immense dread, legitimacy, and an expanded domain limit."
