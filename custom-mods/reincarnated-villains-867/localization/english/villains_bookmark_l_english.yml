 # === Second Religious & Ideological Decisions (Trump, Hitler, Mussolini, Mutaguchi, Stalin) ===
 trump_youre_fired_tribunal_decision:0 "Public Performance Tribunal and Dismissal Decree"
 trump_youre_fired_tribunal_decision_desc:0 "In Americanism, bankruptcy and incompetence are unforgivable sins, and only masters of the deal deserve golden grace. Summon a vassal, councillor, or courtier before your gilded council table to audit their performance in front of the entire court. Slam punitive tariff decrees onto the table to extract tribute, or point your finger across the oak board and thunder their dismissal to prove who the true winner is."
 trump_youre_fired_tribunal_decision_tooltip:0 "Summon the selected subject to your council table, opening an event to test Stewardship tariff pressure or an opposed Diplomacy dismissal showdown."
 trump_youre_fired_tribunal_decision_confirm:0 "Summon Them to the Boardroom!"
 trump_youre_fired_tribunal_decision_no_item_selected:0 "No Tribunal Subject Selected"
 trump_youre_fired_tribunal_decision_req_candidate:0 "Must have at least one adult, unimprisoned councillor, vassal, or courtier"
 trump_youre_fired_tribunal_decision_select_tt:0 "The selected character must be alive and unimprisoned"
 trump_youre_fired_tribunal_event_preview_tt:0 "Confront the chosen subject at the council table through a #V Stewardship#! tariff shakeup, an opposed #V Diplomacy#! dismissal duel, or a safe loyalty pledge"
 villains_religious_decision.0130.t:0 "The Golden Council Table: Art of the Tariff and Dismissal"
 villains_religious_decision.0130.desc:0 "Heavy silence falls across the vaulted stone hall beneath banners of blue and gold. Across the polished oak council table strewn with tax parchments and coins, [fired_target.GetTitledFirstName] stands sweating profusely while the assembled nobles hold their breath.\n\n\"Let us be honest here. These ledger numbers are a total disaster. Frankly, the worst deal in the history of our realm, everybody says so.\" Leaning forward with one palm planted firmly on the table, I fix my gaze upon the trembling subject. Shall I slam down a punitive tariff decree to drain their coffers and secure a binding favor, or point straight across the board and thunder their public dismissal before the entire court?"
 villains_religious_decision.0130.a:0 "Slam down a punitive tariff decree to extract gold and a binding favor!"
 villains_religious_decision.0130.a.success:0 "Masterful Tariff Deal Secures Gold and Favor"
 villains_religious_decision.0130.a.failure:0 "Ledger Loophole Exposes a Botched Deal"
 villains_religious_decision.0130.b:0 "Point straight across the table before the whole court: \"You are fired!\""
 villains_religious_decision.0130.b.success:0 "Thunderous Dismissal Awes the Entire Court"
 villains_religious_decision.0130.b.failure:0 "Defiant Subject Talks Back Before the Court"
 villains_religious_decision.0130.c:0 "Have them sign a gold-sealed loyalty pledge and grant one last chance."
 hitler_grand_architecture_and_art_purge_decision:0 "Degenerate Art Purge and Grand Architectural Model Unveiling"
 hitler_grand_architecture_and_art_purge_decision_desc:0 "The spirit of our Volksgemeinschaft is forged not through weak, decadent art, but in monumental stone architecture built to outlast a thousand years! Confiscate degenerate paintings and illuminated manuscripts from noble estates across the realm, and unveil the white limestone scale model of our future world capital sketched by my own hand."
 hitler_grand_architecture_and_art_purge_decision_tooltip:0 "Unveil your grand architectural model and open an event testing Diplomacy for monumental prestige or Intrigue for covertly auctioning confiscated art abroad."
 hitler_grand_architecture_and_art_purge_decision_confirm:0 "Unveil the Thousand-Year Model!"
 hitler_grand_architecture_event_preview_tt:0 "Choose between a #V Diplomacy#! grand architectural unveiling, an #V Intrigue#! foreign auction of confiscated art, or a safe scroll bonfire ceremony"
 villains_religious_decision.0140.t:0 "Vision of the White Dome and Crates of Confiscated Art"
 villains_religious_decision.0140.desc:0 "At the center of the torchlit stone gallery stands a massive white limestone scale model of a colossal domed temple and triumphal colonnade, carved from sketches drawn through sleepless nights. Across the hall, chainmail-clad guards pack confiscated triptych icons and gilded manuscripts from noble manors into rough wooden crates.\n\nHolding my rolled charcoal blueprints before the hushed nobles, I survey my masterpiece. Shall I entrance the court with a fiery lecture on monumental proportions that dwarfs ancient Rome itself, or quietly auction those crates of decadent artworks to wealthy foreign merchants for a tidy fortune?"
 villains_religious_decision.0140.a:0 "Deliver a spellbinding lecture on the perfection of my white domed temple model!"
 villains_religious_decision.0140.a.success:0 "Vassals and Masons Awed by the Thousand-Year Blueprint"
 villains_religious_decision.0140.a.failure:0 "Masons Question Dome Weight, Sparking an Artistic Fury"
 villains_religious_decision.0140.b:0 "Secretly auction the confiscated decadent artworks to foreign merchants."
 villains_religious_decision.0140.b.success:0 "Covert Border Auction Yields Gold and Ideological Control"
 villains_religious_decision.0140.b.failure:0 "Embezzled Paintings and Hypocritical Sale Rumors Leak Out"
 villains_religious_decision.0140.c:0 "Hold a public scroll bonfire and commission heroic palace frescoes."
 mussolini_battle_for_grain_and_marshes_decision:0 "Battle for Grain and Punctual Courier Propaganda"
 mussolini_battle_for_grain_and_marshes_decision_desc:0 "The New Roman proves his worth not in idle parlor chatter, but through sweat, golden wheat, and iron discipline! Stride into the sun-drenched harvest fields bare-chested to swing the reaping sickle before cheering peasants, drain the pestilent marshes, and enforce stone-paved courier schedules so every carriage in the realm arrives strictly on time."
 mussolini_battle_for_grain_and_marshes_decision_tooltip:0 "Take to the golden harvest fields for an event testing Prowess and Diplomacy in a shirtless reaping spectacle or Stewardship and Learning in road and marsh works."
 mussolini_battle_for_grain_and_marshes_decision_confirm:0 "Hoist the Sickle and Wheat Sheaf!"
 mussolini_battle_for_grain_event_preview_tt:0 "Choose between a #V Prowess and Diplomacy#! shirtless harvest stunt, a #V Stewardship and Learning#! marsh drainage and punctual road drive, or a safe harvest parade"
 villains_religious_decision.0150.t:0 "Iron Muscle in the Wheat Field and Carriages Running on Time"
 villains_religious_decision.0150.desc:0 "Blazing Italian sunlight bathes the golden wheat fields and the weathered arches of an ancient Roman stone aqueduct in the distance. Straw-hatted peasant farmers crowd around in eager anticipation while a court chronicler readies quill and parchment on a wooden stool to immortalize my heroic posture.\n\nCasting aside my tunic and jutting my chin toward the clouds, I grip a curved iron reaping sickle. Shall I charge into the sun-scorched grain bare-chested to prove the tireless vigor of the New Roman Man, or crack the whip over marsh drainage and stone courier stations until every wagon runs strictly on schedule?"
 villains_religious_decision.0150.a:0 "Reap the wheat bare-chested under the blazing sun and hoist the golden sheaf!"
 villains_religious_decision.0150.a.success:0 "Heroic Bare-Chested Harvest Sends Peasants into Rapture"
 villains_religious_decision.0150.a.failure:0 "Overzealous Reaping Ends in Sunstroke and Back Spasms"
 villains_religious_decision.0150.b:0 "Drain the marshes and enforce stone-road schedules so every carriage runs on time!"
 villains_religious_decision.0150.b.success:0 "Reclaimed Marshes and Punctual Couriers Boost Prosperity"
 villains_religious_decision.0150.b.failure:0 "Hasty Embankments Collapse and Bog Down the Couriers"
 villains_religious_decision.0150.c:0 "Don a wheat-ear wreath and have the scribes sketch a heroic harvest portrait."
 mutaguchi_jingisukan_herbivore_logistics_decision:0 "Jingisukan Ox-Convoy Decree and Herbivore March Inspection"
 mutaguchi_jingisukan_herbivore_logistics_decision_desc:0 "Complaining that troops cannot advance without supply lines is sheer cowardice born of weak spirit! Pack hundreds of oxen and water buffaloes with rations so they carry the baggage and serve as meat afterward, and if the beasts vanish, look around: our ancestors were herbivores by nature, so the lush green jungle grass all around us is abundant food! March to the monsoon riverbank to inspect the crossing and discipline spineless subordinate officers."
 mutaguchi_jingisukan_herbivore_logistics_decision_tooltip:0 "Inspect the monsoon river crossing in an event offering a high-risk Stewardship and Martial water-buffalo gamble or a Prowess and Diplomacy grass-eating lecture."
 mutaguchi_jingisukan_herbivore_logistics_decision_confirm:0 "Even Grass Is Rations, Advance!"
 mutaguchi_jingisukan_herbivore_event_preview_tt:0 "Choose between a reckless #V Stewardship and Martial#! water-buffalo river crossing, a #V Prowess and Diplomacy#! wild-grass lecture and officer scapegoating, or safe shrine prayers"
 villains_religious_decision.0160.t:0 "Water Buffaloes in the Monsoon Rapids and a Fistful of Jungle Weeds"
 villains_religious_decision.0160.desc:0 "Under sheets of torrential monsoon rain, bamboo-laden water buffaloes bellow and thrash wildly in the churning brown river rapids. When a rain-soaked subordinate officer approaches pale-faced to plead that rations are lost and the column must halt, righteous fury boils in my chest.\n\nRaising my wooden war fan in one hand, I rip a dripping fistful of wild green weeds from the mud and thrust it straight before the officer’s nose! \"Surrounded by endless green foliage, how dare you whine about lacking food!\" Shall I whip the panicked water-buffalo convoy straight across the raging current to prove my genius, or gulp down wild weed broth myself while pinning every blunder squarely on this spineless subordinate?"
 villains_religious_decision.0160.a:0 "Wave the war fan and drive the entire water-buffalo convoy across the raging rapids!"
 villains_religious_decision.0160.a.success:0 "Miraculous Crossing Turns the Water-Buffalo Convoy into Legend!"
 villains_religious_decision.0160.a.failure:0 "Panicked Water Buffaloes Wash Downstream with All the Rations!"
 villains_religious_decision.0160.b:0 "Swallow wild weed soup myself and fiercely reprimand the spineless officer!"
 villains_religious_decision.0160.b.success:0 "Herbivore Spirit and Scapegoating Restore Command Discipline"
 villains_religious_decision.0160.b.failure:0 "Poisonous Jungle Weeds Trigger Violent Stomach Cramps"
 villains_religious_decision.0160.c:0 "Skip the river crossing, pray for victory at headquarters, and send a courier."
 stalin_five_year_plan_stakhanov_decision:0 "Five-Year Heavy Forge Plan and Shock-Worker Competition"
 stalin_five_year_plan_stakhanov_decision_desc:0 "If the revolutionary motherland is not to be crushed by surrounding enemies, we must cover a century of ironworking and fortress building in five short years! Decree merciless Five-Year blast-furnace quotas across every smithy and mine in the realm, and exalt a model shock-worker who hauled fourteen carts of ore in a single night to drive the masses into tireless competition."
 stalin_five_year_plan_stakhanov_decision_tooltip:0 "Inspect the grand ironworks in an event testing Stewardship for Five-Year construction quotas or Diplomacy and Martial for Stakhanovite fervor and Red Guard mobilization."
 stalin_five_year_plan_stakhanov_decision_confirm:0 "Never Let the Blast Furnaces Cool!"
 stalin_five_year_plan_event_preview_tt:0 "Choose between a #V Stewardship#! Five-Year quota drive, a #V Diplomacy and Martial#! shock-worker propaganda campaign with Red Guards, or safe convict quarry labor"
 villains_religious_decision.0170.t:0 "Roaring Blast Furnaces and the Fourteen-Cart Shock Worker"
 villains_religious_decision.0170.desc:0 "Inside the cavernous stone-and-timber ironworks thick with coal smoke and furnace heat, showers of orange sparks erupt from the anvil to the roar of giant leather bellows. Standing atop the wooden inspection walkway, I run a cold eye down the parchment scroll listing every province’s iron and weapon quotas.\n\n\"There are no fortresses or production quotas that true Bolsheviks cannot storm.\" Pointing from the railing toward the sweat-drenched smiths hammering glowing steel below, I weigh the next directive. Shall I enforce ruthless Five-Year heavy-industry quotas across every holding, or trumpet a legendary shock-worker who smashed his nightly target fourteen times over to ignite nationwide ideological fervor?"
 villains_religious_decision.0170.a:0 "Accept no excuses! Enforce over-fulfillment of the Five-Year heavy forge plan!"
 villains_religious_decision.0170.a.success:0 "Relentless Furnaces Drive Surging Construction and Output"
 villains_religious_decision.0170.a.failure:0 "Terrified Officials Falsify Ledgers, Triggering Supply Chaos"
 villains_religious_decision.0170.b:0 "Exalt the fourteen-cart master smith as a Hero of Labor to ignite mass fervor!"
 villains_religious_decision.0170.b.success:0 "Shock-Worker Fervor Rallies Loyal Red Guard Brigades"
 villains_religious_decision.0170.b.failure:0 "Whispers of a Staged Quota Record Spark Work Slowdowns"
 villains_religious_decision.0170.c:0 "Dispatch dungeon prisoners to frontier quarries and timber camps to meet quotas."
 stalin_shock_worker_brigade_name:0 "Stakhanovite Shock-Worker Brigade"
 trump_tariff_deal_master_modifier:0 "Master of Punitive Tariff Deals"
 trump_tariff_deal_master_modifier_desc:0 "Relentless pressure at the council table has reshaped tribute and tariff terms in the ruler’s favor."
 trump_youre_fired_authority_modifier:0 "Unforgiving Authority of Dismissal"
 trump_youre_fired_authority_modifier_desc:0 "Publicly dismissing an underperforming subject before the whole court has instilled fear and respect for a true winner."
 trump_bad_deal_humiliation_modifier:0 "Botched Tariff Deal Humiliation"
 trump_bad_deal_humiliation_modifier_desc:0 "Boastful tariff threats backfired over glaring ledger loopholes, denting the ruler’s reputation as a dealmaker."
 hitler_germania_grand_model_modifier:0 "Thousand-Year Architectural Blueprint"
 hitler_germania_grand_model_modifier_desc:0 "The monumental white limestone temple model drives masons and vassals into fanatical building zeal."
 hitler_cultural_purification_modifier:0 "Confiscated Art and Cultural Purge"
 hitler_cultural_purification_modifier_desc:0 "Strict cultural censorship and art seizures suppress subversive plots and reinforce ideological orthodoxy."
 hitler_rejected_artist_rage_modifier:0 "Scorned Architect’s Fury"
 hitler_rejected_artist_rage_modifier_desc:0 "Criticism of cherished architectural drawings has provoked an uncontrollable outburst that paralyzes court business."
 mussolini_shirtless_harvester_modifier:0 "Bare-Chested Harvester of Rome"
 mussolini_shirtless_harvester_modifier_desc:0 "Wielding a reaping sickle alongside peasant farmers under the blazing sun has won popular acclaim and vigor."
 mussolini_carriages_on_time_modifier:0 "Couriers Running Strictly on Time"
 mussolini_carriages_on_time_modifier_desc:0 "Reclaimed marshes and ironclad road discipline keep armies and tax couriers moving right on schedule."
 mussolini_sunstroke_fiasco_modifier:0 "Harvest Sunstroke Embarrassment"
 mussolini_sunstroke_fiasco_modifier_desc:0 "Collapsing from heat exhaustion during a theatrical harvest stunt has sapped both health and bravado."
 mussolini_bogged_down_public_works_modifier:0 "Bogged-Down Showcase Works"
 mussolini_bogged_down_public_works_modifier_desc:0 "Rushed embankments built for show have collapsed into mud, hampering local trade and tax collection."
 mutaguchi_miracle_ox_convoy_modifier:0 "Miraculous Jingisukan Ox Convoy"
 mutaguchi_miracle_ox_convoy_modifier_desc:0 "Against every law of military science, the water-buffalo pack column crossed the river intact to sustain the march!"
 mutaguchi_herbivore_march_spirit_modifier:0 "Herbivore Foraging and Blame Shifting"
 mutaguchi_herbivore_march_spirit_modifier_desc:0 "Fierce orders to graze on wild jungle greens and ruthless scapegoating force troops to march on sheer willpower."
 mutaguchi_drowned_buffalo_disaster_modifier:0 "Drowned Water-Buffalo Supply Disaster"
 mutaguchi_drowned_buffalo_disaster_modifier_desc:0 "Panicked water buffaloes swept away in the river rapids took the army’s precious rations down with them."
 mutaguchi_toxic_weed_stomachache_modifier:0 "Poisonous Weed Stomachache"
 mutaguchi_toxic_weed_stomachache_modifier_desc:0 "Boastfully swallowing random jungle weeds left the commander doubled over with acute stomach poisoning."
 stalin_five_year_plan_shock_work_modifier:0 "Five-Year Heavy Forge Drive"
 stalin_five_year_plan_shock_work_modifier_desc:0 "Unceasing blast furnaces and ruthless quota enforcement build fortresses and infrastructure at breakneck speed."
 stalin_stakhanovite_fervor_modifier:0 "Stakhanovite Hero of Labor Fervor"
 stalin_stakhanovite_fervor_modifier_desc:0 "The legend of the fourteen-fold quota hero spurs workers and soldiers alike into fervent ideological competition."
 stalin_falsified_quota_collapse_modifier:0 "Falsified Quota Ledger Collapse"
 stalin_falsified_quota_collapse_modifier_desc:0 "Officials terrified of punishment inflated paper figures, plunging real construction sites and revenues into chaos."
 kim_asymmetric_force_development_decision:0 "Develop Asymmetric Strategic Forces"
 kim_asymmetric_force_development_decision_desc:0 "Conventional blades and spears alone cannot deter mighty surrounding empires; we need an overwhelming strategic weapon capable of pulverizing enemy fortress walls in a single thunderous volley! Pour the realm’s copper, saltpeter, and treasury into our secret subterranean foundry to cast ten colossal bronze bombards far ahead of their era."
 kim_asymmetric_force_development_decision_tooltip:0 "Ignite the underground cannon foundry to attempt a low-probability gamble for a ten-gun bombard regiment or stage a deceptive night parade."
 kim_asymmetric_force_development_decision_confirm:0 "Light the Underground Cannon Furnaces!"
 kim_asymmetric_force_development_event_preview_tt:0 "Triggers a low-odds test-firing gamble to produce an inheritable #V 10 Bombard#! special regiment or an #V Intrigue#! dummy-cannon parade bluff."
 villains_religious_decision.0180.t:0 "Test-Firing in the Secret Underground Foundry"
 villains_religious_decision.0180.desc:0 "Amid choking sulfur smoke and glowing molten metal deep inside the subterranean stone arsenal, ten colossal cast-bronze barrels rest atop heavy oak siege carriages. Trembling scribes and master founders warn that with present metallurgy, the slightest flaw in bronze thickness or black-powder mixture will shatter the barrels and bring the vault crashing down.\n\nYet a single successful test-firing will grant an unstoppable strategic deterrent capable of reducing any fortress under heaven to rubble. Shall we stake the founders’ heads on a double powder charge, or fool every foreign spy with black-lacquered pine logs?"
 villains_religious_decision.0180.a:0 "Cast the bronze barrels to exact measure and order the live test-firing!"
 villains_religious_decision.0180.a.success:0 "Earth-shattering thunder roars as ten colossal bombards succeed!"
 villains_religious_decision.0180.a.failure:0 "The bronze barrel cracks under pressure and bursts into fragments"
 villains_religious_decision.0180.b:0 "Put the artisans’ necks on the line and pack double the black powder! Fire!"
 villains_religious_decision.0180.b.success:0 "A miraculous pillar of flame heralds an invincible bombard battery!"
 villains_religious_decision.0180.b.failure:0 "The overcharged barrel bursts and flying bronze shrapnel inflicts a wound"
 villains_religious_decision.0180.b.critical_failure:0 "A chain detonation collapses the foundry dais and inflicts a severe wound!"
 villains_religious_decision.0180.c:0 "Stage a torchlight parade with pine logs painted in black iron lacquer."
 villains_religious_decision.0180.c.success:0 "Foreign spies mistake the massive painted logs for invincible cannons"
 villains_religious_decision.0180.c.failure:0 "A sudden downpour washes away the black ink and exposes bare pine wood"
 kim_juche_bombard_regiment_name:0 "Juche Hwasong Bombard Battery"
 kim_asymmetric_deterrence_modifier:0 "Self-Reliant Bombard Deterrence"
 kim_asymmetric_deterrence_modifier_desc:0 "The thunderous roar of colossal bronze bombards ahead of their age keeps rival realms and vassals alike locked in awe and obedience."
 kim_failed_foundry_explosion_modifier:0 "Underground Foundry Explosion Fallout"
 kim_failed_foundry_explosion_modifier_desc:0 "A catastrophic blast during reckless cannon testing reduced precious materials to ash and stirred bitter public discontent."
 kim_wooden_cannon_bluff_modifier:0 "Lacquered Log Cannon Deterrence"
 kim_wooden_cannon_bluff_modifier_desc:0 "Massive black-lacquered pine logs paraded by torchlight have thoroughly deceived foreign spies, deterring hostile plots without firing a shot."
