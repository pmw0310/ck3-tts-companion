 artifact_rasputin_hypnotic_cross_name:0 "Saint Grigori's Hypnotic Cross & Madeira Flask"
 artifact_rasputin_hypnotic_cross_desc:0 "A silver-wrought Eastern eight-pointed cross paired with a dark ruby flask of sweet Madeira wine. Passed down through House Rasputin, it imbues its bearer with an unblinking hypnotic gaze, uncanny resilience against assassination, and irresistible allure."
 rasputin_hypnotic_cross_modifier:0 "Saint Grigori's Hypnotic Cross & Madeira Flask"
 rasputin_hypnotic_cross_modifier_desc:0 "The gleam of the eight-pointed silver cross and the sweet aroma of Madeira disarm suspicion while empowering seduction and uncanny vitality."
 rasputin_found_khlystism_decision:0 "Found the Secret Mysteries of Khlystism"
 rasputin_found_khlystism_decision_desc:0 "Long enough have we worn the orthodox mask of a Chalcedonian pilgrim while whispering forbidden mysteries in candlelit chambers! Now that devoted lovers and followers hang upon our every word, we shall cast off hypocritical priesthoods, proclaim the ecstatic sect of Khlystism, and ascend as the Living Vessel of the Spirit!"
 rasputin_found_khlystism_decision_tooltip:0 "Conduct the underground Khlyst founding rite to become temporal head of faith, testing Learning or Diplomacy for additional fervor."
 rasputin_found_khlystism_decision_confirm:0 "Fear not sacred sin, for through me comes salvation!"
 rasputin_found_khlystism_lovers_req_tt:0 "You have at least 3 nobleborn lovers"
 rasputin_found_khlystism_convert_followers_tt:0 "All of your camp followers, courtiers, and non-ruler lovers immediately embrace Khlystism"
 rasputin_living_vessel_modifier:0 "Living Vessel of the Spirit"
 rasputin_living_vessel_modifier_desc:0 "Revered as a living vessel of divine ecstasy, the starets commands fanatical devotion and magnetic allure among believers."
 rasputin_miracle_healing_intrigue_decision:0 "Bedchamber Miracle Healing & Shadow Intrigue"
 rasputin_miracle_healing_intrigue_decision_desc:0 "Summoned in secret to the candlelit bedchambers of anxious nobles and ailing heirs, we shall soothe their torment with fervent prayer and Siberian herbal remedies! Grateful patrons will shower our camp with gold and provisions—while entrusting their deepest family vulnerabilities into our hands!"
 rasputin_miracle_healing_intrigue_decision_tooltip:0 "Hold a midnight healing vigil where an Intrigue duel against the patron ruler or a Learning remedy check determines hooks and offerings."
 rasputin_miracle_healing_intrigue_decision_confirm:0 "Look into my eyes... the pain fades, and only my voice remains."
 rasputin_miracle_healing_target_realm_tt:0 "Your camp is pitched in a county held by another ruler, or you reside in a valid county"
