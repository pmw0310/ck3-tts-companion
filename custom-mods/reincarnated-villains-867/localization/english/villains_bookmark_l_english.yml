 bolshevism_adherent_plural:0 "Bolsheviks"
 bolshevism_desc:0 "A radical revolutionary ideology preaching the collective ownership of all land and means of production, iron party discipline, ruthless power struggle, and relentless world revolution. It seeks to smash feudal hierarchy and subject all society to the directives of the Central Committee and the General Secretary."
