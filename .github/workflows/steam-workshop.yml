name: Steam Workshop Auto Update (Manual Only)

on:
  # push 및 release 자동 트리거는 스팀 가드 15일 쿨다운 해제 전까지 비활성화합니다.
  # push:
  #   paths:
  #     - 'ck3-mod/**'
  #   branches:
  #     - main
  # release:
  #   types: [published]
  workflow_dispatch: # Actions 탭에서 수동 실행(Run workflow)할 때만 동작

jobs:
  upload-workshop:
    name: Upload CK3 Mod to Steam Workshop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Steam Workshop
        uses: hmlendea/steam-workshop-update@latest
        with:
          appid: '1158310'
          itemid: '3824371603'
          path: 'ck3-mod'
          changenote: 'Automated update via GitHub Actions'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_2FASEED: ${{ secrets.STEAM_2FASEED }}

