name: Steam Workshop Auto Update

on:
  push:
    paths:
      - 'ck3-mod/**'
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  upload-workshop:
    name: Upload CK3 Mod to Steam Workshop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Steam Workshop
        uses: hmlendea/steam-workshop-update@latest
        with:
          appid: 1158310
          itemid: 3824371603
          path: './ck3-mod'
          changenote: 'Automated update via GitHub Actions (${{ github.sha }})'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_2FASEED: ${{ secrets.STEAM_2FASEED }}

